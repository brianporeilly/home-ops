---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Scan Report

on:
  schedule:
    # 06:17 UTC daily - offset from the hour to avoid the scheduled-job
    # pile-up GitHub warns about.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Scan all pinned images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          cache: true

      - name: Cache Trivy DB
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan every pinned image
        run: |
          mkdir -p /tmp/results
          python3 scripts/extract-images.py $(find kubernetes/apps -name helmrelease.yaml) > /tmp/images.txt
          echo "Scanning $(wc -l < /tmp/images.txt) images"

          n=0
          while read -r image; do
            n=$((n + 1))
            # One run's worth of scan results per image, named by index so
            # slashes/colons/@ in the image ref don't need sanitizing.
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json \
              --output "/tmp/results/${n}.json" \
              "$image" || echo "::warning::Trivy failed on $image, skipping"
          done < /tmp/images.txt

      - name: Build report
        id: report
        run: |
          python3 scripts/aggregate-scan-results.py /tmp/results > /tmp/report.md
          {
            echo "## Image Scan Report"
            echo ""
            echo "_$(date -u +'%Y-%m-%d %H:%M UTC')_"
            echo ""
            cat /tmp/report.md
          } > /tmp/full-report.md
          cat /tmp/full-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create image-scan-report --color FF6B6B --description "Scheduled HIGH/CRITICAL image vulnerability report" --force

          ISSUE_NUMBER=$(gh issue list --label image-scan-report --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file /tmp/full-report.md
          else
            gh issue create --title "Image Scan Report" --label image-scan-report --body-file /tmp/full-report.md
          fi
