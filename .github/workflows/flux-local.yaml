---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Local

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.3.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/flux -v

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin

      - name: Build and validate all manifests
        run: |
          docker run --rm \
            -e XDG_CACHE_HOME=/tmp \
            -v ${{ github.workspace }}:/github/workspace \
            ghcr.io/allenporter/flux-local:v8.3.0 \
            build all --enable-helm /github/workspace/kubernetes/flux \
            > /tmp/rendered.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/rendered.yaml

  diff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Diff ${{ matrix.resource }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource: [helmrelease, kustomization]
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.3.0
        with:
          args: >-
            diff ${{ matrix.resource }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux
            --path-orig /github/workspace/default/kubernetes/flux
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          if [ -s diff.patch ]; then
            echo "diff<<EOF" >> "$GITHUB_OUTPUT"
            cat diff.patch >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "diff=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: mshick/add-pr-comment@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: ${{ github.event.pull_request.number }}/${{ matrix.resource }}
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
