---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Scan

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/apps/**/helmrelease.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # For add-pr-comment's attach-path artifact upload (full per-CVE report).
  actions: write

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Diff image refs
        id: diff
        run: |
          # Extracting every image ref from each full tree and diffing the
          # sets (rather than diffing file-by-file) means a digest bump, a
          # brand-new app, or a values-only edit are all handled the same
          # way - only refs genuinely new to the PR end up in new-images.txt.
          python3 pull/scripts/extract-images.py $(find base/kubernetes/apps -name helmrelease.yaml) | sort -u > /tmp/base-images.txt
          python3 pull/scripts/extract-images.py $(find pull/kubernetes/apps -name helmrelease.yaml) | sort -u > /tmp/pull-images.txt
          comm -23 /tmp/pull-images.txt /tmp/base-images.txt > /tmp/new-images.txt
          echo "New/changed images:"
          cat /tmp/new-images.txt
          if [ -s /tmp/new-images.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Trivy
        if: steps.diff.outputs.found == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          cache: true

      - name: Scan new/changed images
        if: steps.diff.outputs.found == 'true'
        id: scan
        run: |
          mkdir -p /tmp/results
          n=0
          while read -r image; do
            n=$((n + 1))
            # No --exit-code here - the loop needs to keep scanning every
            # image even after one comes back critical (this run step uses
            # bash -e by default, and --exit-code 1 would abort the whole
            # step on the first hit). Pass/fail is decided afterward from
            # the aggregated results instead.
            trivy image \
              --severity CRITICAL \
              --ignore-unfixed \
              --format json \
              --output "/tmp/results/${n}.json" \
              "$image" || echo "::warning::Trivy failed on $image, skipping"
          done < /tmp/new-images.txt

          if grep -rl '"Severity": *"CRITICAL"' /tmp/results/*.json > /dev/null 2>&1; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build report
        if: steps.scan.outputs.critical == 'true'
        run: |
          python3 pull/scripts/aggregate-scan-results.py /tmp/results > /tmp/summary.md
          python3 pull/scripts/aggregate-scan-results.py /tmp/results --full > /tmp/full.md
          {
            echo "🚨 Trivy found fixable **CRITICAL** vulnerabilities in this PR's changed images."
            echo ""
            cat /tmp/summary.md
          } > /tmp/summary-report.md
          {
            echo "## Image Scan (full detail)"
            echo ""
            cat /tmp/full.md
          } > /tmp/full-report.md

      - name: Post scan report
        if: steps.scan.outputs.critical == 'true'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-id: image-scan
          message-path: /tmp/summary-report.md
          attach-path: /tmp/full-report.md
          attach-name: image-scan-full-report
          attach-text: "Full per-CVE breakdown: %ARTIFACT_URL%"
          truncate: artifact

      - name: Fail on CRITICAL findings
        if: steps.scan.outputs.critical == 'true'
        run: |
          echo "::error::Trivy found fixable CRITICAL vulnerabilities - see the PR comment for details."
          exit 1
