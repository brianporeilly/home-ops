---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  namespace: kopiur-system
  annotations:
    # kopia-ui's own Basic Auth is disabled now (see ../clusterrepository.yaml -
    # server.auth.insecure) since an Authentik SecurityPolicy fronts this
    # route instead (../securitypolicy.yaml). An unauthenticated request now
    # gets a 302 to Authentik's login, not a 401 from kopia-ui itself - same
    # "prove the gate is up, not just that something eventually loads"
    # intent as before. Gatus follows redirects by default
    # (client.ignore-redirect: false), so ignore-redirect: true is needed to
    # actually observe the 302 from the SecurityPolicy gate rather than
    # whatever status Authentik's login page itself returns three hops later.
    gatus.home-operations.com/endpoint: |-
      client:
        ignore-redirect: true
      conditions: ["[STATUS] == 302"]
spec:
  hostnames:
    - kopiur.internal.oreillys.io
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # Service created by the ClusterRepository's spec.server block -
        # named <repository-name>-kopia-ui, port 51515, per kopiur's docs.
        - name: nas-backups-kopia-ui
          port: 51515
