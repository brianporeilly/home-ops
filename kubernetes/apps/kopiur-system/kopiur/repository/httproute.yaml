---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  namespace: kopiur-system
spec:
  hostnames:
    - kopiur.internal.oreillys.io
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # Service created by the ClusterRepository's spec.server block -
        # named <repository-name>-kopia-ui, port 51515, per kopiur's docs.
        - name: nas-backups-kopia-ui
          port: 51515
