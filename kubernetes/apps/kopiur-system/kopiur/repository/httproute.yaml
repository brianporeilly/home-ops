---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  namespace: kopiur-system
  annotations:
    # kopia-ui enforces HTTP basic auth on every path including /, so a plain
    # GET always returns 401 - that's correct behavior, not a failure. Not
    # configuring Gatus with real credentials here (they'd sit in git as a
    # plaintext annotation, unlike sops-encrypted secrets); a clean 401 is
    # itself proof the service is up and enforcing auth, which is what the
    # check actually needs to confirm.
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - kopiur.internal.oreillys.io
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        # Service created by the ClusterRepository's spec.server block -
        # named <repository-name>-kopia-ui, port 51515, per kopiur's docs.
        - name: nas-backups-kopia-ui
          port: 51515
