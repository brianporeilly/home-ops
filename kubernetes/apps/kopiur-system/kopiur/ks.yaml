---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
  namespace: &namespace kopiur-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/kopiur-system/kopiur/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app2 kopiur-repository
  namespace: &namespace2 kopiur-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app2
  components:
    - ../../../../components/authentik/protect
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    # Reflector-mirror race - see download/lidarr/ks.yaml for the incident.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/kopiur-system/kopiur/repository
  postBuild:
    substitute:
      APP: kopiur-ui
      HTTPROUTE_NAME: kopiur-ui
      HOSTNAME: kopiur.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace2
  timeout: 5m
  wait: false
