---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: download
components:
  - ../../components/common
patches:
  - target:
      kind: Namespace
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        annotations:
          # kopiur mover pods for qbittorrent/lazylibrarian/qui/mylar3 run their
          # app containers as root - the mover has to match to read the PVC
          # data, and kopiur gates any UID-0 mover behind this explicit opt-in.
          kopiur.home-operations.com/privileged-movers: "true"
resources:
  - ./qbittorrent/ks.yaml
  - ./qui/ks.yaml
  - ./qui/bootstrap/ks.yaml
  - ./sabnzbd/ks.yaml
  - ./sonarr/ks.yaml
  - ./radarr/ks.yaml
  - ./prowlarr/ks.yaml
  - ./prowlarr/bootstrap/ks.yaml
  - ./recyclarr/ks.yaml
  - ./lidarr/ks.yaml
  - ./lazylibrarian/ks.yaml
  - ./mylar3/ks.yaml
  - ./bazarr/ks.yaml
  - ./configarr/ks.yaml
  - ./arr-notifications/ks.yaml
  - ./slskd/ks.yaml
  - ./soularr/ks.yaml
