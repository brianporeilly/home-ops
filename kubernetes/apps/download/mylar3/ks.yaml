---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mylar3
  namespace: &namespace download
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # mylar3 (linuxserver s6-overlay) runs its app container as root - the
  # SnapshotPolicy needed root + DAC_OVERRIDE to back up in the first
  # place (see the equivalent comment in download/qui/ks.yaml), so
  # restoring it needs mover.privilegedMode: true too - see the
  # equivalent comment in home/esphome/ks.yaml.
  patches:
    - target:
        kind: Restore
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: mylar3
        spec:
          mover:
            privilegedMode: true
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/download/mylar3/app
  postBuild:
    substitute:
      APP: mylar3
      PVC: mylar3-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false