---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/secret.json
# Seeded on first run only (mirrors lazylibrarian's config-seed pattern -
# see that app's secret.yaml/helmrelease.yaml init-config). Mylar3 has no
# config API and no config.ini hot-reload (read once at process startup,
# see mylar/__init__.py's initialize()), so this only takes effect the
# very first time the pod starts with an empty config PVC - it is never
# re-applied on top of an existing config.ini, and Mylar3's own writeconfig()
# will happily rewrite this file with whatever the UI/API changes afterward.
#
# api_key is a fixed, arbitrary value (not a real external credential) so
# prowlarr-bootstrap (kubernetes/apps/download/prowlarr/bootstrap) can
# register Mylar3 as a Prowlarr Application and let Prowlarr manage its
# Newznab/Torznab indexers going forward - Mylar3's own EXTRA_NEWZNABS
# config.ini key is an undocumented delimited blob, not something worth
# hand-authoring. The same value must be set as MYLAR3_API_KEY in
# kubernetes/apps/download/prowlarr/bootstrap/app/secret.yaml (sops-edit
# that file directly - never regenerate it wholesale).
apiVersion: v1
kind: Secret
metadata:
  name: mylar3-config-seed
stringData:
  config.ini: |
    [General]
    destination_dir = /media/comics
    create_folders = 1

    [API]
    api_enabled = 1
    api_key = 8190aa356c9520b07f773fbe24c21e56

    [CV]
    comicvine_api = CHANGEME_COMICVINE_API_KEY

    [SABnzbd]
    sab_host = http://sabnzbd.download.svc.cluster.local:8080
    sab_apikey = CHANGEME_SAB_API_KEY
    sab_category = comics
    sab_directory = /media/downloads/usenet/complete
    sab_client_post_processing = 1

    [qBittorrent]
    qbittorrent_host = http://qbittorrent.download.svc.cluster.local:8080
    qbittorrent_username = CHANGEME_QBITTORRENT_USERNAME
    qbittorrent_password = CHANGEME_QBITTORRENT_PASSWORD
    qbittorrent_folder = /media/downloads/torrents/complete

    [SLACK]
    slack_enabled = 1
    slack_webhook_url = CHANGEME_SLACK_WEBHOOK_URL
    slack_onsnatch = 1
