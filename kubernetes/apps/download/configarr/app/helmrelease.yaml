---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: configarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: configarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      configarr:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: ghcr.io/raydak-labs/configarr
              tag: 1.30.1@sha256:8c4f49180fe23eb3d41409efe065c3709c85a94410054e467e202242057bfb88
            env:
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
              LIDARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-secret
                    key: LIDARR__AUTH__APIKEY
              QBT_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-creds
                    key: QBT_API_KEY
              SABNZBD_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sabnzbd-creds
                    key: SABNZBD__API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      # Image has no USER directive and bakes `git config --global safe.directory '*'`
      # into /root/.gitconfig at build time (needed for the TRaSH-Guides/recyclarr-config
      # repo clones it does unconditionally on every run) - runs as root by design.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /app/config/config.yml
            subPath: config.yml
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      repos:
        type: emptyDir
        globalMounts:
          - path: /app/repos
