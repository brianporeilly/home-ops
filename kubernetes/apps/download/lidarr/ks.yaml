---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lidarr
  namespace: &namespace download
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/authentik/protect
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
    # components/authentik/protect's Reflector-mirrored oidc-client-secret
    # can otherwise lose a race against authentik/app's own ExternalSecret -
    # confirmed live (whisker's rollout hit this: Reflector's one mirror
    # attempt fired before the source Secret existed and never retried,
    # SecurityPolicy stuck rejected until manually kicked). This doesn't
    # fully close the window (ExternalSecret->real Secret is still async
    # after authentik's Kustomization goes Ready), but removes the
    # unordered-parallel-apply case, which is what actually happened.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/download/lidarr/app
  postBuild:
    substitute:
      APP: lidarr
      PVC: lidarr-config
      HTTPROUTE_NAME: lidarr-app
      HOSTNAME: lidarr.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false