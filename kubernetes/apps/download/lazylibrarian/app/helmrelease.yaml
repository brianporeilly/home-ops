---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: lazylibrarian
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      lazylibrarian:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -f /config/config.ini ]; then
                  echo "Seeding config.ini (SABnzbd + qBittorrent downloaders, NZBPlanet via Prowlarr indexer, first run)"
                  cp /seed/config.ini /config/config.ini
                else
                  echo "config.ini already exists, leaving it alone"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/lazylibrarian
              tag: 0ab151c8-ls326@sha256:598f730b725f0b9aded4bf762c167a260f847510a6da493365d2fa8137a9dd52
            env:
              # linuxserver s6-overlay v2: makes init-stage2 hiercopy the
              # cont-init.d/services.d scripts into /var/run/s6 (writable
              # emptyDir) instead of symlinking them onto the read-only rootfs.
              # Without this, fix-attrs can't chmod the scripts (EROFS) and
              # s6-supervise fails with "unable to exec run: Permission denied".
              S6_READ_ONLY_ROOT: "1"
              PUID: "1000"
              PGID: "1000"
              TZ: America/Anchorage
              # Optional: uncomment to pull in calibredb for the metadata-embed
              # hook (Settings > Processing > Calibredb import program:
              # /usr/bin/calibredb). Leave unset to do that step manually.
              # DOCKER_MODS: linuxserver/mods:universal-calibre
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5299
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            # linuxserver images are designed to start as root (s6 init chowns to
            # PUID/PGID and fix-attrs chmods the service scripts); the app itself
            # drops to abc (1000) via s6-setuidgid. The s6-overlay preinit/fix-attrs
            # steps need CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID to do that work.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        # linuxserver s6-overlay images must start as root; PUID/PGID drops the
        # app to 1000. fsGroup 1000 keeps /config owned 1000:1000 like other apps.
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: lazylibrarian
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - lazylibrarian.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "2Gi"
        globalMounts:
          - path: /config
      # Seeded on first run only (mirrors the sabnzbd-config-seed pattern):
      # downloaders (SABnzbd/qBittorrent) + NZBPlanet (via Prowlarr) indexer.
      config-seed:
        type: secret
        name: lazylibrarian-config-seed
        advancedMounts:
          lazylibrarian:
            init-config:
              - path: /seed/config.ini
                subPath: config.ini
                readOnly: true
      # Where LazyLibrarian post-processes/renames completed grabs to.
      # Point Settings > Processing > Destination/eBook folder here.
      # For now this is a standalone PVC - move/rsync into grimmory's
      # bookdrop manually until shared (RWX/NFS) storage is available.
      downloads:
        suffix: downloads
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "20Gi"
        globalMounts:
          - path: /downloads
      # s6-overlay (linuxserver base image) needs a writable /run to create its
      # socket/pid dirs; /var/run is a symlink to /run on the Debian base. With
      # readOnlyRootFilesystem + S6_READ_ONLY_ROOT=1, this emptyDir receives the
      # hiercopied cont-init.d/services.d scripts that init-stage2 then chmods.
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
