---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/main/config/crd/experimental/gateway.networking.k8s.io_httproutes.yaml
# See sonarr/app/api-route.yaml for the full rationale - same pattern,
# unauthenticated-at-the-Gateway /api path for direct API clients
# (LunaSea etc.), still gated by Prowlarr's own API key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-api
spec:
  hostnames:
    - prowlarr.internal.oreillys.io
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: prowlarr
          port: 9696
