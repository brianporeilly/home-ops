---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prowlarr
  namespace: &namespace download
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/authentik/protect
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
    # components/authentik/protect's Reflector mirror can lose a race
    # against authentik's own ExternalSecret - see lidarr/ks.yaml for the
    # full incident (confirmed live via whisker's rollout).
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/download/prowlarr/app
  postBuild:
    substitute:
      APP: prowlarr
      PVC: prowlarr-config
      HTTPROUTE_NAME: prowlarr-app
      HOSTNAME: prowlarr.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false