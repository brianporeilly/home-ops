---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowlarr-bootstrap
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prowlarr-bootstrap
        spec:
          restartPolicy: OnFailure
          # Runs as root: apk needs to write /lib/apk/db to install curl/jq,
          # which a non-root UID can't do (same tradeoff as qbittorrent's own
          # container in this repo - image has no non-root-friendly package
          # cache). Still allowPrivilegeEscalation: false + drop ALL below.
          containers:
            - name: prowlarr-bootstrap
              image: docker.io/library/alpine:3.24@sha256:5b02b42e375f7426f8d65c3af331ca05d9878f9989230354504e0b9dfd431f60
              command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/bootstrap.sh"]
              env:
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-secret
                      key: PROWLARR__AUTH__APIKEY
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sonarr-secret
                      key: SONARR__AUTH__APIKEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: radarr-secret
                      key: RADARR__AUTH__APIKEY
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lidarr-secret
                      key: LIDARR__AUTH__APIKEY
                # Fixed value baked into mylar3's own seeded config.ini
                # (kubernetes/apps/download/mylar3/app/secret.yaml,
                # [API] api_key) - must match that value exactly.
                - name: MYLAR3_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-bootstrap-creds
                      key: MYLAR3_API_KEY
                - name: NZBPLANET_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-bootstrap-creds
                      key: NZBPLANET_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prowlarr-bootstrap-scripts
                defaultMode: 0555
