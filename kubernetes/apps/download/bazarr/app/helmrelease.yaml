---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bazarr
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      bazarr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            env:
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
            # NB: intentionally $VAR, not ${VAR}, throughout this script -
            # Flux's postBuild.substitute (enabled on this Kustomization for
            # the kopiur ${APP}/${PVC} vars) does a blanket ${...} text
            # replacement across the whole rendered manifest, this shell
            # script included, and fails the build on any brace-form
            # reference not in that map ("variable not set (strict mode):
            # SONARR_API_KEY").
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /config/config
                if [ ! -f /config/config/config.yaml ]; then
                  echo "Seeding Bazarr config.yaml (Sonarr/Radarr connections + WebUI credentials pre-configured, first run)"
                  cp /seed/config.yaml /config/config/config.yaml
                  sed -i "s|__SONARR_API_KEY__|$SONARR_API_KEY|g" /config/config/config.yaml
                  sed -i "s|__RADARR_API_KEY__|$RADARR_API_KEY|g" /config/config/config.yaml
                else
                  echo "Bazarr config.yaml already exists, leaving it alone"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.2@sha256:5ed5fc54eee7157ce8a5e3a03c8ef41092a0111b11eab702e4fbdd700d71457b
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 6767
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: bazarr
        ports:
          http:
            port: 6767

    route:
      app:
        hostnames:
          - bazarr.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /config
      config-seed:
        type: secret
        name: bazarr-config-seed
        advancedMounts:
          bazarr:
            init-config:
              - path: /seed/config.yaml
                subPath: config.yaml
                readOnly: true
      # NAS static NFS mount - whole export, so subtitle files land next to
      # the tv/movies files Sonarr/Radarr report at matching paths.
      media:
        type: nfs
        server: 10.20.30.11
        path: /media
        globalMounts:
          - path: /media
      tmpfs:
        type: emptyDir
        advancedMounts:
          bazarr:
            app:
              - path: /tmp
