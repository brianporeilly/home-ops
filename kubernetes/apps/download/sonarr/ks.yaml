---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
  namespace: &namespace download
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/authentik/protect
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
    # Reflector-mirror race - see lidarr/ks.yaml for the incident.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/download/sonarr/app
  postBuild:
    substitute:
      APP: sonarr
      PVC: sonarr-config
      HTTPROUTE_NAME: sonarr-app
      HOSTNAME: sonarr.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false