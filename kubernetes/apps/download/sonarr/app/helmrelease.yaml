---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19.3011@sha256:47d56de90c81eb2a8f0d36771328a95e7299609579b88db82b1473c314f26a47
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              SONARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - sonarr.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      # Unauthenticated (at the Gateway level) path for direct API clients
      # (LunaSea etc.) that can't complete an OIDC redirect - Gateway
      # API's cross-route precedence (longest path match wins) sends
      # /api traffic here instead of through the SecurityPolicy-protected
      # app route below. Adding this second route key renames that one
      # from `sonarr` to `sonarr-app` (see ks.yaml's HTTPROUTE_NAME) -
      # confirmed via `helm template` against this chart version. Still
      # gated by Sonarr's own API key - confirmed live that /api/v3/*
      # returns 401 without one even for in-cluster requests, so this
      # isn't a net new exposure versus the pre-SSO baseline.
      api:
        annotations:
          # No 401-expecting UI check for this one - not meaningful to
          # monitor and Gatus would otherwise flag it as always-down.
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - sonarr.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "5Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: sonarr
        globalMounts:
          - path: /config
      config-cache:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        globalMounts:
          - path: /config/MediaCover
      # NAS static NFS mount - whole export. Needed (not just /media/tv) so
      # hardlink-import from downloads/complete/ into tv/ works: hardlinks
      # only work within a single mount, so both sides must be visible here.
      media:
        type: nfs
        server: 10.20.30.11
        path: /media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir