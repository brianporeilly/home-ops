---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0@sha256:37f7b378a29ceb4c551b1b5582e27747b855bbfaa73fa11914fe0df028dc581f
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /config/qBittorrent/config
                if [ ! -f /config/qBittorrent/config/qBittorrent.conf ]; then
                  echo "Seeding qBittorrent.conf (WebUI credentials pre-configured, first run)"
                  cp /seed/qBittorrent.conf /config/qBittorrent/config/qBittorrent.conf
                else
                  echo "qBittorrent.conf already exists, leaving it alone"
                fi
                chown -R 1000:1000 /config
        containers:
          app:
            image:
              repository: docker.io/qbittorrentofficial/qbittorrent-nox
              tag: 5.2.3-1@sha256:eabf3ceeeffd5fc7fbdde84c1400ac717f553127d1326aa40c46a5b9f14304d5
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: UTC
              UMASK: "002"
              QBT_LEGAL_NOTICE: confirm
              QBT_WEBUI_PORT: "8080"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ "ALL" ]
                add: [ "CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID" ]
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: qbittorrent
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - qbittorrent.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /config
      config-seed:
        type: secret
        name: qbittorrent-config-seed
        advancedMounts:
          qbittorrent:
            init-config:
              - path: /seed/qBittorrent.conf
                subPath: qBittorrent.conf
                readOnly: true
      # TODO: Replace with NAS NFS mount when available.
      # Ceph-backed PVC for download staging works but is expensive for
      # transient torrent data.  Switch to NAS-backed NFS + hardlink
      # completion once the NFS CSI driver is wired up.
      downloads:
        suffix: downloads
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "100Gi"
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
