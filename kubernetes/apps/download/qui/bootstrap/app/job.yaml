---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qui-bootstrap
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qui-bootstrap
        spec:
          restartPolicy: OnFailure
          # Runs as root: apk needs to write /lib/apk/db to install curl/jq,
          # which a non-root UID can't do (same tradeoff as qbittorrent's own
          # container in this repo - image has no non-root-friendly package
          # cache). Still allowPrivilegeEscalation: false + drop ALL below.
          containers:
            - name: qui-bootstrap
              image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/bootstrap.sh"]
              envFrom:
                - secretRef:
                    name: qui-bootstrap-creds
                - secretRef:
                    name: qbittorrent-creds
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: qui-bootstrap-scripts
                defaultMode: 0555
