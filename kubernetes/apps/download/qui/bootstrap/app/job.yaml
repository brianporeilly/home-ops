---
apiVersion: batch/v1
kind: Job
metadata:
  name: qui-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qui-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qui-bootstrap
          image: docker.io/library/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/bootstrap.sh"]
          envFrom:
            - secretRef:
                name: qui-bootstrap-creds
            - secretRef:
                name: qbittorrent-creds
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: qui-bootstrap-scripts
            defaultMode: 0555
