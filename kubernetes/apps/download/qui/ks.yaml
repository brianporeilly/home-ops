---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
  namespace: &namespace download
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # qui's root UID only comes from its image's own USER line, not a pinned
  # pod/container securityContext - invisible to the component's
  # inheritSecurityContextFrom.pvcConsumer, so it needs an explicit override.
  # download namespace carries the privileged-movers opt-in for this.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: qui
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/download/qui/app
  postBuild:
    substitute:
      APP: qui
      PVC: qui-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
