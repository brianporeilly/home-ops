# sops --encrypt secret.yaml
apiVersion: v1
kind: Secret
metadata:
    name: soularr-secret
stringData:
    # slskd currently runs with SLSKD_NO_AUTH=true and no web.authentication.api_keys
    # configured, so soularr's Slskd API key isn't actually verified server-side today.
    # Left blank on purpose - TODO(human): if you ever add a real api_keys entry to
    # slskd's config, put the matching key here.
    SLSKD_API_KEY: "1234"
