---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soularr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: soularr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      soularr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mrusse/soularr
              tag: 1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20
            env:
              # Entrypoint (run.sh) loops soularr.py forever, sleeping this
              # many seconds between runs - there's no cronjob/scheduling
              # to do at the k8s level, it's a persistent pod.
              SCRIPT_INTERVAL: "300"
              WEBUI_ENABLED: "true"
              LIDARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-secret
                    key: LIDARR__AUTH__APIKEY
              SLSKD_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: soularr-secret
                    key: SLSKD_API_KEY
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8265
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              # Deliberately separate from readiness, and checks more than
              # the webUI - confirmed live (2026-09-01) that soularr.py can
              # hang indefinitely mid-cycle (stuck after a slskd restart
              # produced a burst of connection-refused errors) while the
              # webUI thread stays perfectly healthy throughout, so a
              # webUI-only check (readiness above) never notices: the pod
              # just silently stops downloading/importing anything while
              # reporting Ready/Running forever. soularr.py writes
              # substantial log output on every real cycle regardless of
              # whether new albums are found (SCRIPT_INTERVAL=300s), so a
              # stale log file is a reliable "the sync loop is stuck, not
              # just between runs" signal - 20min is ~4x the expected
              # cycle interval, generous enough to avoid false positives
              # from one slow cycle. Kept off readiness on purpose: a stuck
              # sync loop should restart the container, but shouldn't also
              # pull the webUI out of Service endpoints - you want to
              # still be able to reach it to see what's going on.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - curl -sf http://localhost:8265/ >/dev/null && find /data/soularr.log -mmin -20 | grep -q .
                  initialDelaySeconds: 120
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: soularr
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - soularr.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /data
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /data/config.ini
            subPath: config.ini
      # Same NFS path slskd itself mounts, so the paths soularr reads/writes
      # against (Slskd.download_dir / Lidarr.download_dir in config.ini)
      # resolve to the same physical files slskd and lidarr see.
      media:
        type: nfs
        server: 10.20.30.11
        path: /media/downloads/soulseek
        globalMounts:
          - path: /media/downloads/soulseek
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
