[Lidarr]
# API key is injected via the LIDARR_API_KEY env var (from the existing
# lidarr-secret) - soularr expands ${VAR} references at read time.
api_key = ${LIDARR_API_KEY}
host_url = http://lidarr.download.svc.cluster.local:8686
# Path to the slskd downloads dir, as seen from *this* container. Lidarr
# mounts the whole /media NFS export at /media, so this resolves the same
# way inside the lidarr container too.
download_dir = /media/downloads/soulseek/complete
disable_sync = False

[Slskd]
# slskd currently runs with SLSKD_NO_AUTH=true (no web.authentication.api_keys
# configured), so this value is not actually checked - it just needs to be
# non-empty. See SLSKD_API_KEY in secret.yaml if that ever changes.
api_key = ${SLSKD_API_KEY}
host_url = http://slskd.download.svc.cluster.local:80
url_base = /
# Same physical NFS path slskd itself mounts (see slskd's
# directories.downloads in kubernetes/apps/download/slskd/app/helmrelease.yaml).
download_dir = /media/downloads/soulseek/complete
delete_searches = False
stalled_timeout = 3600
remote_queue_timeout = 300

[Release Settings]
use_selected_lidarr_release = False
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
skip_region_check = False
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
minimum_filename_match_ratio = 0.8
minimum_search_interval = 5
allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
album_prepend_artist = False
search_type = incrementing_page
number_of_albums_to_grab = 10
search_source = missing
failed_import_denylist = True

[Download Settings]
download_filtering = True
use_extension_whitelist = False
extensions_whitelist = lrc,nfo,txt
rename_download_folders = True

[Logging]
level = INFO
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
log_to_file = True
log_file = soularr.log
max_bytes = 1048576
backup_count = 3
