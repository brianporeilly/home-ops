        assign_scores_to:
          - name: WEB-1080p

radarr:
  radarr:
    base_url: http://radarr.download.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      # Default profile: 1080p preferred, 720p fine, 2160p allowed as an occasional exception
      # (ranked below 720p), SD as a last resort. h265 discouraged at every resolution but not
      # blocked outright - grabbed if it's genuinely the only option.
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB (base CF group only; qualities fully overridden below)
        name: Standard
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        upgrade:
          allowed: true
          until_quality: Bluray-720p
          until_score: 10000
        min_format_score: -25000
        qualities:
          - name: Bluray-1080p
          - name: WEB-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB-720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-1080p
          - name: HDTV-720p
          - name: Bluray-2160p
          - name: WEB-2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB-480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV
      # Secondary profile: manually assigned per-movie in the Radarr UI for one-time exceptions
      # where we want native 2160p regardless of codec (h265 not discouraged here)
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0 # SQP-1 (2160p)
        name: SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
        score_set: sqp-1-2160p
        quality_sort: top
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 1000
        qualities:
          - name: Bluray-2160p
          - name: WEB-2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray|WEB-1080p
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - WEBDL-720p
              - WEBRip-720p
          - name: Bluray-720p
    custom_formats:
      # h265/HEVC discouraged at every resolution on the Standard profile (not Remux, and not
      # blocked outright - min_format_score is low enough this never excludes a release outright)
      - trash_ids:
          - 9170d55c319f4fe40da8711ba9d8050d # x265
        assign_scores_to:
          - name: Standard
            score: -10000

      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: SQP-1 (2160p)
            score: 0

      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: Standard
          - name: SQP-1 (2160p)