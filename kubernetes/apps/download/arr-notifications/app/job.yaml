---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-notifications
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arr-notifications
        spec:
          restartPolicy: OnFailure
          # Runs as root: apk needs to write /lib/apk/db to install curl/jq,
          # which a non-root UID can't do (same tradeoff as qbittorrent's own
          # container and the other bootstrap jobs in this repo).
          containers:
            - name: arr-notifications
              image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/bootstrap.sh"]
              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: arr-notifications-creds
                      key: SLACK_WEBHOOK_URL
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-notifications-creds
                      key: JELLYFIN_API_KEY
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sonarr-secret
                      key: SONARR__AUTH__APIKEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: radarr-secret
                      key: RADARR__AUTH__APIKEY
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lidarr-secret
                      key: LIDARR__AUTH__APIKEY
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-secret
                      key: PROWLARR__AUTH__APIKEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: arr-notifications-scripts
                defaultMode: 0555
