---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      sabnzbd:
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -f /config/sabnzbd.ini ]; then
                  echo "Seeding sabnzbd.ini (WebUI credentials + Usenet server pre-configured, first run)"
                  cp /seed/sabnzbd.ini /config/sabnzbd.ini
                else
                  echo "sabnzbd.ini already exists, leaving it alone"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.0@sha256:1e8aebf112ca9b5b4b1103cef90e0e4112fcbd8a19920cd20b8af8cf38836e2d
            env:
              SABNZBD__PORT: &port 8080
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster,
                sabnzbd.downloads.svc.cluster.local,
                sabnzbd.internal.oreillys.io,
                nzb.internal.oreillys.io
            envFrom:
              - secretRef:
                  name: sabnzbd-creds
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - sabnzbd.internal.oreillys.io
          - nzb.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: sabnzbd
        globalMounts:
          - path: /config
      config-seed:
        type: secret
        name: sabnzbd-config-seed
        advancedMounts:
          sabnzbd:
            init-config:
              - path: /seed/sabnzbd.ini
                subPath: sabnzbd.ini
                readOnly: true
      # NAS static NFS mount - usenet downloads only (incomplete/complete
      # share this mount so a finished download is an atomic rename, and
      # Sonarr/Radarr can hardlink out of complete/ into the library).
      # Mounted at the same absolute path Sonarr/Radarr see it at (via their
      # own whole-/media mount) so no Remote Path Mapping is needed - both
      # sides agree on the literal path string for the same files.
      # In sabnzbd's own Folders settings, set:
      #   Temporary Download Folder = /media/downloads/usenet/incomplete
      #   Completed Download Folder = /media/downloads/usenet/complete
      downloads:
        type: nfs
        server: 10.20.30.11
        path: /media/downloads/usenet
        globalMounts:
          - path: /media/downloads/usenet
      tmpfs:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            app:
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp