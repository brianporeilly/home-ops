---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home
components:
  - ../../components/common
patches:
  - target:
      kind: Namespace
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        annotations:
          # kopiur mover pod for esphome runs its app container as root -
          # the mover has to match to read the PVC data, and kopiur gates
          # any UID-0 mover behind this explicit opt-in.
          kopiur.home-operations.com/privileged-movers: "true"
resources:
  - ./home-assistant/ks.yaml
  # octoprint: needs nodeSelector + USB device path set before enabling
  # - ./octoprint/ks.yaml
  # minecraft: uncomment when ready to play
  # - ./minecraft/ks.yaml
  - ./esphome/ks.yaml
  - ./frigate/ks.yaml
# - ./grocy/ks.yaml
  - ./changedetection/ks.yaml
  - ./searxng/ks.yaml
  - ./microbin/ks.yaml
  - ./paperless-ngx/ks.yaml
  - ./vaultwarden/ks.yaml
