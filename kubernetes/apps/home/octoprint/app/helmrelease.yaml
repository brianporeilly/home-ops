---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: octoprint
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: octoprint
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      octoprint:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Pin to the node with the 3D printer USB connection
          # nodeSelector:
          #   kubernetes.io/hostname: <node-name>
        containers:
          app:
            image:
              repository: octoprint/octoprint
              tag: 1.11.8@sha256:392bcadf7e5719fe9cbeae607c917a3ebd8915579d593ee9e91809defc15dd6a
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            # Privileged needed for USB serial access (/dev/ttyACM* / /dev/ttyUSB*)
            # If this is too permissive, try mounting specific device via hostPath instead
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: octoprint
        ports:
          http:
            port: 80

    route:
      app:
        hostnames:
          - octoprint.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /octoprint
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Prefer stable serial device symlinks over raw /dev/ttyUSB* which can
      # change on reboot.  Uncomment and adjust after identifying the printer
      # device on the target node:
      # usb:
      #   type: hostPath
      #   hostPath: /dev/serial/by-id
      #   globalMounts:
      #     - path: /dev/serial/by-id
