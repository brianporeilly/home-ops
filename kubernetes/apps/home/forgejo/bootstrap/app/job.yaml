---
# One-shot admin bootstrap. Deliberately does NOT mount the app's real PVCs
# (both are ReadWriteOnce and already attached to the running forgejo pod) -
# uses its own throwaway emptyDir work dir instead. `admin user create` only
# needs the DB connection (external, shared with the main app) to do its job;
# it doesn't need any of the persisted app state. Not overriding `command:`
# so the image's normal entrypoint still runs environment-to-ini before
# executing these args, same as the real app.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-bootstrap
  annotations:
    # Job's pod template is immutable - without this, a future edit to this
    # spec (e.g. changing the admin username) would fail to apply instead of
    # recreating the Job. Lets Flux delete+recreate on conflict instead.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: forgejo-bootstrap
          image: codeberg.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
          # docker-entrypoint.sh just execs "$@" - it only auto-prepends the
          # `forgejo` binary when the first arg is a bare flag (starts with
          # `-`). Since `admin` isn't a flag, it must be spelled out here or
          # the entrypoint tries (and fails) to exec a program named `admin`.
          args:
            - forgejo
            - admin
            - user
            - create
            - --admin
            - --username=root
            - --email=root@oreillys.io
            - --password=$(ADMIN_PASSWORD)
            - --must-change-password=false
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-postgres-rw:5432
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: dbname
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-bootstrap-secret
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: work-dir
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
