---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Installs the auth_oidc custom_component (hass-oidc-auth, see
          # docs/security-plan.md §3.2) straight from its pinned GitHub
          # release into the persistent /config volume - HACS itself isn't
          # installed/used, this is a GitOps-managed substitute for it.
          # Idempotent on the pinned version (checks .installed_version
          # before re-downloading), same pattern as llama-cpp's
          # fetch-model init container. Bump all three COMPONENT_* env
          # vars together to upgrade (get the new sha256 from the
          # release's hass-oidc-auth.zip asset).
          install-oidc:
            image:
              repository: python
              tag: 3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
            command: ["python3", "-c"]
            args:
              - |
                import hashlib, os, sys, urllib.request, zipfile, io

                url = os.environ["COMPONENT_URL"]
                want_sha256 = os.environ["COMPONENT_SHA256"]
                version = os.environ["COMPONENT_VERSION"]
                dest = "/config/custom_components/auth_oidc"
                marker = f"{dest}/.installed_version"

                if os.path.exists(marker) and open(marker).read().strip() == version:
                    print(f"auth_oidc {version} already installed, skipping")
                    sys.exit(0)

                print(f"downloading {url}")
                data = urllib.request.urlopen(url).read()
                got_sha256 = hashlib.sha256(data).hexdigest()
                if got_sha256 != want_sha256:
                    sys.exit(f"checksum mismatch: got {got_sha256}, want {want_sha256}")

                os.makedirs(dest, exist_ok=True)
                with zipfile.ZipFile(io.BytesIO(data)) as zf:
                    zf.extractall(dest)
                with open(marker, "w") as f:
                    f.write(version)
                print(f"auth_oidc {version} installed")
            env:
              COMPONENT_URL: "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.2.1/hass-oidc-auth.zip"
              COMPONENT_SHA256: "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
              COMPONENT_VERSION: "1.2.1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.3@sha256:16ca445e58fa71d4f7ff287d4e9793ea690ccae932a5e200852371425cd7abb0
            env:
              HASS_HTTP_TRUSTED_PROXY_1: 10.246.0.0/16
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-postgres-app
                    key: uri
              SLACK_WEBHOOK_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: slack_webhook_url
              HOME_LATITUDE:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: home_latitude
              HOME_LONGITUDE:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: home_longitude
              HOME_ELEVATION:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secrets
                    key: home_elevation
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123
    route:
      app:
        hostnames:
          - home.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: home-assistant
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/configuration.yaml
            subPath: config.yaml
          - path: /config/automations.yaml
            subPath: automations.yaml
      config-cache:
        suffix: cache
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /config/.venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
