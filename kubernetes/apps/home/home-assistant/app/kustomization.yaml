---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./cluster.yaml
  - ./secret.yaml
  - ./obc.yaml
  - ./objectstore.yaml
  - ./scheduledbackup.yaml
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
configMapGenerator:
  - name: home-assistant-configmap
    files:
      - config.yaml=./resources/configuration.yaml
      - automations.yaml=./resources/automations.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
