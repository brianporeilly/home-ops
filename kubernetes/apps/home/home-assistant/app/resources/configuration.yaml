# Loads default set of integrations. Do not remove.
default_config:

# Pre-fills onboarding's location/unit step so first login only asks for
# the admin account. TODO: replace with real values (approximate is fine).
homeassistant:
  name: Home
  latitude: 0.0
  longitude: 0.0
  elevation: 0
  unit_system: metric
  time_zone: America/New_York
  currency: USD
  country: US

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.246.0.0/16

# DB connection configured via DB_URL env var from CNPG auto-generated secret.
recorder:
  auto_purge: true
  commit_interval: 30
  purge_keep_days: 30
  exclude:
    domains:
      - automation
      - update

logger:
  default: warning

# Posts to Slack via a plain incoming-webhook URL (SLACK_WEBHOOK_URL env var,
# from the home-assistant-secrets sops secret). Call as:
#   service: rest_command.slack_notify
#   data: { message: "..." }
rest_command:
  slack_notify:
    url: !env_var SLACK_WEBHOOK_URL
    method: POST
    headers:
      content-type: "application/json; charset=utf-8"
    payload: '{"text": "{{ message }}"}'
