---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_backendtrafficpolicies.yaml
# Scoped via sectionName to just the login-rate-limited rule in
# helmrelease.yaml's route.external, so normal traffic on home.oreillys.io
# (the app UI/websocket, mobile app polling) keeps the gateway-level 100
# req/s limit untouched. A policy attached to a more specific target (this
# HTTPRoute rule) fully replaces rather than merges with the less-specific
# envoy-external-ratelimit policy for that rule's traffic - compression,
# timeout and responseOverride are repeated here for the same reason
# envoy-external-ratelimit repeats them over the Gateway-level "envoy"
# policy (see that policy's comment, envoy.yaml in envoy-gateway).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: home-assistant-login-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-external
      sectionName: login-rate-limited
  compression:
    - type: Brotli
    - type: Gzip
  timeout:
    http:
      requestTimeout: 10m
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 20
            unit: Minute
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /403
    - match:
        statusCodes:
          - type: Value
            value: 404
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /404
    - match:
        statusCodes:
          - type: Value
            value: 429
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /429
    - match:
        statusCodes:
          - type: Value
            value: 500
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /500
    - match:
        statusCodes:
          - type: Value
            value: 502
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /502
    - match:
        statusCodes:
          - type: Value
            value: 503
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /503
    - match:
        statusCodes:
          - type: Value
            value: 504
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /504
