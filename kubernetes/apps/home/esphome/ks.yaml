---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app esphome
  namespace: &namespace home
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # esphome's SnapshotPolicy needed root + DAC_OVERRIDE to back up in the
  # first place (see the equivalent comment in download/qui/ks.yaml), so
  # restoring it also needs mover.privilegedMode: true - without CAP_CHOWN
  # the restore mover can't reproduce root:root ownership on the restored
  # files, only its own identity. Validated live: deleted the real
  # esphome-config PVC, let this Restore (via
  # persistence.config.dataSourceRef in app/helmrelease.yaml) repopulate
  # it, confirmed the pod came back healthy with correct data and
  # ownership (531M restored, garage.yaml intact, root:root preserved).
  patches:
    - target:
        kind: Restore
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: esphome
        spec:
          mover:
            privilegedMode: true
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/esphome/app
  postBuild:
    substitute:
      APP: esphome
      PVC: esphome-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false