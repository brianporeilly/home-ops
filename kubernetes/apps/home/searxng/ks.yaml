---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app searxng
  namespace: &namespace home
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # searxng's image runs as its own searxng user (977), only visible via its
  # own USER line - invisible to the component's
  # inheritSecurityContextFrom.pvcConsumer, so it needs an explicit override.
  # Running the mover as 977 gets past the source PVC read fine (its config
  # is world-readable), but the NFS-backed repo (owned 1000:1000) only
  # grants access to an exact UID match or root's NFS no_root_squash
  # bypass - 977 has neither. root + DAC_OVERRIDE is what actually works -
  # see the equivalent comment in download/qui/ks.yaml. home namespace
  # carries the privileged-movers opt-in for this.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: searxng
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - DAC_OVERRIDE
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/home/searxng/app
  postBuild:
    substitute:
      APP: searxng
      PVC: searxng-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false