---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: frigate
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      frigate:
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: "0.18.0-beta1@sha256:6c3b9c55c35f06a174aeb0254d7953c001bb85b66e3357334f62eec0ddc9b1e7"
            env:
              TZ: UTC
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 2Gi

    service:
      app:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          # Was 10.20.250.11 - migrated to the routed 10.21.0.0/16 pool
          # (see kube-vip-cloud-provider HelmRelease). Check before merging
          # for anything pointed at this IP directly rather than through a
          # hostname/route (e.g. camera go2rtc restream URLs, a Home
          # Assistant integration configured with the raw IP).
          kube-vip.io/loadbalancerIPs: "10.21.0.11"
        ports:
          http:
            appProtocol: kubernetes.io/wss
            port: 5000
          go2rtc:
            primary: true
            port: 1984
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
            protocol: TCP
          webrtc-udp:
            port: 8555
            protocol: UDP

    route:
      app:
        hostnames:
          - frigate.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /config
      # Dynamically-provisioned NFS PVC (nfs-csi-driver) - lets Kubernetes own the
      # recordings volume's lifecycle instead of a hand-managed static export;
      # space is capped via a quota on the NAS-side parent dataset, not per-PVC.
      media:
        suffix: media
        storageClass: "nfs-slow"
        accessMode: ReadWriteOnce
        size: "100Gi"
        globalMounts:
          - path: /media
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      tmpfs:
        type: emptyDir
        advancedMounts:
          frigate:
            app:
              - path: /tmp
                subPath: tmp