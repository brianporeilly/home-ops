---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: minecraft
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      minecraft:
        containers:
          app:
            image:
              repository: itzg/minecraft-server
              tag: latest@sha256:1f0de9e841e914fdb73840ed67b585b739495213d4ae049b03f832303049b414
            env:
              EULA: "TRUE"
              TYPE: PAPER
              MEMORY: "2G"
              DIFFICULTY: normal
              MODE: survival
              ONLINE_MODE: "false"
              ALLOW_NETHER: "true"
              ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
              ENABLE_RCON: "true"
              RCON_PASSWORD: minecraft
              SPAWN_PROTECTION: "0"
              VIEW_DISTANCE: "10"
              LEVEL_TYPE: default
              PVP: "true"
            probes:
              liveness: &probes
                enabled: true
                spec:
                  tcpSocket:
                    port: &port 25565
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: 25565
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: minecraft
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          # Was 10.20.250.10 - migrated to the routed 10.21.0.0/16 pool
          # (see kube-vip-cloud-provider HelmRelease). Check before merging:
          # if this is exposed to friends outside the LAN, there's likely
          # an OPNsense WAN port-forward (25565/tcp) pinned to the old IP,
          # and/or people have the raw IP saved as their server address
          # instead of a hostname.
          kube-vip.io/loadbalancerIPs: "10.21.0.10"
        ports:
          minecraft:
            port: 25565
            protocol: TCP
          rcon:
            port: 25575
            protocol: TCP

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
