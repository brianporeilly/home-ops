---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: changedetection
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      changedetection:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -f /datastore/changedetection.json ]; then
                  echo "Seeding changedetection.json (Slack notification target pre-configured, first run)"
                  cp /seed/changedetection.json /datastore/changedetection.json
                else
                  echo "changedetection.json already exists, leaving it alone"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.60.10@sha256:82b82565b5f4fbb309c56ce888f03dd441b51805a17548f4763a7db840f27f0c
            env:
              PLAYWRIGHT_DRIVER_URL: "ws://changedetection-sockpuppetbrowser:3000/?--origin-to-force-quic-on=www.bestbuy.com:443"
              ALLOW_IANA_RESTRICTED_ADDRESSES: true
            probes:
              liveness: &probes
                enabled: true
                type: TCP
                spec:
                  tcpSocket:
                    port: 5000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 512Mi
      sockpuppetbrowser:
        containers:
          app:
            image:
              repository: ghcr.io/brianporeilly/sockpuppetbrowser
              tag: chrome-152.0.7977.64
            env:
              CHROME_HEADFUL: "true"
              SCREEN_WIDTH: "1920"
              SCREEN_HEIGHT: "1080"
              SCREEN_DEPTH: "24"
              MAX_CONCURRENT_CHROME_PROCESSES: "10"
            securityContext:
              allowPrivilegeEscalation: false
              # Chrome's own sandbox needs this to set up its namespaces/seccomp
              # inside the container - upstream's own docs/Dockerfile call this
              # out explicitly (--cap-add=SYS_ADMIN). The alternative is a custom
              # seccomp profile distributed to every node, which is a lot of
              # node-level plumbing for one browser sidecar.
              capabilities: { add: [ "SYS_ADMIN" ], drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              # OOMKilled at 2Gi (confirmed live) - MAX_CONCURRENT_CHROME_PROCESSES=10
              # left barely ~200Mi/process on average, too tight for real
              # headless Chrome against JS-heavy sites (bestbuy.com's QUIC
              # workaround above is exactly this kind of site).
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: changedetection
        ports:
          http:
            port: 5000
      sockpuppetbrowser:
        controller: sockpuppetbrowser
        ports:
          ws:
            port: 3000

    route:
      app:
        hostnames:
          - changedetection.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}-app"
                port: 5000

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "5Gi"
        advancedMounts:
          changedetection:
            app:
              - path: /datastore
            init-config:
              - path: /datastore
      config-seed:
        type: secret
        name: changedetection-config-seed
        advancedMounts:
          changedetection:
            init-config:
              - path: /seed/changedetection.json
                subPath: changedetection.json
                readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          changedetection:
            app:
              - path: /tmp
      sockpuppet-tmp:
        type: emptyDir
        advancedMounts:
          sockpuppetbrowser:
            app:
              - path: /tmp
      sockpuppet-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          sockpuppetbrowser:
            app:
              - path: /dev/shm
