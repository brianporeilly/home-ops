---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# First-wave kopiur proving-ground app - see migration-inventory.md backlog.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: vaultwarden-config
spec:
  repository:
    kind: ClusterRepository
    name: nas-backups
  sources:
    - pvc:
        name: vaultwarden-config
  retention:
    keepDaily: 14
    keepWeekly: 4
