---
# Reflector pull mirror of the canonical paperless-ngx-oidc-credentials
# Secret ESO generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml for the
# same pattern. Holds a single socialaccount-providers.json key (see
# authentik/authentik/app/paperless-ngx-oidc-credentials.yaml for why).
apiVersion: v1
kind: Secret
metadata:
  name: paperless-ngx-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/paperless-ngx-oidc-credentials"
type: Opaque
