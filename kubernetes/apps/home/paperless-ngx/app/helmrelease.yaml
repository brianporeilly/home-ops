---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless-ngx
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.2@sha256:141dc5d5f15124355523722dc87e141552badd86dccf952d242e63b813906cb6
            env:
              PAPERLESS_DBHOST: paperless-postgres-rw
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-app
                    key: dbname
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-app
                    key: username
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-postgres-app
                    key: password
              PAPERLESS_REDIS: "redis://{{ .Release.Name }}-valkey:6379"
              PAPERLESS_URL: https://paperless.internal.oreillys.io
              PAPERLESS_TIME_ZONE: UTC
              # NFS doesn't reliably deliver inotify events for the consume
              # folder - fall back to polling.
              PAPERLESS_CONSUMER_POLLING: "60"
              # Suggestions (tags/correspondent/type/title) via the in-cluster
              # llama-cpp server (ai namespace), using its OpenAI-compatible
              # API. ALLOW_INTERNAL_ENDPOINTS is required because the target
              # is a cluster-internal address, which paperless's SSRF guard
              # blocks by default. No embedding vars set - llama-cpp isn't
              # running with --embedding, so AI-powered semantic search isn't
              # available yet, only per-document suggestions.
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_MODEL: qwen2.5-3b-instruct
              PAPERLESS_AI_LLM_ENDPOINT: http://llama-cpp.ai.svc.cluster.local:8080/v1
              PAPERLESS_AI_LLM_API_KEY: not-required
              PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
              # s6-overlay init refuses to boot otherwise: k8s emptyDir mounts for
              # /run are always root-owned + world-writable, which fails s6's
              # ownership check under readOnlyRootFilesystem + non-root uid.
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # OIDC login via Authentik - regular password login (createsuperuser
              # account) stays enabled alongside it, not replaced, matching this
              # cluster's convention of SSO for day-to-day use + a separate local
              # admin account for actual administration. Auto-signup is safe here
              # since Authentik's own docs-users PolicyBinding (blueprints-groups.yaml)
              # already gates who can complete the OIDC flow at all - anyone who
              # reaches this app via SSO is already authorized.
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_SOCIALACCOUNT_PROVIDERS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-oidc-secret
                    key: socialaccount-providers.json
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 2Gi

      valkey:
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1-alpine@sha256:dd021e69e0a204fbb25b39c332c3dd61d51853d0a67e34f523cf1e1ab15fe478
            args:
              - valkey-server
              - --appendonly
              - "yes"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 50Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: paperless-ngx
        ports:
          http:
            port: 8000
      valkey:
        controller: valkey
        ports:
          tcp:
            port: 6379

    route:
      app:
        hostnames:
          - paperless.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8000

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "50Gi"
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/data
      # NAS static NFS mount - dedicated paperless export.
      media:
        type: nfs
        server: 10.20.30.11
        path: /paperless
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/media
      # Drop-folder ingestion. NAS-side prerequisite: /paperless/consume
      # must exist on the export before this mounts cleanly.
      consume:
        type: nfs
        server: 10.20.30.11
        path: /paperless/consume
        advancedMounts:
          paperless-ngx:
            app:
              - path: /usr/src/paperless/consume
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          paperless-ngx:
            app:
              - path: /tmp
      run:
        type: emptyDir
        advancedMounts:
          paperless-ngx:
            app:
              - path: /run
