---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./pvc.yaml
  - ./secret.yaml
  # The cluster-watcher job's read-only ServiceAccount and token; the job
  # itself is burst-orchestrator's (its jobs/cluster-watcher/).
  - ./cluster-watcher-rbac.yaml
  - ./gateway-token.sops.yaml
  - ./session-reaper.yaml
  # cronjob-example.yaml is a template, deliberately not deployed: copy it to
  # cronjob-<task>.yaml, fill it in, and list the copy here.
