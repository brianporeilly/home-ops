---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./pvc.yaml
  - ./secret.yaml
  - ./cluster-watcher-rbac.yaml
  - ./gateway-token.sops.yaml
  - ./cronjob-cluster-watcher.yaml
  # cronjob-example.yaml is a template, deliberately not deployed: copy it to
  # cronjob-<task>.yaml, fill it in, and list the copy here.
configMapGenerator:
  # A job directory for `harness job run`; see jobs/cluster-watcher/job.toml.
  - name: burst-harness-job-cluster-watcher
    files:
      - jobs/cluster-watcher/job.toml
      - jobs/cluster-watcher/prompt.md
      - jobs/cluster-watcher/cluster_state.py
