---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
#
# TEMPLATE - not listed in kustomization.yaml, so Flux never applies it.
# One CronJob per recurring task: copy this file to cronjob-<task>.yaml,
# change the name, both burst-harness/task labels, schedule, args, and
# HARNESS_REPO_URL, then add the copy to kustomization.yaml.
#
# `harness run` is idempotent (starts the task if its branch doesn't exist,
# resumes it otherwise), so every firing is the same command; each one claims
# a fresh sandbox from the coding-agent warm pool, works, pushes, and
# releases it.
#
# Keep `suspend: true` for a task that should only run on demand, and fire it
# ("run now", or from any UI that can create a Job) with
#   kubectl create job -n agent-runner --from=cronjob/<name> <name>-$(date +%s)
# Watch with `harness list` or `kubectl logs -n agent-runner job/<job>`. The
# last log line is `HARNESS_RESULT {json}`. Exit 0 = PR/paused/abandoned,
# 3 = waiting on a human answer, 1 = no terminal state.
#
# Image: not yet published - push the burst-harness repo to GitHub and its
# images workflow publishes ghcr.io/brianporeilly/burst-harness. Pin
# tag@sha256 before deploying a copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: burst-harness-example
spec:
  schedule: "0 3 * * *"
  timeZone: UTC
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        burst-harness/task: example
    spec:
      backoffLimit: 0
      # Matches the harness's default claim TTL (4h): the sandbox is reaped
      # by then regardless, so a still-running driver past it is stuck.
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            # Selector for globalnetworkpolicy-agent-runner-egress.yaml.
            app.kubernetes.io/name: burst-harness
            burst-harness/task: example
        spec:
          serviceAccountName: burst-harness
          automountServiceAccountToken: true  # kubectl in-cluster config
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: harness
              image: ghcr.io/brianporeilly/burst-harness:main
              args:
                - run
                - example
                - --task
                - "Replace with the task. Keep the slug above stable across runs."
              envFrom:
                - secretRef:
                    name: burst-harness-secret
              env:
                - name: HARNESS_TARGET
                  value: agent-sandbox
                - name: HARNESS_NAMESPACE
                  value: agent-sandbox-system
                - name: HARNESS_POOL
                  value: coding-agent
                - name: HARNESS_REPO_URL
                  value: https://github.com/brianporeilly/REPLACE_ME.git
                - name: HARNESS_PR_DRAFT
                  value: "true"
                # Anthropic (the default provider) - needs ANTHROPIC_API_KEY
                # in burst-harness-secret.
                - name: HARNESS_MODEL_ID
                  value: claude-opus-5-5
                # llama.cpp instead: replace the HARNESS_MODEL_ID entry above
                # with this block. base_url is the server root (no /v1). An
                # endpoint outside the cluster on a private address also
                # needs its own egress rule - see
                # globalnetworkpolicy-agent-runner-egress.yaml.
                # - name: HARNESS_PROVIDER
                #   value: llamacpp
                # - name: HARNESS_BASE_URL
                #   value: http://<host>:8080   # in-cluster: http://llama-cpp.ai.svc.cluster.local:8080
                # - name: HARNESS_MODEL_ID
                #   value: <label>              # llama-server ignores it; for logs
                # - name: HARNESS_CONTEXT_WINDOW_LIMIT
                #   value: "65536"              # = llama-server --ctx-size
                # - name: HARNESS_MODEL_PARAMS
                #   value: '{"max_tokens": 8192}'
                # - name: HARNESS_MODEL_TIMEOUT
                #   value: "900"                # seconds; the client default is 30
                # Read-only root: kubectl's discovery cache and gh's config
                # go under $HOME, so point it at the emptyDir.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: burst-harness-state
            - name: tmp
              emptyDir: {}
