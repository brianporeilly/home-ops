---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
#
# Template for a scheduled/autonomous burst-harness task. One CronJob per
# recurring task; copy this file, change the name, labels, schedule and
# args. `harness run` is idempotent (starts the task if its branch doesn't
# exist, resumes it otherwise), so every firing is the same command, and
# each firing claims a fresh sandbox from the coding-agent warm pool, works,
# pushes, and releases it.
#
# Suspended: fire it on demand ("run now", or from any UI that can create a
# Job) with
#   kubectl create job -n agent-runner --from=cronjob/burst-harness-example example-$(date +%s)
# and watch with `harness list` or `kubectl logs -n agent-runner job/<name>`.
# The last log line is `HARNESS_RESULT {json}`. Exit 0 = PR/paused/abandoned,
# 3 = waiting on a human answer, 1 = no terminal state.
#
# Image: not yet published - push the burst-harness repo to GitHub and its
# images workflow publishes ghcr.io/brianporeilly/burst-harness. Pin
# tag@sha256 here once it exists, then unsuspend.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: burst-harness-example
spec:
  schedule: "0 3 * * *"
  timeZone: UTC
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        burst-harness/task: example
    spec:
      backoffLimit: 0
      # Matches the harness's default claim TTL (4h): the sandbox is reaped
      # by then regardless, so a still-running driver past it is stuck.
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            # Selector for globalnetworkpolicy-agent-runner-egress.yaml.
            app.kubernetes.io/name: burst-harness
            burst-harness/task: example
        spec:
          serviceAccountName: burst-harness
          automountServiceAccountToken: true  # kubectl in-cluster config
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: harness
              image: ghcr.io/brianporeilly/burst-harness:main
              args:
                - run
                - example
                - --task
                - "Replace with the task. Keep the slug above stable across runs."
              envFrom:
                - secretRef:
                    name: burst-harness-secret
              env:
                - name: HARNESS_TARGET
                  value: agent-sandbox
                - name: HARNESS_NAMESPACE
                  value: agent-sandbox-system
                - name: HARNESS_POOL
                  value: coding-agent
                - name: HARNESS_REPO_URL
                  value: https://github.com/brianporeilly/REPLACE_ME.git
                - name: HARNESS_PR_DRAFT
                  value: "true"
                # Anthropic (default provider). For llama-cpp instead, once a
                # model that can drive a tool loop runs on it (gpu-typhon):
                #   HARNESS_PROVIDER=llamacpp
                #   HARNESS_BASE_URL=http://llama-cpp.ai.svc.cluster.local:8080
                #   HARNESS_MODEL_ID=<model>
                #   HARNESS_CONTEXT_WINDOW_LIMIT=<llama-server --ctx-size>
                - name: HARNESS_MODEL_ID
                  value: claude-opus-5-5
                # Read-only root: kubectl's discovery cache and gh's config
                # go under $HOME, so point it at the emptyDir.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: burst-harness-state
            - name: tmp
              emptyDir: {}
