---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
#
# A morning summary of what needs attention in this cluster: the
# cluster-watcher job (jobs/cluster-watcher/, from strands-harness's
# examples). The driver claims a sandbox from the coding-agent pool,
# registers it with burst-gateway as report-only - reads of the API server,
# with the read-only ServiceAccount's token added by the gateway - runs the
# job's script there, has typhon's model write the summary, and releases it.
#
# The report goes to the log (`kubectl logs -n agent-runner job/<job>`, last
# lines) and to /state/reports/cluster-watcher/<date>.md; each run's record,
# with every request the sandbox made, to /state/jobs/cluster-watcher/runs/.
# Run it now with
#   kubectl create job -n agent-runner --from=cronjob/burst-harness-cluster-watcher cw-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: burst-harness-cluster-watcher
spec:
  # Suspended while typhon runs benchmarks: two model clients at once have
  # crashed llama-server. Set back to false (or drop the line) to resume; a
  # manual `kubectl create job --from=...` still works while suspended.
  suspend: true
  schedule: "0 8 * * *"
  timeZone: America/Anchorage
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        burst-harness/task: cluster-watcher
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            # Selector for globalnetworkpolicy-agent-runner-egress.yaml and
            # globalnetworkpolicy-agent-runner-to-burst-gateway.yaml.
            app.kubernetes.io/name: burst-harness
            burst-harness/task: cluster-watcher
        spec:
          serviceAccountName: burst-harness
          automountServiceAccountToken: true  # kubectl in-cluster, and the cluster CA for ca_file
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: harness
              image: ghcr.io/brianporeilly/burst-harness:sha-41dd580@sha256:50d1765cdfa8644bccfb7e2fc72a45a88e5fc452179d7cd321a6eccf967acb4b
              args: ["job", "run", "/jobs/cluster-watcher"]
              env:
                - name: HARNESS_TARGET
                  value: agent-sandbox
                - name: HARNESS_NAMESPACE
                  value: agent-sandbox-system
                - name: HARNESS_POOL
                  value: coding-agent
                # The claim's deadline, and so its registration's.
                - name: HARNESS_CLAIM_TTL
                  value: "3600"
                - name: HARNESS_GATEWAY_CONTROL
                  value: http://burst-gateway.agent-sandbox-system.svc.cluster.local:8081
                - name: HARNESS_GATEWAY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: burst-harness-gateway-token
                      key: HARNESS_GATEWAY_TOKEN
                - name: KUBE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cluster-watcher-token
                      key: token
                - name: HARNESS_STATE_DIR
                  value: /state
                # Read-only root: kubectl's discovery cache goes under $HOME.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: job
                  mountPath: /jobs/cluster-watcher
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: job
              configMap:
                name: burst-harness-job-cluster-watcher
                items:
                  - { key: job.toml, path: job.toml }
                  - { key: prompt.md, path: prompt.md }
                  - { key: cluster_state.py, path: scripts/cluster_state.py }
            - name: state
              persistentVolumeClaim:
                claimName: burst-harness-state
            - name: tmp
              emptyDir: {}
