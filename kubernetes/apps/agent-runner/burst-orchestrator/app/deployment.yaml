---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
# `python -m orchestrator` from the burst-harness image, sessions in
# agent-sandbox-system as `harness session` makes them there (settings below
# are a cluster session's, as for the session reaper). Listens on all
# addresses but answers only requests for ${HOSTNAME} carrying Remote-User,
# which the protect component's SecurityPolicy sets from the Authentik login;
# networkpolicy.yaml makes envoy-internal the only way in.
#
# Labelled as the driver, app.kubernetes.io/name: burst-harness, for the
# driver's network policies: DNS, the API server, burst-gateway's control
# port, typhon's llama-server (its /v1/models names a session's model), and
# HTTPS out.
#
# Credentials a person enters (the GitHub token tasks push and open PRs with,
# HARNESS_GIT_TOKEN; Slack's tokens; a model key) are set in the Settings tab
# and kept encrypted on the PVC (secrets-key.sops.yaml), not in this repo.
# Each burst is handed only what it needs: a task the git token, for its own
# git commands and `gh pr create`; no session or job is.
#
# A task's bursts run as Jobs of their own (ORCHESTRATOR_BURSTS=job; rbac.yaml):
# a rollout here doesn't cut one short, and its memory isn't this pod's. A
# burst's Job runs as burst-harness (the example CronJob's account), from this
# pod's image, mounting burst-harness-shared-state at /state. It holds no
# credentials: it fetches them from this pod with a token good once
# (networkpolicy.yaml). What is the orchestrator's alone stays on
# burst-orchestrator-state, at /orchestrator, which bursts never mount.
# There is no Anthropic key: tasks, like sessions, use typhon's model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO state volume
  selector:
    matchLabels:
      app.kubernetes.io/name: burst-harness
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burst-harness
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: burst-orchestrator
      automountServiceAccountToken: true  # kubectl in-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Once: the harness's state, which was on burst-orchestrator-state with
        # the orchestrator's own files, copied to the shared volume. The
        # orchestrator's files (credentials, tokens, records) stay where they
        # are, now at /orchestrator; a task's output goes with the harness's.
        - name: migrate-state
          image: ghcr.io/brianporeilly/burst-harness:0.6.0@sha256:ed26bf33e5f303737f5283b429695b92a1f010773a1cfe53251165f2e00c18db
          command:
            - sh
            - -c
            - |
              set -eu
              [ -e /state/.migrated ] && exit 0
              cd /orchestrator
              for f in * .[!.]*; do
                case "$f" in
                  "*"|".[!.]*"|credentials.enc|secrets.key|tokens.json|orchestrator|tasks|lost+found) ;;
                  *) cp -a "$f" /state/ ;;
                esac
              done
              for d in tasks/*/; do
                if [ -f "$d/output.log" ]; then mkdir -p "/state/$d" && cp -a "$d/output.log" "/state/$d"; fi
              done
              touch /state/.migrated
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: state
              mountPath: /state
            - name: orchestrator-state
              mountPath: /orchestrator
      containers:
        - name: orchestrator
          image: ghcr.io/brianporeilly/burst-harness:0.6.0@sha256:ed26bf33e5f303737f5283b429695b92a1f010773a1cfe53251165f2e00c18db
          command: ["python", "-m", "orchestrator"]
          args:
            - --listen=0.0.0.0
            - --port=8700
            - --host=${HOSTNAME}
            - --user-header=Remote-User
            # The jobs it lists and runs: jobs/ here, one ConfigMap each.
            - --jobs=/jobs
          ports:
            - name: http
              containerPort: 8700
          env:
            - name: HARNESS_TARGET
              value: agent-sandbox
            - name: HARNESS_NAMESPACE
              value: agent-sandbox-system
            - name: HARNESS_POOL
              value: coding-agent
            - name: HARNESS_ROOT_POOL
              value: coding-agent-root
            - name: HARNESS_GATEWAY_CONTROL
              value: http://burst-gateway.agent-sandbox-system.svc.cluster.local:8081
            - name: HARNESS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: burst-harness-gateway-token
                  key: HARNESS_GATEWAY_TOKEN
            - name: HARNESS_SESSION_DOMAIN
              value: internal.oreillys.io
            - name: HARNESS_SESSION_ROUTE_PARENT
              value: network/envoy-internal/https
            # gatus-sidecar probes every HTTPRoute; on a session's, that is
            # activity, and --idle would never fire.
            - name: HARNESS_SESSION_ROUTE_ANNOTATIONS
              value: gatus.home-operations.com/enabled=false
            # Authentik signs people in on the session routes (agent-sandbox/
            # agent-sandbox/session-sign-in/), and Envoy adds each UI's own
            # login: no password or token to copy.
            - name: HARNESS_SESSION_SIGN_IN
              value: "true"
            - name: HARNESS_EGRESS
              value: allowlist
            # The form's defaults; each session can choose its own.
            - name: HARNESS_PROVIDER
              value: llamacpp
            - name: HARNESS_BASE_URL
              value: http://10.20.40.11:8080
            # typhon's llama-server --ctx-size, which Strands measures the
            # context against; replies are capped at half of it. Change it
            # with the server's.
            - name: HARNESS_CONTEXT_WINDOW_LIMIT
              value: "131072"
            # MCP servers sessions connect to, through the gateway (the form
            # can change them for each session).
            - name: HARNESS_MCP
              value: context7=https://mcp.context7.com/mcp
            - name: HARNESS_STATE_DIR
              value: /state
            - name: ORCHESTRATOR_STATE_DIR
              value: /orchestrator
            # Each burst of a task, and each job's run, as a Job (rbac.yaml),
            # mounting /state's volume.
            - name: ORCHESTRATOR_BURSTS
              value: job
            - name: ORCHESTRATOR_BURST_VOLUME
              value: burst-harness-shared-state
            - name: ORCHESTRATOR_BURST_ACCOUNT
              value: burst-harness
            # Jobs run on their cron triggers, in this timezone. A job starts
            # paused until resumed in the Jobs tab: typhon's llama-server has
            # crashed with two model clients at once, so nothing calls it on a
            # schedule until someone says so. A time missed by up to an hour
            # (a restart) runs late; longer, it is skipped.
            - name: ORCHESTRATOR_SCHEDULE
              value: "1"
            - name: ORCHESTRATOR_START_PAUSED
              value: "1"
            - name: ORCHESTRATOR_TIMEZONE
              value: America/Anchorage
            # Who may start tasks and ask questions from Slack, by member ID.
            # The bot's tokens are entered in the Settings tab (kept encrypted
            # on the PVC), and it connects out over Socket Mode: nothing comes in.
            - name: ORCHESTRATOR_SLACK_USERS
              value: U02SAAUU5B7
            # A job's sandbox claim is deleted after this, whatever happens to the run.
            - name: HARNESS_CLAIM_TTL
              value: "3600"
            # cluster-watcher's: the read-only ServiceAccount's token, which the
            # gateway adds to its requests to the API server (never in the sandbox).
            - name: KUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-watcher-token
                  key: token
            # The Settings tab's credentials are kept encrypted on the PVC with
            # this key (secrets-key.sops.yaml), not one beside them.
            - name: ORCHESTRATOR_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: burst-orchestrator-secrets-key
                  key: ORCHESTRATOR_SECRETS_KEY
            # Read-only root: kubectl's discovery cache goes under $HOME.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 1Gi  # the page, Slack and the scheduler; bursts and job runs are Jobs of their own
          volumeMounts:
            - name: state
              mountPath: /state
            - name: orchestrator-state
              mountPath: /orchestrator
            - name: tmp
              mountPath: /tmp
            - name: job-cluster-watcher
              mountPath: /jobs/cluster-watcher
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: burst-harness-shared-state
        - name: orchestrator-state
          persistentVolumeClaim:
            claimName: burst-orchestrator-state
        - name: tmp
          emptyDir: {}
        - name: job-cluster-watcher
          configMap:
            name: burst-orchestrator-job-cluster-watcher
            items:
              - { key: job.toml, path: job.toml }
              - { key: prompt.md, path: prompt.md }
              - { key: cluster_state.py, path: scripts/cluster_state.py }
