---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
# `python -m orchestrator` from the burst-harness image, sessions in
# agent-sandbox-system as `harness session` makes them there (settings below
# are a cluster session's, as for the session reaper). Listens on all
# addresses but answers only requests for ${HOSTNAME} carrying Remote-User,
# which the protect component's SecurityPolicy sets from the Authentik login;
# networkpolicy.yaml makes envoy-internal the only way in.
#
# Labelled as the driver, app.kubernetes.io/name: burst-harness, for the
# driver's network policies: DNS, the API server, burst-gateway's control
# port, typhon's llama-server (its /v1/models names a session's model), and
# HTTPS out.
#
# Credentials it could hand to sessions (git token, Anthropic key) are not
# given yet: sessions use typhon's model, and clone public repos or none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO state volume
  selector:
    matchLabels:
      app.kubernetes.io/name: burst-harness
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burst-harness
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: burst-orchestrator
      automountServiceAccountToken: true  # kubectl in-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/brianporeilly/burst-harness:sha-51cfe15@sha256:85966405fa4675d2c4a4278fa3cc02af24a22457af97b18c7708d8fb7e5cf1c9
          command: ["python", "-m", "orchestrator"]
          args:
            - --listen=0.0.0.0
            - --port=8700
            - --host=${HOSTNAME}
            - --user-header=Remote-User
            # The jobs it lists and runs: jobs/ here, one ConfigMap each.
            - --jobs=/jobs
          ports:
            - name: http
              containerPort: 8700
          env:
            - name: HARNESS_TARGET
              value: agent-sandbox
            - name: HARNESS_NAMESPACE
              value: agent-sandbox-system
            - name: HARNESS_POOL
              value: coding-agent
            - name: HARNESS_ROOT_POOL
              value: coding-agent-root
            - name: HARNESS_GATEWAY_CONTROL
              value: http://burst-gateway.agent-sandbox-system.svc.cluster.local:8081
            - name: HARNESS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: burst-harness-gateway-token
                  key: HARNESS_GATEWAY_TOKEN
            - name: HARNESS_SESSION_DOMAIN
              value: internal.oreillys.io
            - name: HARNESS_SESSION_ROUTE_PARENT
              value: network/envoy-internal/https
            # gatus-sidecar probes every HTTPRoute; on a session's, that is
            # activity, and --idle would never fire.
            - name: HARNESS_SESSION_ROUTE_ANNOTATIONS
              value: gatus.home-operations.com/enabled=false
            # Authentik signs people in on the session routes (agent-sandbox/
            # agent-sandbox/session-sign-in/), and Envoy adds each UI's own
            # login: no password or token to copy.
            - name: HARNESS_SESSION_SIGN_IN
              value: "true"
            - name: HARNESS_EGRESS
              value: allowlist
            # The form's defaults; each session can choose its own.
            - name: HARNESS_PROVIDER
              value: llamacpp
            - name: HARNESS_BASE_URL
              value: http://10.20.40.11:8080
            # MCP servers sessions connect to, through the gateway (the form
            # can change them for each session).
            - name: HARNESS_MCP
              value: context7=https://mcp.context7.com/mcp
            - name: HARNESS_STATE_DIR
              value: /state
            # Jobs run on their cron triggers, in this timezone. A job starts
            # paused until resumed in the Jobs tab: typhon's llama-server has
            # crashed with two model clients at once, so nothing calls it on a
            # schedule until someone says so. A time missed by up to an hour
            # (a restart) runs late; longer, it is skipped.
            - name: ORCHESTRATOR_SCHEDULE
              value: "1"
            - name: ORCHESTRATOR_START_PAUSED
              value: "1"
            - name: ORCHESTRATOR_TIMEZONE
              value: America/Anchorage
            # A job's sandbox claim is deleted after this, whatever happens to the run.
            - name: HARNESS_CLAIM_TTL
              value: "3600"
            # cluster-watcher's: the read-only ServiceAccount's token, which the
            # gateway adds to its requests to the API server (never in the sandbox).
            - name: KUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-watcher-token
                  key: token
            # Read-only root: kubectl's discovery cache goes under $HOME.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 1Gi  # job runs (harness job run, with the strands loop) are its subprocesses
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            - name: job-cluster-watcher
              mountPath: /jobs/cluster-watcher
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: burst-orchestrator-state
        - name: tmp
          emptyDir: {}
        - name: job-cluster-watcher
          configMap:
            name: burst-orchestrator-job-cluster-watcher
            items:
              - { key: job.toml, path: job.toml }
              - { key: prompt.md, path: prompt.md }
              - { key: cluster_state.py, path: scripts/cluster_state.py }
