---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./pvc.yaml
  - ./git-token.sops.yaml
  - ./secrets-key.sops.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./httproute-api.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  # A job the orchestrator runs on its schedule (jobs/cluster-watcher/job.toml),
  # mounted at /jobs/cluster-watcher by deployment.yaml.
  - name: burst-orchestrator-job-cluster-watcher
    files:
      - jobs/cluster-watcher/job.toml
      - jobs/cluster-watcher/prompt.md
      - jobs/cluster-watcher/cluster_state.py
