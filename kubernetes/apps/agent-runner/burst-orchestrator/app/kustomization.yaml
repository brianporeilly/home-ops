---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./rbac.yaml
  - ./pvc.yaml
  - ./secrets-key.sops.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./httproute-api.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  # A job the orchestrator runs on its schedule (jobs/cluster-watcher/job.toml),
  # mounted at /jobs/cluster-watcher by deployment.yaml.
  - name: burst-orchestrator-job-cluster-watcher
    files:
      - jobs/cluster-watcher/job.toml
      - jobs/cluster-watcher/prompt.md
      - jobs/cluster-watcher/cluster_state.py
  # The daily brief (jobs/daily-brief/job.toml), mounted at /jobs/daily-brief.
  - name: burst-orchestrator-job-daily-brief
    files:
      - jobs/daily-brief/job.toml
      - jobs/daily-brief/prompt.md
      - jobs/daily-brief/brief_data.py
  # The mail sorter (jobs/mail-sorter/job.toml), mounted at /jobs/mail-sorter.
  - name: burst-orchestrator-job-mail-sorter
    files:
      - jobs/mail-sorter/job.toml
      - jobs/mail-sorter/prompt.md
      - jobs/mail-sorter/sort_mail.py
  # The price watch (jobs/price-watch/job.toml), mounted at /jobs/price-watch.
  - name: burst-orchestrator-job-price-watch
    files:
      - jobs/price-watch/job.toml
      - jobs/price-watch/prompt.md
      - jobs/price-watch/prices.py
      - jobs/price-watch/products.toml
    # prices.py writes prices as f"${value:.2f}", which Flux would take for its
    # own ${VAR} substitution and fail on: this ConfigMap is passed as is.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
