# sops --encrypt --in-place oidc-admin-api-key-secret.yaml
#
# MANUAL STEP REQUIRED - unlike every other credential in this app's OIDC
# setup, this one can't be generated by ESO: Immich's system-config API
# (consumed by oidc-system-config-cronjob.yaml) requires an admin API key,
# and API keys can only be created through an authenticated admin session
# (Immich UI -> Account Settings -> API Keys -> New API Key, "Configure
# machine learning settings" + "Configure system settings" permissions,
# or just "All" - grant it whatever the *arr apps convention here gives
# their own API keys).
#
# Paste the generated key below as IMMICH_API_KEY, then:
#   sops --encrypt --in-place oidc-admin-api-key-secret.yaml
# before committing - this file is plaintext until then, do not push
# unencrypted (this repo is public).
apiVersion: v1
kind: Secret
metadata:
  name: immich-oidc-admin-api-key
stringData:
  IMMICH_API_KEY: "REPLACE_ME"
