---
# Reflector pull mirror of the canonical immich-oidc-credentials Secret
# ESO generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml for the
# same pattern. Consumed by oidc-system-config-cronjob.yaml, not the
# immich app container itself.
apiVersion: v1
kind: Secret
metadata:
  name: immich-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/immich-oidc-credentials"
type: Opaque
