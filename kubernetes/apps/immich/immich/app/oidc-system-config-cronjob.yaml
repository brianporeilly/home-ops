---
# Immich has no env-var/config-file OIDC mechanism (unlike every other
# native-OIDC app in this repo except forgejo) - OAuth settings live in
# Immich's own system config, readable/writable only via its admin REST
# API (GET/PUT /api/system-config, confirmed against the shipped OpenAPI
# spec - x-immich-admin-only, api_key auth accepted). Same rationale as
# forgejo's CronJob: get-merge-put hourly, self-healing on drift
# instead of a one-time manual step, using the admin API key from
# oidc-admin-api-key-secret.yaml (that one genuinely can't be automated -
# API keys can only be created through an authenticated admin session).
#
# PUT replaces the *entire* SystemConfigDto, not just the oauth section -
# GET the current full config first and only mutate .oauth in place
# (via jq) so every other setting (storage template, ML, notifications,
# etc) round-trips untouched.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-oidc-system-config-sync
spec:
  # Suspended until oidc-admin-api-key-secret.yaml's placeholder is
  # replaced with a real key (see that file) - otherwise this fails every
  # run (401) from the moment it merges. Flip to false (or remove) once
  # the real key is in place and confirmed working.
  suspend: true
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: sync
              image: docker.io/alpine/k8s:1.34.1@sha256:67c5ed0a719316e9d0e74d3e58d95708dc8e21e3d9c6904f87c4fb01977630c8
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BASE="http://immich-app:2283/api"
                  CURRENT=$(curl -sf -H "x-api-key: $IMMICH_API_KEY" "$BASE/system-config")
                  UPDATED=$(printf '%s' "$CURRENT" | jq \
                    --arg issuer "https://auth.internal.oreillys.io/application/o/immich/" \
                    --arg clientId "$OIDC_CLIENT_ID" \
                    --arg clientSecret "$OIDC_CLIENT_SECRET" \
                    '.oauth.enabled = true
                     | .oauth.issuerUrl = $issuer
                     | .oauth.clientId = $clientId
                     | .oauth.clientSecret = $clientSecret
                     | .oauth.autoRegister = true
                     | .oauth.scope = "openid email profile"
                     | .oauth.buttonText = "Login with Authentik"')
                  curl -sf -X PUT -H "x-api-key: $IMMICH_API_KEY" -H "Content-Type: application/json" \
                    -d "$UPDATED" "$BASE/system-config" -o /dev/null
                  echo "system-config oauth section synced"
              env:
                - name: IMMICH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: immich-oidc-admin-api-key
                      key: IMMICH_API_KEY
                - name: OIDC_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: immich-oidc-secret
                      key: client-id
                - name: OIDC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: immich-oidc-secret
                      key: client-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 64Mi
