---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:079cc990b26a88d71f96027341c67329cb11829d4c341ce33b3718fe0f84cbfa
            env:
              DB_HOSTNAME: immich-postgres-rw
              DB_PORT: "5432"
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: dbname
              REDIS_HOSTNAME: "{{ .Release.Name }}-valkey"
              REDIS_PORT: "6379"
              IMMICH_MACHINE_LEARNING_URL: "http://{{ .Release.Name }}-ml:3003"
              TZ: UTC
            probes:
              liveness: &probes
                enabled: true
                spec:
                  tcpSocket:
                    port: &port 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 2Gi

      ml:
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0@sha256:a25ddad7d6d2ab18a161176731dc171bb7e39c0e9dd3884fb1ec629dab535d05
            env:
              TRANSFORMERS_CACHE: /cache
              MACHINE_LEARNING_CACHE_FOLDER: /cache
              MPLCONFIGDIR: /cache/matplotlib-config
              TZ: UTC
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
              limits:
                memory: 2Gi

      valkey:
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1-alpine@sha256:17539e366539969d44eb7a217237cd3ccd1a7755cdb71c7ea69be06cab2e6b9c
            args:
              - valkey-server
              - --appendonly
              - "yes"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 50Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: server
        ports:
          http:
            port: 2283
      ml:
        controller: ml
        ports:
          http:
            port: 3003
      valkey:
        controller: valkey
        ports:
          tcp:
            port: 6379

    route:
      app:
        hostnames:
          - photos.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}-app"
                port: 2283
      external:
        annotations:
          # gatus-sidecar's HTTPRoute auto-discovery skips a bare "/" match
          # and picks the next PathPrefix rule it finds instead (see the
          # authentik-server-external and jellyfin comments for the same
          # bug) - without this override it started probing
          # /api/auth/login instead of / the moment the login-rate-limited
          # rule below was added, and that path 302s instead of returning
          # 200.
          gatus.home-operations.com/endpoint: |-
            path: /
        hostnames:
          - photos.oreillys.io
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}-app"
                port: 2283
          # Named so the BackendTrafficPolicy below
          # (backendtrafficpolicy-login-ratelimit.yaml) can target just this
          # rule via sectionName.
          - name: login-rate-limited
            matches:
              - path:
                  type: PathPrefix
                  value: /api/auth/login
            backendRefs:
              - name: "{{ .Release.Name }}-app"
                port: 2283

    persistence:
      # retain the media volume across helm uninstall/remediation. Without this,
      # a failed install (retries: -1) uninstalls the release and DELETES this
      # PVC, while the CNPG Postgres DB persists — the empty new volume then
      # fails immich's folder-integrity check (DB says folders are initialized,
      # disk has no .immich markers) and the release crash-loops forever.
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "100Gi"
        retain: true
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation. A freshly-restored/empty disk paired with
        # a Postgres DB that already has folder-integrity state recorded
        # crash-loops on startup ("Failed to read .../encoded-video/.immich:
        # ENOENT") - not something dataSourceRef/kopiur causes specifically,
        # any fresh volume behind a DB that thinks folders exist hits it. Fix:
        # touch /data/{thumbs,upload,backups,library,profile,encoded-video}/
        # .immich as UID 1000 before restarting the pod - immich's own
        # documented fix, see
        # https://docs.immich.app/administration/system-integrity#folder-checks.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: immich
        advancedMounts:
          server:
            app:
              - path: /data
      ml-cache:
        suffix: ml-cache
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        advancedMounts:
          ml:
            app:
              - path: /cache
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
          ml:
            app:
              - path: /tmp
