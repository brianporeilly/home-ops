---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openhands
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openhands
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      openhands:
        annotations:
          reloader.stakater.com/auto: "true"
        # Image's entrypoint.sh is chown'd to UID/GID 42420, not this repo's
        # usual 1000 (that default's for NAS access, not needed here) - see
        # docs/agent-sandbox-plan.md for the full story.
        pod:
          securityContext:
            runAsUser: 42420
            runAsGroup: 42420
            runAsNonRoot: true
            fsGroup: 42420
            fsGroupChangePolicy: OnRootMismatch
        # The published image never installs tmux, but LocalRuntime hard-
        # requires it (not just at this check - libtmux needs the real
        # binary for every command the agent runs). Installs it fresh each
        # boot into a shared emptyDir rather than a custom image - see
        # docs/agent-sandbox-plan.md for the tradeoff and why.
        initContainers:
          install-tmux:
            image:
              repository: ghcr.io/all-hands-ai/openhands
              tag: 0.59.0@sha256:f5ff4fd19711fee82bdc91b4367d1e7986c88be754b82e2a946cc0a85434562a
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                apt-get update
                apt-get install -y --no-install-recommends tmux
                tmux_bin="$(command -v tmux)"
                cp -aL "$tmux_bin" /opt/tmux/bin/tmux
                ldd "$tmux_bin" | awk '$2=="=>" && $3~/^\// {print $3} $1~/^\// && $2!="=>" {print $1}' | sort -u | while read -r lib; do
                  cp -aL "$lib" /opt/tmux/lib/ 2>/dev/null || true
                done
            # Needs root for apt-get - same image as the main container, so
            # no library/ABI mismatch risk in what gets copied to the
            # shared volumes below.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: ghcr.io/all-hands-ai/openhands
              tag: 0.59.0@sha256:f5ff4fd19711fee82bdc91b4367d1e7986c88be754b82e2a946cc0a85434562a
            env:
              # "local", not "process" - see docs/agent-sandbox-plan.md.
              # No docker.sock, no nested containers - the Pod
              # (securityContext + globalnetworkpolicy-openhands-egress.yaml)
              # is the isolation boundary, not OpenHands itself.
              RUNTIME: "local"
              # Required for runAsUser: 42420 above to work - see
              # docs/agent-sandbox-plan.md.
              NO_SETUP: "true"
              WORKSPACE_BASE: "/.openhands-state/workspace"
              # Default (~/.openhands) resolves off this PVC - HOME isn't
              # meaningfully set for UID 42420 here, so it lands unwritable
              # on the root filesystem. See docs/agent-sandbox-plan.md.
              FILE_STORE_PATH: "/.openhands-state/filestore"
              # Base value confirmed live against this exact pinned image -
              # re-verify if the image tag/digest above ever changes. Only
              # addition is /opt/tmux/bin (initContainers.install-tmux) -
              # deliberately NOT /usr/local/bin: that already holds this
              # image's real python3.13 (/app/.venv/bin/python3 resolves
              # there), and mounting an emptyDir over it shadows the
              # interpreter entirely, silently breaking every process in
              # the container, not just tmux. See docs/agent-sandbox-plan.md.
              PATH: "/opt/tmux/bin:/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              LD_LIBRARY_PATH: "/opt/tmux/lib"
              LLM_MODEL: "anthropic/claude-sonnet-5"
              # llama-cpp (this namespace) is reachable at
              # http://llama-cpp.ai.svc.cluster.local:8080/v1 as an optional
              # secondary provider - add via Settings > LLM once logged in.
              # Expect it to struggle: see llama-cpp/app/helmrelease.yaml.
            envFrom:
              - secretRef:
                  name: openhands-secret
            probes:
              # TCP-only, not HTTP - no confirmed health endpoint path for
              # this image at plan time (unlike llama-cpp's documented
              # /health). Revisit with an HTTP probe once one's confirmed
              # live.
              liveness: &probes
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # NOT readOnlyRootFilesystem yet - OpenHands almost certainly
              # writes outside /.openhands-state (npm/asset caches, tmp
              # files for tool execution under RUNTIME=local). Confirm
              # what actually needs write access post-deploy (check for
              # permission-denied errors, same approach hermes-agent's
              # helmrelease.yaml used) before locking this down.
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: openhands
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - openhands.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      state:
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "20Gi"
        globalMounts:
          - path: /.openhands-state
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # /opt/tmux didn't exist in the image at all before this - see the
      # PATH env var comment above for why it's not /usr/local/bin.
      tmux-bin:
        type: emptyDir
        advancedMounts:
          openhands:
            install-tmux:
              - path: /opt/tmux/bin
            app:
              - path: /opt/tmux/bin
      tmux-lib:
        type: emptyDir
        advancedMounts:
          openhands:
            install-tmux:
              - path: /opt/tmux/lib
            app:
              - path: /opt/tmux/lib
