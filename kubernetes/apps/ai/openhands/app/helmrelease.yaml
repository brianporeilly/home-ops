---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openhands
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openhands
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      openhands:
        annotations:
          reloader.stakater.com/auto: "true"
        # Image's entrypoint.sh is chown'd to UID/GID 42420, not this repo's
        # usual 1000 (that default's for NAS access, not needed here) - see
        # docs/agent-sandbox-plan.md for the full story.
        pod:
          securityContext:
            runAsUser: 42420
            runAsGroup: 42420
            runAsNonRoot: true
            fsGroup: 42420
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/all-hands-ai/openhands
              tag: 0.59.0@sha256:f5ff4fd19711fee82bdc91b4367d1e7986c88be754b82e2a946cc0a85434562a
            env:
              # RUNTIME=process: no docker.sock, no nested containers - the
              # Pod (securityContext + globalnetworkpolicy-openhands-egress.yaml)
              # is the isolation boundary, not OpenHands itself. See
              # docs/agent-sandbox-plan.md.
              RUNTIME: "process"
              # Required for runAsUser: 42420 above to work - see
              # docs/agent-sandbox-plan.md.
              NO_SETUP: "true"
              WORKSPACE_BASE: "/.openhands-state/workspace"
              # Default (~/.openhands) resolves off this PVC - HOME isn't
              # meaningfully set for UID 42420 here, so it lands unwritable
              # on the root filesystem. See docs/agent-sandbox-plan.md.
              FILE_STORE_PATH: "/.openhands-state/filestore"
              LLM_MODEL: "anthropic/claude-sonnet-5"
              # llama-cpp (this namespace) is reachable at
              # http://llama-cpp.ai.svc.cluster.local:8080/v1 as an optional
              # secondary provider - add via Settings > LLM once logged in.
              # Expect it to struggle: see llama-cpp/app/helmrelease.yaml.
            envFrom:
              - secretRef:
                  name: openhands-secret
            probes:
              # TCP-only, not HTTP - no confirmed health endpoint path for
              # this image at plan time (unlike llama-cpp's documented
              # /health). Revisit with an HTTP probe once one's confirmed
              # live.
              liveness: &probes
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                type: TCP
                port: 3000
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # NOT readOnlyRootFilesystem yet - OpenHands almost certainly
              # writes outside /.openhands-state (npm/asset caches, tmp
              # files for tool execution under RUNTIME=process). Confirm
              # what actually needs write access post-deploy (check for
              # permission-denied errors, same approach hermes-agent's
              # helmrelease.yaml used) before locking this down.
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: openhands
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - openhands.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      state:
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "20Gi"
        globalMounts:
          - path: /.openhands-state
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
