---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-cpp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      llama-cpp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          runtimeClassName: nvidia
        initContainers:
          # Idempotent - skips the download if the file already exists on the
          # (persistent) volume, so pod restarts don't re-fetch. Change MODEL_URL
          # + MODEL_FILE together to switch models; both the fetch and the
          # llama-server -m flag below read from the same values, so "which
          # model is running" is one fact, defined once, in git.
          fetch-model:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                dest="/models/${MODEL_FILE}"
                if [ -f "$dest" ]; then
                  echo "[fetch-model] $dest already present, skipping"
                  exit 0
                fi
                echo "[fetch-model] downloading $MODEL_URL -> $dest"
                curl -fL --retry 3 --create-dirs -o "${dest}.tmp" "$MODEL_URL"
                mv "${dest}.tmp" "$dest"
                echo "[fetch-model] done"
            env: &model_env
              # Qwen2.5-3B-Instruct: swapped from Phi-4-mini (2026-09-03) -
              # Phi-4-mini's chat template uses Microsoft's own nonstandard
              # per-message `tools` convention, which llama.cpp's server
              # doesn't recognize as one of its supported tool-call template
              # families, so --jinja alone can't make it emit tool_calls
              # (confirmed live: model just replies in plain text, ignoring
              # the tools schema entirely - see /props' chat_template).
              # Qwen2.5's template is one of llama.cpp's natively-supported
              # tool-call families, needed for paperless-ngx's AI suggestions.
              # 1.9GB at Q4_K_M, comfortably inside the 4GB card's budget.
              MODEL_URL: "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
              MODEL_FILE: "Qwen2.5-3B-Instruct-Q4_K_M.gguf"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda
            env: *model_env
            args:
              - -m
              - /models/$(MODEL_FILE)
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              # -1 offloads every layer to the GPU. The GTX 745 (Maxwell,
              # 4GB VRAM) is old enough that this needs verifying in practice -
              # drop to a smaller positive number of layers if it OOMs.
              - --n-gpu-layers
              - "-1"
              - --ctx-size
              # Hermes Agent requires a minimum 64000 context window (below
              # that it refuses to use the endpoint as a model provider).
              #
              # Bumping this alone (previous attempt: plain 64000) did NOT
              # work - confirmed live in the startup log:
              #   n_ctx_seq (64000) > n_ctx_train (32768) -- possible
              #   training context overflow
              #   n_slots = 4, n_ctx_slot = 32768, kv_unified = 'true'
              # Qwen2.5-3B-Instruct's native trained context is 32768;
              # llama.cpp silently clamped the effective context back down
              # to that regardless of --ctx-size. The --rope-scaling/
              # --yarn-* flags below stretch position embeddings past the
              # trained length instead (some quality loss on content that
              # actually uses the extended range past 32768 - the model
              # was never trained to reason well that far out). 65536 =
              # 32768 * the rope-scale factor below, so it lands cleanly
              # above Hermes's 64000 floor.
              - "65536"
              # Quantizes the KV cache (~halves its memory footprint vs the
              # f16 default) - the GTX 745's 4GB VRAM has no room to double
              # the f16 cache outright for the longer context. Negligible
              # quality impact at q8_0; drop to q4_0 (more aggressive, more
              # lossy) if this still doesn't fit.
              - --cache-type-k
              - q8_0
              - --cache-type-v
              - q8_0
              # YaRN RoPE scaling: stretches the model's position embeddings
              # so it accepts sequences beyond its native 32768 training
              # context. --yarn-orig-ctx must be the model's real trained
              # length; --rope-scale is the multiplier (2x here, matching
              # 65536 / 32768).
              - --rope-scaling
              - yarn
              - --rope-scale
              - "2"
              - --yarn-orig-ctx
              - "32768"
              # Required for OpenAI-style tool/function calling (paperless-ngx's
              # AI suggestions use it) - without --jinja llama.cpp falls back to
              # a simplified template that can't emit tool_calls, so the model
              # just replies with plain text and the client sees "0 tool calls".
              - --jinja
              # Prometheus-format /metrics - token throughput, KV/context
              # usage, requests processing/deferred. Off by default. Scraped
              # by the ServiceMonitor alongside this HelmRelease.
              - --metrics
            probes:
              # HTTP /health returns 200 once the server's actually up (GET /
              # returns a bare 415 instead - llama-server's minimal router
              # doesn't like the root path with no static webui bundled in
              # this image). A TCP check would only prove the port is open,
              # not that the server is actually responsive - HTTP catches a
              # hung-but-listening process that TCP wouldn't.
              #
              # NB: this chart wants `path`/`port` as top-level keys here, NOT
              # nested under spec.httpGet - nesting them under httpGet is
              # silently ignored by the chart's template, leaving `path`
              # unset and the probe defaulting to "/" (the path that returns
              # 415).
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  # Ceiling of ~10min for first-time model load + CUDA
                  # context/kernel init on the old Maxwell card - liveness/
                  # readiness don't start counting until this passes once.
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              # History: OOMKilled at 6Gi, bumped to 8Gi, OOMKilled again at
              # 8Gi (confirmed live, exit 137) even at the old --ctx-size
              # 32000/f16-cache settings - host RAM scales with context
              # length same as VRAM does, even with every layer offloaded
              # to the GPU (--n-gpu-layers -1). Now on wk-drotte, not
              # wk-roche - checked live, node has headroom for this but
              # it's not abundant (~81% memory utilized already from other
              # co-located apps). Watch for further OOMs after the 64000 +
              # q8_0 cache change above; this may still need another bump.
              limits:
                cpu: "4"
                memory: 10Gi
                nvidia.com/gpu: 1

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: llama-cpp
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          # llama-server's minimal router returns a bare 415 for GET / (no
          # static webui bundled in this image). /health is the correct
          # check target and returns 200 once the server's up.
          gatus.home-operations.com/endpoint: |-
            url: https://ai.internal.oreillys.io/health
        hostnames:
          - ai.internal.oreillys.io
          - llm.internal.oreillys.io
          - llama-cpp.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      models:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: "20Gi"
        advancedMounts:
          llama-cpp:
            fetch-model:
              - path: /models
            app:
              - path: /models
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          llama-cpp:
            app:
              - path: /tmp
