---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-cpp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      llama-cpp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          runtimeClassName: nvidia
        initContainers:
          # Idempotent - skips the download if the file already exists on the
          # (persistent) volume, so pod restarts don't re-fetch. Change MODEL_URL
          # + MODEL_FILE together to switch models; both the fetch and the
          # llama-server -m flag below read from the same values, so "which
          # model is running" is one fact, defined once, in git.
          fetch-model:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.21.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                dest="/models/${MODEL_FILE}"
                if [ -f "$dest" ]; then
                  echo "[fetch-model] $dest already present, skipping"
                  exit 0
                fi
                echo "[fetch-model] downloading $MODEL_URL -> $dest"
                curl -fL --retry 3 --create-dirs -o "${dest}.tmp" "$MODEL_URL"
                mv "${dest}.tmp" "$dest"
                echo "[fetch-model] done"
            env: &model_env
              # Qwen2.5-3B-Instruct: swapped from Phi-4-mini (2026-09-03) -
              # Phi-4-mini's chat template uses Microsoft's own nonstandard
              # per-message `tools` convention, which llama.cpp's server
              # doesn't recognize as one of its supported tool-call template
              # families, so --jinja alone can't make it emit tool_calls
              # (confirmed live: model just replies in plain text, ignoring
              # the tools schema entirely - see /props' chat_template).
              # Qwen2.5's template is one of llama.cpp's natively-supported
              # tool-call families, needed for paperless-ngx's AI suggestions.
              # 1.9GB at Q4_K_M, comfortably inside the 4GB card's budget.
              MODEL_URL: "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
              MODEL_FILE: "Qwen2.5-3B-Instruct-Q4_K_M.gguf"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda
            env: *model_env
            args:
              - -m
              - /models/$(MODEL_FILE)
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              # -1 offloads every layer to the GPU. The GTX 745 (Maxwell,
              # 4GB VRAM) is old enough that this needs verifying in practice -
              # drop to a smaller positive number of layers if it OOMs.
              - --n-gpu-layers
              - "-1"
              - --ctx-size
              - "32000"
              # Required for OpenAI-style tool/function calling (paperless-ngx's
              # AI suggestions use it) - without --jinja llama.cpp falls back to
              # a simplified template that can't emit tool_calls, so the model
              # just replies with plain text and the client sees "0 tool calls".
              - --jinja
              # Prometheus-format /metrics - token throughput, KV/context
              # usage, requests processing/deferred. Off by default. Scraped
              # by the ServiceMonitor alongside this HelmRelease.
              - --metrics
            probes:
              # HTTP /health returns 200 once the server's actually up (GET /
              # returns a bare 415 instead - llama-server's minimal router
              # doesn't like the root path with no static webui bundled in
              # this image). A TCP check would only prove the port is open,
              # not that the server is actually responsive - HTTP catches a
              # hung-but-listening process that TCP wouldn't.
              #
              # NB: this chart wants `path`/`port` as top-level keys here, NOT
              # nested under spec.httpGet - nesting them under httpGet is
              # silently ignored by the chart's template, leaving `path`
              # unset and the probe defaulting to "/" (the path that returns
              # 415).
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  # Ceiling of ~10min for first-time model load + CUDA
                  # context/kernel init on the old Maxwell card - liveness/
                  # readiness don't start counting until this passes once.
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              # OOMKilled at 6Gi (confirmed live: 4867Mi resident against a
              # 6144Mi limit, so barely 1.3Gi of headroom) - --ctx-size 32000
              # scales KV-cache/scratch-buffer host RAM with request length,
              # not just VRAM, even with every layer offloaded to the GPU
              # (--n-gpu-layers -1). wk-roche has room (~8.5Gi free).
              limits:
                cpu: "4"
                memory: 8Gi
                nvidia.com/gpu: 1

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: llama-cpp
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          # llama-server's minimal router returns a bare 415 for GET / (no
          # static webui bundled in this image). /health is the correct
          # check target and returns 200 once the server's up.
          gatus.home-operations.com/endpoint: |-
            url: https://ai.internal.oreillys.io/health
        hostnames:
          - ai.internal.oreillys.io
          - llm.internal.oreillys.io
          - llama-cpp.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      models:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: "20Gi"
        advancedMounts:
          llama-cpp:
            fetch-model:
              - path: /models
            app:
              - path: /models
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          llama-cpp:
            app:
              - path: /tmp
