---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        # Same shape as tube-archivist's override: the image's PID 1 is
        # s6-overlay's /init, which needs root to chown /opt/data to the
        # HERMES_UID/HERMES_GID it's told to run as and to setuid/setgid
        # into the supervised hermes user (UID 10000 by default) per
        # service. Forcing runAsNonRoot here just crash-loops init before
        # it can do that handoff. The actual gateway/dashboard processes
        # still end up running as the non-root `hermes` user post-drop -
        # this only overrides the brief root-owned init phase.
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            fsGroup: 0
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.14@sha256:1f983df4d778d46b3c3892d7598c9d57291430a6e35936ebc371ae1e5766699a
            # Without this, the `main-hermes` s6 service execs the
            # container's bare argv (empty by default), which runs the
            # interactive chat CLI instead of the gateway daemon - it
            # prints the welcome banner, hits "Input is not a terminal",
            # and exits immediately, crash-looping the pod. `dashboard` is
            # a separate static s6 service unaffected by this - only the
            # main process needed the override.
            args:
              - gateway
              - run
            env:
              # Dummy value - llama.cpp's OpenAI-compatible server doesn't
              # enforce auth, but Hermes requires a non-empty key to accept
              # a custom base_url provider. Not a real secret.
              OPENAI_API_KEY: "unused-llama-cpp-has-no-auth"
              # web_search backend. Still requires `web.search_backend:
              # searxng` in config.yaml (env var alone isn't enough - see
              # the one-time `hermes tools` setup step) and SearXNG's own
              # JSON output format enabled (off by default upstream;
              # confirmed our instance hasn't opted in yet either).
              SEARXNG_URL: "http://searxng.home.svc.cluster.local:8080"
            envFrom:
              - secretRef:
                  name: hermes-agent-secret
            securityContext:
              allowPrivilegeEscalation: false
              # Not dropping capabilities yet: root here is only used for
              # the chown/setuid privilege-drop dance on boot (see pod
              # comment above), and guessing the wrong capability set
              # would crash-loop init instead of just being "less locked
              # down". Revisit after the first successful boot by checking
              # for permission-denied errors in the s6/stage2-hook logs,
              # then add capabilities: { drop: ["ALL"], add: [...] } with
              # only what's actually needed.
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi

      # Dedicated browser sidecar for Hermes's `browser` tool (config.yaml
      # browser.cdp_url) - deliberately NOT sharing changedetection's
      # sockpuppetbrowser (home/changedetection). That instance's
      # MAX_CONCURRENT_CHROME_PROCESSES=10 is sized for changedetection's
      # own scheduled site-diff polling; an agent chat session competing
      # with those jobs for the same Chrome pool would contend with (or
      # get starved by) changedetection. Same image/pattern, own capacity.
      # Kept for occasional "actually interact with a page" tasks -
      # web_search (SearXNG) covers routine lookups far more cheaply.
      sockpuppetbrowser:
        containers:
          app:
            image:
              repository: ghcr.io/brianporeilly/sockpuppetbrowser
              tag: chrome-152.0.7977.64
            env:
              CHROME_HEADFUL: "true"
              SCREEN_WIDTH: "1920"
              SCREEN_HEIGHT: "1080"
              SCREEN_DEPTH: "24"
              # Low ceiling on purpose - one agent session at a time, not
              # changedetection's bulk-polling fan-out.
              MAX_CONCURRENT_CHROME_PROCESSES: "3"
            securityContext:
              allowPrivilegeEscalation: false
              # Chrome's own sandbox needs this to set up its namespaces/
              # seccomp inside the container - see changedetection's
              # sockpuppetbrowser controller for the same call.
              capabilities: { add: [ "SYS_ADMIN" ], drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      sockpuppetbrowser:
        controller: sockpuppetbrowser
        ports:
          ws:
            port: 3000

    persistence:
      data:
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: "10Gi"
        advancedMounts:
          hermes-agent:
            app:
              - path: /opt/data
      tmp:
        type: emptyDir
        advancedMounts:
          hermes-agent:
            app:
              - path: /tmp
          sockpuppetbrowser:
            app:
              - path: /tmp
      sockpuppet-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          sockpuppetbrowser:
            app:
              - path: /dev/shm
