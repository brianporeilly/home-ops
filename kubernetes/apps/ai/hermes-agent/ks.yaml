---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes-agent
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # Not a hard startup requirement (Slack/email/Telegram all just retry
    # the LLM call until it's reachable), but documents the real runtime
    # dependency and gates health during a full cluster rebuild.
    - name: llama-cpp
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/hermes-agent/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
