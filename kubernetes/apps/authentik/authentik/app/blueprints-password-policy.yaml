---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-password-policy
data:
  # default-password-change-password-policy ships with authentik but was
  # bound to nothing - confirmed live (zero PromptStageValidationPolicy
  # rows referencing it), so its stock length_min=8/no-complexity rules
  # never actually applied anywhere. Only akadmin can ever reach this flow
  # now (the two personal accounts had their local passwords disabled -
  # see blueprints-sso-enrollment-allowlist.yaml/mfa-required.yaml), so
  # this only ever gates a future akadmin password change, not routine
  # SSO use.
  #
  # PasswordPolicy binds to a PromptStage via
  # authentik_stages_prompt.promptstagevalidationpolicy - a distinct
  # through-model, not a regular PolicyBinding on a FlowStageBinding like
  # every other policy in this repo (confirmed live via
  # PasswordPolicy._meta.get_fields()).
  password-policy.yaml: |
    metadata:
      name: Tighten and bind the password-change policy
    version: 1
    entries:
      - model: authentik_policies_password.passwordpolicy
        identifiers:
          name: default-password-change-password-policy
        id: default-password-change-password-policy
        attrs:
          password_field: password
          check_static_rules: true
          length_min: 14
          amount_uppercase: 1
          amount_lowercase: 1
          amount_digits: 1
          amount_symbols: 1
          # zxcvbn's pattern-based strength estimate (0-4) and HaveIBeenPwned
          # both catch things character-class rules can't (e.g.
          # "Password123!" satisfies every rule above but is trivially
          # guessable) - the fail condition is "score <= threshold", so 3
          # only lets score 4 ("very strong") through. hibp_allowed_count: 0
          # is deny-on-any-appearance in the breach corpus, not just common
          # ones.
          check_zxcvbn: true
          zxcvbn_score_threshold: 3
          check_have_i_been_pwned: true
          hibp_allowed_count: 0
          error_message: >-
            Password must be at least 14 characters, include upper/lowercase
            letters, a digit, and a symbol, must not appear in known data
            breaches, and must not be a weak/guessable pattern.
      - model: authentik_stages_prompt.promptstagevalidationpolicy
        identifiers:
          prompt_stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
          policy: !KeyOf default-password-change-password-policy
