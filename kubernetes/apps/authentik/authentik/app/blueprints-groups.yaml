---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-groups
data:
  # Shared access-tier groups, referenced via PolicyBinding on each
  # protected app's authentik_core.application entry (blueprints-protected-apps.yaml)
  # to gate WHO can complete the OIDC login for that app - separate from
  # the per-app *-admins/*-viewers groups in blueprints-native-apps.yaml,
  # which gate in-app ROLE after a login every authenticated user can
  # already complete. Empty membership by default, same convention as
  # those - add yourself/others via the Authentik UI, not blueprint-managed
  # (keeps who-has-access out of a public git repo).
  groups.yaml: |
    metadata:
      name: Access tier groups
    version: 1
    entries:
      - model: authentik_core.group
        identifiers:
          name: arr-users
        id: arr-users-group
      - model: authentik_core.group
        identifiers:
          name: infra-users
        id: infra-users-group
      - model: authentik_core.group
        identifiers:
          name: changedetection-users
        id: changedetection-users-group
      - model: authentik_core.group
        identifiers:
          name: docs-users
        id: docs-users-group
      - model: authentik_core.group
        identifiers:
          name: linkwarden-users
        id: linkwarden-users-group
      - model: authentik_core.group
        identifiers:
          name: forgejo-users
        id: forgejo-users-group
      # First real "tier" group (not a dedicated per-app group like the
      # others above) - intended to be reused by other media apps
      # (jellyfin, audiobookshelf, etc) as they get wired up. Carve a
      # dedicated group out later if a specific media app needs narrower
      # access than the rest of the tier.
      - model: authentik_core.group
        identifiers:
          name: media-users
        id: media-users-group
      # Not an access-tier group like the others above - this one's the
      # destination_group for the shipped NotificationRules
      # (blueprints-notification-destinations.yaml), so it controls who
      # receives system alerts (config errors, exceptions, update
      # available), not who can log into an app. Empty membership by
      # default for the same reason as the others - add yourself via the
      # Authentik UI.
      - model: authentik_core.group
        identifiers:
          name: authentik-notifications
        id: authentik-notifications-group
