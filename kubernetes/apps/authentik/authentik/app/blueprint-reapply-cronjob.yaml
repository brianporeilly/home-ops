---
# Authentik's blueprint re-application is gated on the blueprint YAML
# file's own content hash (authentik/blueprints/v1/tasks.py), not the
# resolved !Env values - a credential rotation never changes the
# blueprint file text, so neither a worker restart nor Authentik's own
# periodic blueprint-discovery task ever picks up a pure secret-value
# change (confirmed against source, and hit for real this session after
# the ESO/Reflector OIDC migration - every already-protected app's
# client_id/secret went stale until manually re-applied via
# `ak apply_blueprint`). This automates that manual step: `kubectl exec`
# into the already-running authentik-worker pod (same thing done by hand
# all session) and re-apply every mounted blueprint file. Idempotent and
# cheap - re-applying an unchanged blueprint is a no-op upsert - so
# looping over all of them unconditionally is simpler and more robust
# than tracking which ones might have a rotated credential.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-blueprint-reapply
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Each `ak apply_blueprint` call has real Django bootstrap overhead
      # (~5s, confirmed live) and there are 14 blueprint files today - this
      # list only grows as more apps get added, so sized with real headroom
      # rather than just enough to clear the current count.
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: authentik-blueprint-reapply
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: reapply
              # rancher/kubectl has no shell at all (confirmed live: "stat
              # /bin/sh: no such file or directory") - this one bundles
              # kubectl with a full alpine shell.
              image: docker.io/alpine/k8s:1.34.1@sha256:67c5ed0a719316e9d0e74d3e58d95708dc8e21e3d9c6904f87c4fb01977630c8
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  POD=$(kubectl get pod -n authentik -l app.kubernetes.io/name=authentik,app.kubernetes.io/component=worker -o jsonpath='{.items[0].metadata.name}')
                  echo "Using worker pod: $POD"
                  kubectl exec -n authentik "$POD" -- sh -c '
                    status=0
                    for f in /blueprints/mounted/*/*.yaml; do
                      echo "=== applying $f ==="
                      ak apply_blueprint "$f" || status=1
                    done
                    exit "$status"
                  '
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 128Mi
