---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for grafana - see echo-oidc-credentials.yaml for
# the full pattern rationale. Generated once (refreshInterval: 0s, never
# rotates), consumed directly here by Authentik's own blueprint and
# mirrored into observability namespace as grafana-oidc-secret via Reflector
# (grafana has no protect component involved - it's a native OIDC app, see
# observability/grafana/app/oidc-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: grafana-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "observability"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
