---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The authentik chart's own route.main (helmrelease.yaml) only supports one
# named HTTPRoute with one hostnames/parentRefs list, unlike bjw-s
# app-template's arbitrary-named route keys (see grocy's helmrelease.yaml
# for that pattern: separate route.app/route.internal blocks). Kept
# route.main internal-only and added this as a plain second HTTPRoute for
# the external hostname instead, backed by the same authentik-server
# Service the chart creates (name/port confirmed live via `kubectl get
# httproute authentik-server -n authentik -o yaml`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server-external
spec:
  hostnames:
    - auth.oreillys.io
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    # Catch-all listed FIRST deliberately - Gateway API's actual routing
    # resolves the more specific PathPrefix below regardless of array order,
    # but gatus-sidecar's HTTPRoute auto-discovery isn't that smart: it just
    # probes whichever path comes from the first rule in this list
    # (confirmed against its source, internal/resources/httproute.go's
    # firstHTTPRoutePath - takes the first Exact/PathPrefix match it finds,
    # full stop). Admin-blocked listed first previously broke the
    # authentik-server-external gatus check for real (confirmed live - 404s
    # from ~07:10 on 2026-08-21, right when this HTTPRoute last reconciled),
    # since it started probing /if/admin instead of /.
    - backendRefs:
        - name: authentik-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
    # The admin UI has zero legitimate external use case (it's for actually
    # administering the instance, not the OIDC/login surface apps depend
    # on) - named so the BackendTrafficPolicy below
    # (backendtrafficpolicy-admin-block.yaml) can target just this rule via
    # sectionName.
    - name: admin-blocked
      matches:
        - path:
            type: PathPrefix
            value: /if/admin
      backendRefs:
        - name: authentik-server
          port: 80
