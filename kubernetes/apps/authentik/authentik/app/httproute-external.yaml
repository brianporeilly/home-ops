---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The authentik chart's own route.main (helmrelease.yaml) only supports one
# named HTTPRoute with one hostnames/parentRefs list, unlike bjw-s
# app-template's arbitrary-named route keys (see grocy's helmrelease.yaml
# for that pattern: separate route.app/route.internal blocks). Kept
# route.main internal-only and added this as a plain second HTTPRoute for
# the external hostname instead, backed by the same authentik-server
# Service the chart creates (name/port confirmed live via `kubectl get
# httproute authentik-server -n authentik -o yaml`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server-external
spec:
  hostnames:
    - auth.oreillys.io
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
