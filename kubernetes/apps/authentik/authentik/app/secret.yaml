# sops --encrypt --in-place secret.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secret
stringData:
  # Cookie signing / unique user ID key. Never changes after first install -
  # rotating it invalidates every session and some stored tokens.
  secret_key: "cb264c5f3122913fa06ff4aa2ac8b8040129ffaf58c16c7e6585c52371de0898"
  # Bootstrap admin, read directly by authentik on first run (chart has no
  # values.yaml key for these - injected via global.env in helmrelease.yaml).
  # Change the email to whatever you actually want to log in as; the
  # password/token below are generated placeholders, safe to leave as-is or
  # replace before first boot.
  AUTHENTIK_BOOTSTRAP_EMAIL: "admin@oreillys.io"
  AUTHENTIK_BOOTSTRAP_PASSWORD: "30f7f72547e55f1bee68b54ac47b34248235f006d7cdd932"
  AUTHENTIK_BOOTSTRAP_TOKEN: "4d985b5a7e2a38dfa40e027aead643676db051dd5c57821f6df5f8316eb62ad7"
