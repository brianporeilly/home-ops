---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for paperless-ngx - see echo-oidc-credentials.yaml
# for the full pattern rationale. paperless-ngx's own OIDC config isn't
# separate client-id/secret env vars - it's a single
# PAPERLESS_SOCIALACCOUNT_PROVIDERS env var holding a whole
# django-allauth SOCIALACCOUNT_PROVIDERS JSON blob with the credential
# embedded inside it, so target.template.data builds that JSON directly
# from the two shared generators via Go templating (confirmed live:
# `{{ index . "client-id" }}` resolves against the combined
# dataFrom-sourced map). Specifying template.data REPLACES the secret's
# content (ESO's default mergePolicy), so client-id/client-secret are
# re-declared explicitly here alongside the combined JSON - Authentik's
# own helmrelease.yaml (PAPERLESS_NGX_OAUTH_CLIENT_ID/SECRET) still
# needs them as plain keys, same shape as every other app's canonical
# credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: paperless-ngx-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "home"
      data:
        client-id: |-
          {{ index . "client-id" }}
        client-secret: |-
          {{ index . "client-secret" }}
        socialaccount-providers.json: |
          {"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"{{ index . "client-id" }}","secret":"{{ index . "client-secret" }}","settings":{"server_url":"https://auth.internal.oreillys.io/application/o/paperless-ngx/.well-known/openid-configuration"}}]}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
