---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-mfa-required
data:
  # default-authentication-mfa-validation's not_configured_action ships as
  # "skip", letting logins through with zero MFA devices enrolled. This
  # flips it to "configure" (force inline enrollment instead).
  #
  # not_configured_action: configure requires configuration_stages to be
  # set too (M2M to Stage, not Flow, despite the shipped setup objects
  # being named/designated as flows) - omitting it fails blueprint
  # validation outright ("you must set a configuration stage"), and since
  # the whole blueprint file applies in one DB transaction, a failing entry
  # rolls the rest back too, so not_configured_action silently never takes
  # effect if this is missing. Points at the TOTP and WebAuthn setup stages
  # specifically (not the static/recovery-codes one - that's a backup
  # method, not a primary second factor, forcing *only* that would just
  # hand out backup codes with nothing to back up).
  #
  # Only affects the direct username+password login path -
  # default-authentication-flow. SSO logins never touch this stage: a
  # source's authentication_flow for returning users is a completely
  # separate flow (default-source-authentication), so Google/GitHub users
  # are unaffected either way. In this household's model that means it
  # only ever bites akadmin (the intentional break-glass account) -
  # everyone else is meant to be SSO-only with no local password to
  # trigger this path (see blueprints-sso-enrollment-allowlist.yaml).
  mfa-required.yaml: |
    metadata:
      name: Require MFA on the local password login path
    version: 1
    entries:
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
