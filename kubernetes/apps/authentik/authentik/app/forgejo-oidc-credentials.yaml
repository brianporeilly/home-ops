---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for forgejo - see echo-oidc-credentials.yaml
# for the full pattern rationale. Consumed directly here by Authentik's
# own blueprint and mirrored into misc namespace as forgejo-oidc-secret
# via Reflector, where a CronJob (forgejo/app/oidc-source-cronjob.yaml)
# feeds it into `forgejo admin auth` - Forgejo has no env-var/config-file
# OIDC mechanism, only a CLI with no built-in idempotent apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: forgejo-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "misc"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
