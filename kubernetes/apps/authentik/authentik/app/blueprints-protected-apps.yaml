          client_secret: !Env CHANGEDETECTION_OAUTH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://changedetection.internal.oreillys.io/oauth2/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        identifiers:
          slug: changedetection
        id: changedetection-application
        attrs:
          name: changedetection.io
          provider: !KeyOf changedetection-provider
      # Dedicated group, not arr-users/media-users - changedetection has no
      # per-user isolation (one shared watch list/session for everyone who
      # can log in), so membership here is meant to stay small/deliberate
      # rather than tier-wide.
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          target: !KeyOf changedetection-application
          group: !Find [authentik_core.group, [name, changedetection-users]]
