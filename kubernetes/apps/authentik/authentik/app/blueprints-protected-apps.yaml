---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-protected-apps
data:
  # Authentik acting as the OIDC Identity Provider FOR each app behind a
  # kubernetes/components/authentik/protect SecurityPolicy - separate
  # concern (and separate ConfigMap) from oauth-sources.yaml, where
  # Google/GitHub act as IdPs FOR authentik. One data key per protected
  # app, consolidated into a single ConfigMap so adding a new app only
  # means appending a key here + one blueprints.configMaps list entry
  # that's already permanently present (see helmrelease.yaml) - not a new
  # ConfigMap resource and list entry every time. Each key still stays
  # independently addable/removable, same as before.
  #
  # Schema confirmed against a real shipped blueprint
  # (blueprints/testing/oidc-conformance.yaml) and the default scope
  # mappings (blueprints/system/providers-oauth2.yaml), not guessed.
  # Flow slugs: default-provider-authorization-implicit-consent (skips the
  # "do you want to share your info with <app>?" click - confirmed by
  # reading both flows: explicit-consent binds one extra ConsentStage,
  # implicit-consent has zero stages bound at all, immediate pass-through.
  # Both still require authentication: require_authenticated - this only
  # removes the consent click, not any actual auth check. Fine for apps we
  # control ourselves. Not to be confused with the OAuth2 "implicit" *grant
  # type* below - unrelated "implicit", every provider here only uses
  # authorization_code/refresh_token grants) and
  # default-provider-invalidation-flow.
  #
  # Issuer URL confirmed from authentik/providers/oauth2/{models,apps,urls}.py:
  # mountpoint application/o/ + <application_slug>/, default issuer_mode
  # (per_provider, not global) - https://auth.internal.oreillys.io/application/o/<slug>/
  #
  # Redirect URI matches Envoy Gateway's own OIDC callback convention
  # (<route-path-prefix>/oauth2/callback, confirmed against envoyproxy/gateway's
  # own docs example) - see each app's own SecurityPolicy (via
  # kubernetes/components/authentik/protect).
  provider-echo.yaml: |
    metadata:
      name: OIDC Provider - echo
    version: 1
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: echo
        id: echo-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_id: !Env ECHO_OAUTH_CLIENT_ID
          client_secret: !Env ECHO_OAUTH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://echo.internal.oreillys.io/oauth2/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://echo.oreillys.io/oauth2/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        identifiers:
          slug: echo
        id: echo-application
        attrs:
          name: Echo
          provider: !KeyOf echo-provider
      # Deliberately no PolicyBinding here, unlike every other app below -
      # echo is the test/demo app used to validate the auth pipeline
      # itself, restricting it doesn't protect anything real and would
      # just get in the way next time the SSO flow needs poking at. Any
      # authenticated user can reach it.
      #
      # Sets this Application as the default Brand's default_application -
      # fixes the "Interface can only be accessed by internal users"
      # lockout hit testing SSO enrollment: external-type (SSO-enrolled)
      # users are denied both /if/admin/ and /if/user/ unless the Brand has
      # one set (authentik/core/views/interface.py's
      # BrandDefaultRedirectView). Only the first protected app should set
      # this - it's a singular "where do external users land" designation.
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          default_application: !KeyOf echo-application
