            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        identifiers:
          slug: burst-orchestrator
        id: burst-orchestrator-application
        attrs:
          name: Burst Orchestrator
          provider: !KeyOf burst-orchestrator-provider
      # Starts coding agents and approves their network access - same
      # infra-users gate as kopiur-ui/whisker.
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          target: !KeyOf burst-orchestrator-application
          group: !Find [authentik_core.group, [name, infra-users]]
  # The coding sessions burst-orchestrator starts, each at its own
  # session-NAME[-term].internal.oreillys.io: one provider for them all, so
  # its redirect URI is a regex (Envoy Gateway's per-host default callback).
  # The SecurityPolicy using it selects the sessions' HTTPRoutes by label
  # (kubernetes/apps/agent-sandbox/agent-sandbox/session-sign-in/).
  provider-burst-sessions.yaml: |
    metadata:
      name: OIDC Provider - burst-sessions
    version: 1
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: burst-sessions
        id: burst-sessions-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_id: !Env BURST_SESSIONS_OAUTH_CLIENT_ID
          client_secret: !Env BURST_SESSIONS_OAUTH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: regex
              url: 'https://session-[a-z0-9-]+\.internal\.oreillys\.io/oauth2/callback'
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        identifiers:
          slug: burst-sessions
        id: burst-sessions-application
        attrs:
          name: Burst Sessions
          provider: !KeyOf burst-sessions-provider
      # Same infra-users gate as the orchestrator that starts them.
      - model: authentik_policies.policybinding
        identifiers:
          order: 0
          target: !KeyOf burst-sessions-application
          group: !Find [authentik_core.group, [name, infra-users]]
