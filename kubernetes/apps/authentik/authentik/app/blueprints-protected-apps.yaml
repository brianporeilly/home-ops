          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_id: !Env BURST_ORCHESTRATOR_OAUTH_CLIENT_ID
          client_secret: !Env BURST_ORCHESTRATOR_OAUTH_CLIENT_SECRET
