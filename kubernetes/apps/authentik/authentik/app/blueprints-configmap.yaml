---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-oauth-sources
data:
  # Mounted via the chart's blueprints.configMaps (helmrelease.yaml) to
  # /blueprints/mounted/cm-<name>/ on the worker. !Env pulls OAuth secrets
  # from env vars (global.env in helmrelease.yaml) instead of embedding them.
  #
  # Creating an OAuthSource alone doesn't add a login button: the default
  # authentication flow's IdentificationStage has its own `sources` M2M
  # field (separate from each Source's `enabled` flag) that starts empty -
  # the identification-stage entry below adds ours via !Find.
  #
  # A source also needs authentication_flow/enrollment_flow set explicitly
  # (both null by default on OAuthSource), or first-time login fails post-
  # callback with "source is not configured for enrollment". Pointed at
  # authentik's shipped default-source-authentication/-enrollment flows.
  #
  # Silent enrollment (no username prompt, username = email): the default
  # enrollment flow skips its prompt stage when `username` is already in
  # prompt_data, so the mapping below resolves username from email for both
  # providers - GitHub otherwise defaults to the user's handle, Google has
  # no username concept and always prompts.
  #
  # user_matching_mode: email_link, not the default `identifier` (per-source
  # ID) - keeps both providers resolving to one account per email instead of
  # a separate account per source. Safe here because Google/GitHub both
  # verify email ownership before exposing it via OAuth; reconsider for a
  # source that doesn't.
  #
  # Auto-promotes trusted emails to type=internal at enrollment. Default
  # type=external gets hard-redirected by BrandDefaultRedirectView away from
  # both /if/user/ and /if/admin/ with no way through, so external accounts
  # can't reach their own settings. UserWriteStage.update_user() setattr's
  # any resolved profile key the User model has (unless disallowed:
  # groups/id/pk) - "type" isn't blocked, same mechanism that sets username
  # above. Only fires at first-time enrollment; doesn't touch already-
  # enrolled accounts, and admins can always override type by hand.
  oauth-sources.yaml: |
    metadata:
      name: OAuth sources (Google, GitHub)
    version: 1
    entries:
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Custom - Username from email"
        id: username-from-email
        attrs:
          expression: |
            return {
                "username": properties.get("email"),
            }
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Custom - Internal type for trusted emails"
        id: internal-type-for-trusted-emails
        attrs:
          expression: |
            # Allowlist, not denylist - anyone unlisted stays external (limited access).
            # Also the sole source of truth for whether enrollment is allowed at all:
            # blueprints-sso-enrollment-allowlist.yaml denies enrollment outright for
            # anyone this doesn't return type: internal for.
            trusted_domains = ["oreillys.io"]
            trusted_emails = ["brianporeilly@gmail.com"]

            email = properties.get("email") or ""
            domain = email.rsplit("@", 1)[-1] if "@" in email else ""

            if domain in trusted_domains or email in trusted_emails:
                return {"type": "internal"}
            return {}
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: google
        attrs:
          name: Google
          provider_type: google
          consumer_key: !Env GOOGLE_OAUTH_CLIENT_ID
          consumer_secret: !Env GOOGLE_OAUTH_CLIENT_SECRET
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          user_property_mappings:
            - !KeyOf username-from-email
            - !KeyOf internal-type-for-trusted-emails
          user_matching_mode: email_link
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: github
        attrs:
          name: GitHub
          provider_type: github
          consumer_key: !Env GITHUB_OAUTH_CLIENT_ID
          consumer_secret: !Env GITHUB_OAUTH_CLIENT_SECRET
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          user_property_mappings:
            - !KeyOf username-from-email
            - !KeyOf internal-type-for-trusted-emails
          user_matching_mode: email_link
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
            - !Find [authentik_sources_oauth.oauthsource, [slug, github]]
