---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-oauth-sources
data:
  # Authentik's own GitOps-native config mechanism - mounted via the chart's
  # blueprints.configMaps value (helmrelease.yaml), which lands this at
  # /blueprints/mounted/cm-<name>/ on the worker only (blueprint discovery
  # is a background task, not something the server process needs). !Env
  # pulls consumer_key/consumer_secret from environment variables at apply
  # time (see global.env in helmrelease.yaml) rather than embedding OAuth
  # client secrets directly in this ConfigMap - verified against
  # authentik/blueprints/v1/common.py's Env YAMLTag class.
  #
  # Creating the OAuthSource objects alone isn't enough for them to appear
  # as login buttons - confirmed live (PR #523 merged, sources existed and
  # were enabled, but nothing showed on the login page). The default
  # authentication flow's IdentificationStage has its own `sources` M2M
  # field, separate from each Source's own `enabled` flag, and starts
  # empty - the identification-stage entry below adds ours to it, matched
  # by !Find rather than a hardcoded PK.
  #
  # Nor is that enough on its own: a first-time login via an external
  # source with no authentication_flow/enrollment_flow set fails post-
  # callback with "source is not configured for enrollment" - both fields
  # (on the base Source model, authentik/core/models.py) default to null.
  # Pointed at authentik's own shipped default-source-authentication /
  # default-source-enrollment flows - confirmed live (PR #524 fixed the
  # sources-not-showing gap, then this exact error surfaced on the actual
  # callback once a real login was attempted).
  #
  # Schema for all of this confirmed against real shipped blueprints and
  # each model's own blueprint test fixtures in goauthentik/authentik, not
  # guessed - see also the live DB checks that caught both gaps: `ak shell`
  # -> IdentificationStage.objects.first().sources.all() returned [], and
  # OAuthSource.objects.first().{authentication_flow,enrollment_flow} were
  # both None, despite the sources themselves existing and being enabled.
  #
  # Fully-silent enrollment (no "choose a username" prompt, username =
  # email for both providers): authentik's own default enrollment flow
  # (default-source-enrollment) already has a policy that SKIPS its prompt
  # stage whenever `username` is already present in the resolved profile
  # data (`'username' not in context.get('prompt_data', {})` - see
  # goauthentik/authentik's flow-default-source-enrollment.yaml) - so no
  # custom flow is needed, just a property mapping that resolves username
  # ourselves. GitHub already sets username to the user's GitHub handle by
  # default (get_base_user_properties in sources/oauth/types/github.py);
  # Google has no username concept at all and always prompted. The mapping
  # below overrides both to the same email-derived value for consistency
  # regardless of which provider was used, keying off `properties.get`
  # (the already-resolved base properties, including GitHub's fallback
  # email-list lookup when no public email is set) rather than the raw
  # `info` dict directly. Verified by exercising authentik's own
  # SourceMapper.build_object_properties() in `ak shell` with synthetic
  # profile data for both providers - confirmed username resolves to the
  # email in both cases, correctly overriding GitHub's handle-based default.
  #
  # user_matching_mode: email_link on both - default is `identifier`
  # (source-specific ID, e.g. Google's sub / GitHub's numeric id), which
  # would create a SEPARATE account per source even for the same person's
  # email. email_link resolves both to the same account instead. authentik's
  # own docs flag a security caveat for this mode ("can have security
  # implications when a source doesn't validate email addresses") - not a
  # concern for Google/GitHub specifically, both verify email ownership
  # before exposing it via their OAuth APIs; would need reconsidering for
  # a source that doesn't.
  #
  # Auto-promote trusted emails to type=internal at enrollment time - by
  # default SSO-enrolled users get type=external, which authentik's own
  # BrandDefaultRedirectView (authentik/core/views/interface.py) hard-
  # redirects away from BOTH /if/user/ (account settings, MFA, logout) and
  # /if/admin/ to the Brand's default_application, with no way through -
  # hit live testing echo, confirmed via `ak shell` that two enrolled test
  # accounts had zero path to their own account settings despite both
  # existing and being enabled. Traced the fix via
  # authentik/stages/user_write/stage.py: UserWriteStage.update_user() does
  # a generic setattr(user, key, value) for any key in the resolved
  # profile properties that the User model has a real attribute for and
  # isn't on its disallowed list (groups/id/pk) - same mechanism that
  # already sets username from our own mapping above, "type" just isn't
  # blocked. This only fires at first-time enrollment (UserWriteStage runs
  # in the enrollment flow, not the authentication flow returning users
  # take) - doesn't retroactively touch already-enrolled accounts, and an
  # admin can always override any user's type by hand in the UI regardless
  # of what this set at enrollment time.
  oauth-sources.yaml: |
    metadata:
      name: OAuth sources (Google, GitHub)
    version: 1
    entries:
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Custom - Username from email"
        id: username-from-email
        attrs:
          expression: |
            return {
                "username": properties.get("email"),
            }
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Custom - Internal type for trusted emails"
        id: internal-type-for-trusted-emails
        attrs:
          expression: |
            # Allowlist, not a denylist - default stays external (limited,
            # app-only access) for anyone not listed here. Extend as more
            # people/addresses become trusted; an admin can also just
            # override a specific user's type by hand in the UI any time,
            # regardless of what this sets at enrollment.
            #
            # Also the sole source of truth for whether a new SSO signup is
            # allowed to enroll at all, not just its UI-access tier -
            # blueprints-sso-enrollment-allowlist.yaml denies enrollment
            # outright for anyone this doesn't return type: internal for.
            # Change the lists below and that gate inherits it automatically.
            trusted_domains = ["oreillys.io"]
            trusted_emails = ["brianporeilly@gmail.com"]

            email = properties.get("email") or ""
            domain = email.rsplit("@", 1)[-1] if "@" in email else ""

            if domain in trusted_domains or email in trusted_emails:
                return {"type": "internal"}
            return {}
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: google
        attrs:
          name: Google
          provider_type: google
          consumer_key: !Env GOOGLE_OAUTH_CLIENT_ID
          consumer_secret: !Env GOOGLE_OAUTH_CLIENT_SECRET
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          user_property_mappings:
            - !KeyOf username-from-email
            - !KeyOf internal-type-for-trusted-emails
          user_matching_mode: email_link
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: github
        attrs:
          name: GitHub
          provider_type: github
          consumer_key: !Env GITHUB_OAUTH_CLIENT_ID
          consumer_secret: !Env GITHUB_OAUTH_CLIENT_SECRET
          authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          user_property_mappings:
            - !KeyOf username-from-email
            - !KeyOf internal-type-for-trusted-emails
          user_matching_mode: email_link
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
            - !Find [authentik_sources_oauth.oauthsource, [slug, github]]
