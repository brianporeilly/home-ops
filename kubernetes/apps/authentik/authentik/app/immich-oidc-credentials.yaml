---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for immich - see echo-oidc-credentials.yaml
# for the full pattern rationale. Consumed directly here by Authentik's
# own blueprint and mirrored into immich namespace as immich-oidc-secret
# via Reflector, where a CronJob (immich/app/oidc-system-config-cronjob.yaml)
# feeds it into Immich's own system-config API - like forgejo, Immich has
# no env-var/config-file OIDC mechanism, only an admin-only REST API
# (GET/PUT /api/system-config).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: immich-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "immich"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
