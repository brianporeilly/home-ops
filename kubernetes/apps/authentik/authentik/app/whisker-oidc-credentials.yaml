---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for whisker - see echo-oidc-credentials.yaml for
# the full pattern rationale. Generated once (refreshInterval: 0s, never
# rotates), consumed directly here by Authentik's own blueprint and
# mirrored into calico-system namespace as whisker-oidc-client-secret via
# Reflector - that's where the tigera-operator always creates the real
# `whisker` Service, regardless of Flux targetNamespace (see
# kubernetes/apps/kube-system/calico/route/httproute.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whisker-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: whisker-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "calico-system"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
