---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for lidarr - see echo-oidc-credentials.yaml for
# the full pattern rationale. Generated once (refreshInterval: 0s, never
# rotates), consumed directly here by Authentik's own blueprint and
# mirrored into download namespace as lidarr-oidc-client-secret via Reflector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: lidarr-oidc-credentials
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "download"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
