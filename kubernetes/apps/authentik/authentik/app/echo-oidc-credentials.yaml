---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Canonical OIDC credential for echo - generated once (refreshInterval: 0s,
# never regenerates, even across an operator restart or a forced resync),
# consumed directly here by Authentik's own blueprint
# (!Env ECHO_OAUTH_CLIENT_ID/SECRET, sourced from this Secret) and mirrored
# into network namespace as echo-oidc-client-secret via Reflector (see
# components/authentik/protect's own oidc-client-secret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: echo-oidc-credentials
spec:
  refreshInterval: "0s"
  target:
    name: echo-oidc-credentials
    template:
      metadata:
        annotations:
          # Lets network namespace's echo-oidc-client-secret (Reflector
          # "pull" mode) mirror this Secret's values.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "network"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oidc-client-secret
