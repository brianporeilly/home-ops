---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &valkey authentik-valkey
  namespace: &namespace authentik
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *valkey
  interval: 1h
  path: ./kubernetes/apps/authentik/authentik/valkey
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik
  namespace: &namespace authentik
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # authentik-valkey: real health-gated ordering (not just retry-until-ready) -
  # Authentik's bootstrap migration on first boot needs Redis reachable.
  dependsOn:
    - name: authentik-valkey
      namespace: *namespace
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: postgres-operator
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/authentik/authentik/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
