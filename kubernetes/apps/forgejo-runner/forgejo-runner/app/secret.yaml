---
# Reflector pull mirror of the shared registration secret ESO generates in
# misc (kubernetes/apps/misc/forgejo/app/runner-secret.yaml). Nothing to
# sops-encrypt; Reflector populates `secret`.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "misc/forgejo-runner-secret"
type: Opaque
