---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nebraska
spec:
  interval: 1h
  chart:
    spec:
      chart: nebraska
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: nebraska
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1

    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534

    config:
      syncer:
        enabled: true
      # Nebraska mirrors the Flatcar OS update payloads locally: the syncer
      # pre-fetches the latest release for every tracked channel/arch (stable,
      # beta, alpha, edge, lts-*; amd64 + arm64) into the PVC below and rewrites
      # Omaha payload URLs to nebraskaURL, so nodes pull updates over the LAN
      # instead of Flatcar's public mirrors. No automatic GC — payloads
      # accumulate as channels advance, so prune /mnt/packages or grow the PVC.
      hostFlatcarPackages:
        enabled: true
        nebraskaURL: https://nebraska.internal.oreillys.io
        packagesPath: /mnt/packages
        persistence:
          enabled: true
          storageClass: ceph-block
          size: 30Gi
      # Nebraska's own auth middleware (backend/pkg/middleware/auth.go
      # commonPaths) always exempts /v1/update (the Omaha device-update
      # endpoint Flatcar nodes actually call) and /apps, /apps/*,
      # /instances, /instances/* (read-only views) regardless of auth
      # mode - so switching this to oidc only gates the write/management
      # surface, node updates keep working unauthenticated.
      auth:
        mode: oidc
        oidc:
          # Public client, no secret - see the matching comment on the
          # Authentik blueprint (blueprints-native-apps.yaml,
          # provider-nebraska.yaml) for the full architecture rationale.
          # No existingSecret set: the chart auto-creates its own Secret
          # wrapping this clientID (confirmed against
          # charts/nebraska/templates/secrets.yaml) - nothing extra to
          # manage here.
          clientID: "05e3a848335180ba305a18a3fa75a926395937e1"
          issuerURL: https://auth.internal.oreillys.io/application/o/nebraska/
          managementURL: https://nebraska.internal.oreillys.io
          logoutURL: https://auth.internal.oreillys.io/application/o/nebraska/end-session/
          adminRoles: nebraska-admins
          # Required non-empty by this chart's app version (3.0.0) even if
          # you don't plan to use it - config.go's Validate() rejects an
          # empty viewerRoles outright, confirmed live (crashloop,
          # "invalid OIDC configuration", before adding this).
          viewerRoles: nebraska-viewers
          # Read straight from the JWT access token (this chart version -
          # 2.0.0/app v3.0.0 - has no userinfo-fallback option at all, only
          # a later unreleased version does). Confirmed via Authentik's own
          # IDToken.to_access_token(): it's built from the same claims dict
          # as the id_token (`id_dict.update(self.claims)`), so the access
          # token carries the profile scope's groups claim too, not just
          # minimal bearer-token fields.
          rolesPath: groups
          scopes: openid,profile,email
      database:
        host: nebraska-postgres-rw
        port: 5432
        dbname: nebraska
        username: nebraska
        passwordExistingSecret:
          enabled: true
          name: nebraska-postgres-creds
          key: password

    postgresql:
      enabled: false

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: nebraska
        spec:
          hostnames:
            - nebraska.internal.oreillys.io
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          rules:
            - backendRefs:
                - name: nebraska
                  port: 80
