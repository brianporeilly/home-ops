---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nebraska
spec:
  interval: 1h
  chart:
    spec:
      chart: nebraska
      version: 2.0.0
      sourceRef:
        kind: HelmRepository
        name: nebraska
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1

    config:
      syncer:
        enabled: true
      # We only use Nebraska for Omaha update-check/channel/group management;
      # clients still fetch the actual OS payloads from Flatcar's public mirrors.
      hostFlatcarPackages:
        enabled: false
        nebraskaURL: https://nebraska.internal.oreillys.io
      auth:
        mode: noop
      database:
        host: nebraska-postgres-rw
        port: 5432
        dbname: nebraska
        username: nebraska
        passwordExistingSecret:
          enabled: true
          name: nebraska-postgres-creds
          key: password

    postgresql:
      enabled: false

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: nebraska
        spec:
          hostnames:
            - nebraska.internal.oreillys.io
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          rules:
            - backendRefs:
                - name: nebraska
                  port: 80
