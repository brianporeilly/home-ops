---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nebraska
spec:
  interval: 1h
  chart:
    spec:
      chart: nebraska
      version: 2.0.0
      sourceRef:
        kind: HelmRepository
        name: nebraska
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1

    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534

    config:
      syncer:
        enabled: true
      # Nebraska mirrors the Flatcar OS update payloads locally: the syncer
      # pre-fetches the latest release for every tracked channel/arch (stable,
      # beta, alpha, edge, lts-*; amd64 + arm64) into the PVC below and rewrites
      # Omaha payload URLs to nebraskaURL, so nodes pull updates over the LAN
      # instead of Flatcar's public mirrors. No automatic GC — payloads
      # accumulate as channels advance, so prune /mnt/packages or grow the PVC.
      hostFlatcarPackages:
        enabled: true
        nebraskaURL: https://nebraska.internal.oreillys.io
        packagesPath: /mnt/packages
        persistence:
          enabled: true
          storageClass: ceph-block
          size: 30Gi
      auth:
        mode: noop
      database:
        host: nebraska-postgres-rw
        port: 5432
        dbname: nebraska
        username: nebraska
        passwordExistingSecret:
          enabled: true
          name: nebraska-postgres-creds
          key: password

    postgresql:
      enabled: false

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: nebraska
        spec:
          hostnames:
            - nebraska.internal.oreillys.io
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          rules:
            - backendRefs:
                - name: nebraska
                  port: 80
