---
# One-shot admin bootstrap. Deliberately does NOT mount the app's real PVCs
# (both are ReadWriteOnce and already attached to the running forgejo pod) -
# uses its own throwaway emptyDir work dir instead. `admin user create` only
# needs the DB connection (external, shared with the main app) to do its job;
# it doesn't need any of the persisted app state. Not overriding `command:`
# so the image's normal entrypoint still runs environment-to-ini before
# executing these args, same as the real app.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-bootstrap
  annotations:
    # Job's pod template is immutable - without this, a future edit to this
    # spec (e.g. changing the admin username) would fail to apply instead of
    # recreating the Job. Lets Flux delete+recreate on conflict instead.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: forgejo-bootstrap
          image: codeberg.org/forgejo/forgejo:16.0.3-rootless@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
          # Must be `args`, not `command` - `command` would replace the
          # image's real ENTRYPOINT (dumb-init -- docker-entrypoint.sh)
          # outright, skipping docker-setup.sh (env-to-ini config generation)
          # entirely and breaking the INSTALL_LOCK fix above. `args` only
          # replaces CMD, so docker-entrypoint.sh still runs docker-setup.sh
          # unconditionally before `exec`-ing into this sh -c.
          #
          # Idempotency matters: Flux's Kustomization reconciles hourly, and
          # this Job's ttlSecondsAfterFinished (also 1h) means it gets deleted
          # and recreated from the same unchanged manifest on essentially
          # every reconcile once it's finished - `admin user create` then
          # fails with "user already exists" forever, a real (not spurious)
          # failure that pages on every run. `|| echo ...` makes that outcome
          # count as success instead of alerting hourly.
          args:
            - sh
            - -c
            - >-
              forgejo admin user create --admin --username=root
              --email=root@oreillys.io --password="$ADMIN_PASSWORD"
              --must-change-password=false ||
              echo "admin user create failed (already exists?) - continuing"
          env:
            # docker-setup.sh only auto-sets this to true when $SECRET_KEY is
            # non-empty; we don't set one here (throwaway config, DB is all
            # that matters), so it must be forced explicitly or
            # MustInstalled() refuses to run any admin command.
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-postgres-rw:5432
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: dbname
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-bootstrap-secret
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: work-dir
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
