---
# Registers the instance-wide runner with its shared secret; the runner
# presents the same secret from the forgejo-runner namespace. `register` is
# idempotent, so the hourly recreate is harmless, but it overwrites the
# runner's labels unless given: keep --labels in step with the runner's config. Same shape as job.yaml
# (args not command, throwaway work dir, DB-only config).
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-runner-register
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner-register
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: register
          image: codeberg.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
          args:
            - sh
            - -c
            - >-
              forgejo forgejo-cli actions register
              --secret "$RUNNER_SECRET" --name k8s-runner
              --labels docker,ubuntu-latest
          env:
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: forgejo-postgres-rw:5432
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: dbname
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: username
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: password
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: work-dir
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
