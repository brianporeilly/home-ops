---
# Reflector pull mirror of the canonical forgejo-oidc-credentials Secret
# ESO generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml for the
# same pattern. Consumed by oidc-source-cronjob.yaml, not the forgejo
# app container itself.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/forgejo-oidc-credentials"
type: Opaque
