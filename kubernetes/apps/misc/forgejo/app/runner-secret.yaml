---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Forgejo wants the runner's shared secret as exactly 40 hex characters;
# hex encoding doubles `length`.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: runner-secret
spec:
  length: 20
  encoding: hex
  digits: 0
  symbols: 0
  noUpper: true
  allowRepeat: true
  secretKeys: ["secret"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once (refreshInterval 0s) and mirrored into forgejo-runner by
# Reflector; forgejo-bootstrap registers it with Forgejo, the runner presents it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
spec:
  refreshInterval: "0s"
  target:
    name: forgejo-runner-secret
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "forgejo-runner"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: runner-secret
