---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: git-pages
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: git-pages
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      git-pages:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: codeberg.org/git-pages/git-pages
              tag: 0.10.2@sha256:e4fd060a702ac9dd8fb812b3ae7ac00ed4a358a18a8e65727b92bbc2a692e5dc
            command: ["git-pages", "-config", "/config/config.toml"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      config:
        data:
          config.toml: |
            [server]
            pages = "tcp/:3000"
            proxy = "-"
            metrics = "tcp/:3002"

            [storage]
            type = "fs"

            [storage.fs]
            root = "/data"

            [limits]
            max-site-size = "256M"

            # Sites for <owner>.pages.internal.oreillys.io/<repo>/; a job's
            # automatic token may publish its own repo's site.
            [[wildcard]]
            domain = "pages.internal.oreillys.io"
            clone-url = "https://forgejo.internal.oreillys.io/<user>/<project>.git"
            index-repo = "pages"
            authorization = "forgejo"
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        # Gatus can't probe a wildcard host; an unpublished host answering
        # 404 proves route, TLS and pod are all up.
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://gatus.pages.internal.oreillys.io/
            conditions:
              - "[STATUS] == 404"
        hostnames:
          - "*.pages.internal.oreillys.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          git-pages:
            app:
              - path: /config
      data:
        suffix: data
        storageClass: "ceph-filesystem"
        accessMode: ReadWriteMany
        size: "10Gi"
        advancedMounts:
          git-pages:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          git-pages:
            app:
              - path: /tmp
