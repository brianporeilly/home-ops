---
# Reflector pull mirror of the canonical linkwarden-oidc-credentials
# Secret ESO generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml for the
# same pattern.
apiVersion: v1
kind: Secret
metadata:
  name: linkwarden-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/linkwarden-oidc-credentials"
type: Opaque
