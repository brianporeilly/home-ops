---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: linkwarden
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.0@sha256:d805877fb707d160b809027c302f84cfba11a248d7fdc12de90b4791f98e6b55
            env:
              NEXTAUTH_URL: https://linkwarden.internal.oreillys.io/api/v1/auth
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: DATABASE_URL
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: NEXTAUTH_SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        primary: true
        controller: linkwarden
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - linkwarden.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        globalMounts:
          - path: /data/data
