---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: linkwarden
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.1@sha256:6902e62a6d68e1906045310dbf9b2df7f3d784a7b2e9d0f02c23666023791634
            env:
              NEXTAUTH_URL: https://linkwarden.internal.oreillys.io/api/v1/auth
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              # OIDC login via Authentik - password login stays enabled
              # alongside it. DISABLE_NEW_SSO_USERS intentionally left unset
              # (defaults to allowing auto-provisioning on first SSO login) -
              # Authentik's own linkwarden-users PolicyBinding
              # (blueprints-groups.yaml) already gates who can complete the
              # OIDC flow, so anyone who reaches this app via SSO is already
              # authorized.
              NEXT_PUBLIC_OIDC_ENABLED: "true"
              OIDC_CUSTOM_NAME: Authentik
              OIDC_WELLKNOWN_URL: https://auth.internal.oreillys.io/application/o/linkwarden/.well-known/openid-configuration
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-oidc-secret
                    key: client-secret
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: DATABASE_URL
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: NEXTAUTH_SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        primary: true
        controller: linkwarden
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - linkwarden.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation. Sparse content here is expected -
        # bookmarks live in Postgres, this PVC only holds uploaded assets.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: linkwarden
        globalMounts:
          - path: /data/data
