---
# Barman Cloud Plugin backup target (Ceph RGW S3). See docs/backup-dr-plan.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: linkwarden-postgres-backup
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://cnpg-linkwarden/
    endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
    s3Credentials:
      accessKeyId:
        name: linkwarden-postgres-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: linkwarden-postgres-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
