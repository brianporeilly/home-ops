---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: thingport-postgres
spec:
  instances: 1
  # Upstream's compose runs Postgres 16.
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-202611230809-standard-trixie
  storage:
    size: 5Gi
    storageClass: ceph-block-ssd
  bootstrap:
    initdb:
      database: thingport
      owner: thingport
  monitoring:
    enablePodMonitor: true
