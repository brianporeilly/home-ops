---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: thingport-auth-secret
spec:
  length: 64
  encoding: hex
  digits: 0
  symbols: 0
  # 64 chars > the 52 unique letters left with digits/symbols off.
  allowRepeat: true
  secretKeys: ["AUTH_SECRET"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# refreshInterval 0s: generated once. Rotating AUTH_SECRET invalidates every login token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thingport-secret
spec:
  refreshInterval: "0s"
  target:
    name: thingport-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: thingport-auth-secret
