apiVersion: v1
kind: Secret
metadata:
  name: maddy-secret
stringData:
  # Upstream smarthost maddy relays outbound mail to.
  # SES implicit-TLS default shown; change region/host as needed.
  UPSTREAM_TARGET: tls://email-smtp.us-east-1.amazonaws.com:465
  # SES SMTP credentials (NOT your AWS access keys — generate SMTP creds in the
  # SES console / `aws ses ...`). Replace these placeholders before encrypting.
  UPSTREAM_USER: REPLACE_ME
  UPSTREAM_PASS: REPLACE_ME
