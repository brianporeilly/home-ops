# maddy configured as an outbound SMTP relay / smarthost.
#
# In-cluster apps submit mail to this server over PLAIN SMTP with NO AUTH on
# port 25 (cluster-internal only). maddy queues it and relays everything to an
# upstream provider (Amazon SES by default) authenticating with credentials
# injected from the `maddy-secret` sops Secret via {env:...} expansion.
#
# There is no local mailbox storage, IMAP, or inbound MX handling — this box
# only forwards outbound.

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}

# Global hostname: inherited by the smtp endpoint, target.queue, and
# target.smtp, all of which require it. Without it maddy fails with
# "missing required directive: hostname".
hostname $(hostname)

# Keep writable state on the PVC (/data) and runtime sockets on tmpfs (/tmp),
# so the container can run with a read-only root filesystem.
state_dir /data
runtime_dir /tmp/maddy

# Accept mail from anything that can reach the Service. No auth: reachability
# is the trust boundary (cluster network / NetworkPolicy). No TLS on the
# internal listener — traffic is cluster-internal plaintext.
smtp tcp://0.0.0.0:25 {
    hostname $(hostname)
    tls off
    deliver_to &remote_queue
}

# Durable outbound queue (survives restarts via the PVC state_dir).
target.queue remote_queue {
    target &upstream_smtp
    max_tries 10
}

# Relay everything to the upstream smarthost with authentication.
# UPSTREAM_TARGET example (SES, implicit TLS):
#   tls://email-smtp.us-east-1.amazonaws.com:465
# Use tcp:// (STARTTLS negotiated, attempt_starttls defaults to yes) for hosts
# that only speak submission on 587.
target.smtp upstream_smtp {
    targets {env:UPSTREAM_TARGET}
    auth plain {env:UPSTREAM_USER} {env:UPSTREAM_PASS}
}
