---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuwunel
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      tuwunel:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v1.9.0@sha256:295a1ceedbfd7afce05c69a38efb246dd31fa810e5d352fc7a09b261853800ee
            env:
              TUWUNEL_SERVER_NAME: oreillys.io
              TUWUNEL_ADDRESS: "0.0.0.0"
              TUWUNEL_PORT: "8008"
              TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
              TUWUNEL_ALLOW_REGISTRATION: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: &port 8008
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: tuwunel
        ports:
          http:
            port: 8008

    route:
      app:
        hostnames:
          - tuwunel.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      db:
        suffix: db
        storageClass: "ceph-block-ssd"
        accessMode: ReadWriteOnce
        size: "10Gi"
        globalMounts:
          - path: /var/lib/tuwunel
