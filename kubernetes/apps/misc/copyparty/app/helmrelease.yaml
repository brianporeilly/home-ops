---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: copyparty
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: copyparty
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      copyparty:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/9001/copyparty-ac
              tag: 1.20.21
            env:
              LD_PRELOAD: /usr/lib/libmimalloc-secure.so.2
              PYTHONUNBUFFERED: 1
            probes: &probes
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /?reset=/._
                    port: &port 3923
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /?reset=/._
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - copyparty.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      # External twin - no Authentik SecurityPolicy in front, by design:
      # access is gated by copyparty's own [accounts]/[groups] ACLs
      # (resources/config.conf), same as any other copyparty client.
      external:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /
        hostnames:
          - files.oreillys.io
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "5Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: copyparty
        globalMounts:
          - path: /w
      config:
        enabled: true
        type: secret
        name: copyparty-secret
        globalMounts:
          - path: /cfg/config.conf
            subPath: config.conf
            readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          copyparty:
            app:
              - path: /tmp
