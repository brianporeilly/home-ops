---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &valkey manyfold-valkey
  namespace: &namespace misc
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *valkey
  interval: 1h
  path: ./kubernetes/apps/misc/manyfold/valkey
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app manyfold
  namespace: &namespace misc
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: manyfold-valkey
      namespace: *namespace
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: postgres-operator
      namespace: database
    - name: kopiur-repository
      namespace: kopiur-system
    # oidc-secret.yaml's Reflector mirror can lose a race against authentik's
    # own ExternalSecret and get stuck rejected - see download/lidarr/ks.yaml.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/misc/manyfold/app
  postBuild:
    substitute:
      APP: manyfold
      PVC: manyfold-models
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
