---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: manyfold-secret-key-base
spec:
  length: 64
  encoding: hex
  # 64 chars > the 52 unique letters left with digits/symbols off.
  allowRepeat: true
  digits: 0
  symbols: 0
  secretKeys: ["SECRET_KEY_BASE"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# refreshInterval 0s: generated once. Rotating SECRET_KEY_BASE logs everyone out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold-secret
spec:
  refreshInterval: "0s"
  target:
    name: manyfold-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: manyfold-secret-key-base
