---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_backendtrafficpolicies.yaml
# Hard 404 on the signup-blocked rule in helmrelease.yaml's route - same
# mechanism as authentik-admin-external-block. Accounts only come from OIDC.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: manyfold-signup-block
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: manyfold
      sectionName: signup-blocked
  faultInjection:
    abort:
      httpStatus: 404
      percentage: 100
