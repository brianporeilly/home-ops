---
# Reflector pull mirror of the canonical manyfold-oidc-credentials Secret ESO
# generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: manyfold-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/manyfold-oidc-credentials"
type: Opaque
