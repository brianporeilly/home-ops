---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app thelounge
  namespace: &namespace misc
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # thelounge's image runs as nobody (65534), only visible via its own USER
  # line - invisible to the component's inheritSecurityContextFrom.pvcConsumer,
  # so it needs an explicit override. Non-root, no privileged-movers opt-in
  # needed.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: thelounge
        spec:
          mover:
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/misc/thelounge/app
  postBuild:
    substitute:
      APP: thelounge
      PVC: thelounge-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
