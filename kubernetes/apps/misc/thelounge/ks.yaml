---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app thelounge
  namespace: &namespace misc
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # thelounge's image runs as nobody (65534), only visible via its own USER
  # line - invisible to the component's inheritSecurityContextFrom.pvcConsumer,
  # so it needs an explicit override. Running the mover as 65534 fixed
  # nothing on its own: its config dir is 0700, owned 65534:65534, so a
  # non-matching UID (including root without capabilities) can't read it,
  # and separately the NFS-backed repo (owned 1000:1000) only grants access
  # to an exact UID match or root's NFS no_root_squash bypass - a single
  # mover process can't satisfy both as a genuinely non-root, non-1000
  # identity. root + DAC_OVERRIDE is what actually works - see the
  # equivalent comment in download/qui/ks.yaml. misc namespace carries the
  # privileged-movers opt-in for this.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: thelounge
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - DAC_OVERRIDE
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/misc/thelounge/app
  postBuild:
    substitute:
      APP: thelounge
      PVC: thelounge-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
