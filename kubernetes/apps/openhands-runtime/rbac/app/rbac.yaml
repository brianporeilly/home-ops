---
# Grants the openhands app-template ServiceAccount (ai namespace,
# helmrelease.yaml's serviceAccount.openhands) permission to create the
# per-conversation Pod/Service/PVC/Ingress openhands's own
# KubernetesRuntime (RUNTIME=kubernetes) provisions directly via the k8s
# API - see docs/agent-sandbox-plan.md Phase 2. Scoped to this namespace
# only, cross-namespace RoleBinding subject (ai) -> Role (openhands-runtime)
# since the controller and its spawned sandboxes deliberately live in
# separate namespaces (RBAC/NetworkPolicy blast radius, same reasoning as
# agent-sandbox-system vs the apps that might use it).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhands-runtime
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openhands-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openhands-runtime
subjects:
  - kind: ServiceAccount
    name: openhands
    namespace: ai
