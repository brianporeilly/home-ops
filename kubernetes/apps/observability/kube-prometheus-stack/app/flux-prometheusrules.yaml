---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus-stack
spec:
  groups:
    - name: flux
      rules:
        # gotk_reconcile_condition was removed from Flux's own metrics.
        # Ready/Reconciling condition state now comes from kube-state-metrics
        # customResourceState instead (see kube-prometheus-stack's
        # helmrelease.yaml), covering Kustomization and HelmRelease. Source
        # staleness (GitRepository/OCIRepository/HelmRepository) isn't
        # instrumented that way yet, so there's no FluxSourceStale here.
        - alert: FluxResourceNotReady
          annotations:
            summary: "Flux resource {{ $labels.name }} is not ready"
            description: >-
              {{ $labels.name }} (kind: {{ $labels.kind }},
              namespace: {{ $labels.namespace }}) has been not ready for
              more than 15 minutes.
          expr: |
            label_replace(
              max by (name, namespace) (flux_kustomization_status_condition{type="Ready", status="False"}) == 1,
              "kind", "Kustomization", "", ""
            )
            or
            label_replace(
              max by (name, namespace) (flux_helmrelease_status_condition{type="Ready", status="False"}) == 1,
              "kind", "HelmRelease", "", ""
            )
          for: 15m
          labels:
            severity: critical

        - alert: FluxReconciliationFailure
          annotations:
            summary: "Flux resource {{ $labels.name }} reconciliation failing"
            description: >-
              {{ $labels.name }} (kind: {{ $labels.kind }},
              namespace: {{ $labels.namespace }}) has been failing
              reconciliation for more than 5 minutes.
          expr: |
            label_replace(
              max by (name, namespace) (flux_kustomization_status_condition{type="Ready", status="False"}) == 1,
              "kind", "Kustomization", "", ""
            )
            or
            label_replace(
              max by (name, namespace) (flux_helmrelease_status_condition{type="Ready", status="False"}) == 1,
              "kind", "HelmRelease", "", ""
            )
          for: 5m
          labels:
            severity: warning

        - alert: FluxStuckInProgress
          annotations:
            summary: "Flux resource {{ $labels.name }} stuck reconciling"
            description: >-
              {{ $labels.name }} (kind: {{ $labels.kind }},
              namespace: {{ $labels.namespace }}) has been reconciling
              without completing for more than 2 hours.
          expr: |
            label_replace(
              max by (name, namespace) (flux_kustomization_status_condition{type="Reconciling", status="True"}) == 1,
              "kind", "Kustomization", "", ""
            )
            or
            label_replace(
              max by (name, namespace) (flux_helmrelease_status_condition{type="Reconciling", status="True"}) == 1,
              "kind", "HelmRelease", "", ""
            )
          for: 2h
          labels:
            severity: warning
