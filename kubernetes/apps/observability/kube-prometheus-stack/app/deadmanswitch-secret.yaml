---
# Dead-man's switch heartbeat URL for the Alertmanager Watchdog route.
# The always-firing Watchdog alert is routed to a webhook that POSTs to this URL
# every repeatInterval (5m); if the pings stop (Prometheus/Alertmanager/cluster/
# internet down), the external service (e.g. healthchecks.io) alarms you via a
# channel that does NOT depend on this cluster.
#
# DUMMY VALUE below — replace `url` with your real ping URL, then encrypt in place:
#   sops --encrypt --in-place \
#     kubernetes/apps/observability/kube-prometheus-stack/app/deadmanswitch-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-deadmanswitch
stringData:
  url: "https://hc-ping.com/00000000-0000-0000-0000-000000000000"
