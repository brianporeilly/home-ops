---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - alertname
      - job
    groupInterval: 10m
    groupWait: 1m
    receiver: slack
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: "null"
        groupInterval: 5m
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: KuredRebootInProgress
            matchType: =
      - receiver: slack
        matchers:
          - name: severity
            value: critical
            matchType: =
  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # A node reboot (kured drain/reboot/uncordon) causes a predictable, self-healing
    # batch of Ceph/etcd/node alerts. Suppress those while kured has a node marked
    # in-progress (see kured configuration.annotateNodes + kured-alerts PrometheusRule).
    - sourceMatch:
        - name: alertname
          value: KuredRebootInProgress
          matchType: =
      targetMatch:
        - name: alertname
          value: (CephMonDown|CephMonDownQuorumAtRisk|CephOSDDown|CephOSDDownHigh|CephOSDHostDown|CephPGsUnclean|CephSlowOps|CephHealthWarning|etcdHighNumberOfLeaderChanges|etcdHighCommitDurations|NodeClockNotSynchronising|TargetDown|KubeAggregatedAPIDown|KubePodNotReady|KubeDeploymentReplicasMismatch)
          matchType: =~
    # CephHealthWarning is a summary alert that fires whenever any more specific
    # Ceph alert is active; avoid double-paging for the same underlying issue.
    - sourceMatch:
        - name: alertname
          value: (CephMonDown|CephMonDownQuorumAtRisk|CephOSDDown|CephOSDDownHigh|CephOSDHostDown|CephPGsUnclean|CephSlowOps)
          matchType: =~
      targetMatch:
        - name: alertname
          value: CephHealthWarning
          matchType: =
  receivers:
    - name: "null"
    - name: slack
      slackConfigs:
        - apiURL:
            name: &secret alertmanager-secrets
            key: slack_webhook_url