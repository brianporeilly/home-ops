---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus-stack
spec:
  groups:
    # CNPG Postgres — continuous WAL archiving to RGW (the PITR side). The
    # operator's built-in backup-catalog metric (last_available_backup_timestamp)
    # is NOT populated on the Barman Cloud *plugin* path (it stays 0), so backup
    # health is tracked here via the pg_stat_archiver signals instead.
    - name: cnpg-backups
      rules:
        - alert: CNPGWALArchiveFailing
          annotations:
            summary: "CNPG WAL archiving is failing ({{ $labels.pod }})"
            description: >-
              Postgres instance {{ $labels.pod }} in namespace
              {{ $labels.namespace }} has logged new failed WAL archive attempts
              in the last 30m. Continuous archiving to RGW is broken — PITR
              coverage is not advancing.
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[30m]) > 0
          for: 15m
          labels:
            severity: warning
        - alert: CNPGWALArchiveBacklog
          annotations:
            summary: "CNPG WAL archive backlog building ({{ $labels.pod }})"
            description: >-
              Postgres instance {{ $labels.pod }} in namespace
              {{ $labels.namespace }} has {{ $value }} WAL segments waiting to be
              archived. Archiving has stalled — the RGW target may be unreachable.
          expr: |
            cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 30m
          labels:
            severity: warning
        # Base-backup (not WAL) staleness. cnpg_backup_stopped_at comes from the
        # kube-state-metrics CustomResourceState on the Backup CR (see the KSM
        # config in helmrelease.yaml) because the plugin path leaves the built-in
        # backup metric at 0. Scheduled base backups run daily at 03:00, so >30h
        # since the last completed one means a run was missed. A cluster that has
        # never completed a base backup emits no series and can't fire this — the
        # WAL/ScheduledBackup signals cover that bootstrap window.
        - alert: CNPGBaseBackupStale
          annotations:
            summary: "CNPG base backup is stale ({{ $labels.cluster }})"
            description: >-
              Cluster {{ $labels.cluster }} in namespace {{ $labels.namespace }}
              last completed a base backup {{ $value | humanizeDuration }} ago
              (scheduled daily). PITR still depends on WAL archiving, but the
              base-backup floor is no longer advancing.
          expr: |
            time() - max by (namespace, cluster) (
              cnpg_backup_stopped_at{phase="completed"}
            ) > 60 * 60 * 30
          for: 30m
          labels:
            severity: warning

    # MariaDB — the operator runs scheduled backups as native CronJobs/Jobs, so
    # kube-state-metrics covers them directly (no CRD-state config needed).
    - name: mariadb-backups
      rules:
        - alert: MariaDBBackupJobFailed
          annotations:
            summary: "MariaDB backup job failed ({{ $labels.job_name }})"
            description: >-
              Backup job {{ $labels.job_name }} in namespace
              {{ $labels.namespace }} has failed.
          expr: |
            kube_job_failed{job_name=~".+-mariadb-backup-.+"} > 0
          for: 15m
          labels:
            severity: warning
        - alert: MariaDBBackupStale
          annotations:
            summary: "MariaDB backup has not succeeded recently ({{ $labels.cronjob }})"
            description: >-
              The {{ $labels.cronjob }} CronJob in namespace
              {{ $labels.namespace }} last succeeded
              {{ $value | humanizeDuration }} ago (schedule is nightly).
          expr: |
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_successful_time{cronjob=~".+-mariadb-backup"}
            ) > 60 * 60 * 26
          for: 15m
          labels:
            severity: warning

    # RGW → NAS sync (components/rgw-nas-sync) — the off-Ceph DR copy of every
    # CNPG/MariaDB/etcd/loki RGW bucket. Every instance shares the exact
    # CronJob name "rgw-nas-sync" (see the component), so one rule per alert
    # covers all namespaces via the namespace label from kube-state-metrics.
    - name: rgw-nas-sync
      rules:
        - alert: RGWNASSyncJobFailed
          annotations:
            summary: "RGW→NAS sync job failed ({{ $labels.namespace }})"
            description: >-
              The rgw-nas-sync CronJob in namespace {{ $labels.namespace }}
              has failed. That namespace's RGW bucket is not being mirrored
              to the NAS — its off-Ceph DR copy is falling behind.
          expr: |
            kube_job_failed{job_name=~"rgw-nas-sync-.+"} > 0
          for: 15m
          labels:
            severity: warning
        - alert: RGWNASSyncStale
          annotations:
            summary: "RGW→NAS sync has not succeeded recently ({{ $labels.namespace }})"
            description: >-
              The rgw-nas-sync CronJob in namespace {{ $labels.namespace }}
              last succeeded {{ $value | humanizeDuration }} ago (schedule is
              daily at 05:00).
          expr: |
            time() - max by (namespace, cronjob) (
              kube_cronjob_status_last_successful_time{cronjob="rgw-nas-sync"}
            ) > 60 * 60 * 30
          for: 15m
          labels:
            severity: warning
