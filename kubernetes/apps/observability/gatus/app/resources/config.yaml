---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

metrics: true

endpoints:
  - name: google
    group: third-party
    url: https://google.com
    interval: 5m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"

ui:
  title: Status | Gatus
  header: Status
  #logo: https://avatars.githubusercontent.com/u/20746663
  link: https://github.com/brianporeilly
  buttons:
    - name: Github
      link: https://github.com/brianporeilly

    - name: Homelab
      link: https://github.com/brianporeilly/home-ops

web:
  port: ${GATUS_WEB_PORT}