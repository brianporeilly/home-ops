---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-rbd-image-iostat-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Storage"
data:
  ceph-rbd-image-iostat.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
      "description": "Per-OSD apply/commit latency and per-RBD-image IOPS/latency, sourced from mgr/prometheus/rbd_stats_pools. Use this to find which PVCs are actually driving load on the slow HDD OSDs before deciding what to move to ceph-block-ssd.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Ranked by apply latency - the two known-bad WD Green HDDs (osd.0, osd.2) should stand out here. SSD OSDs run 2-4ms; a healthy HDD like osd.4 runs ~90ms.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "color-background"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "red", "value": 100 }
                ]
              },
              "unit": "ms"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "ceph_daemon" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "auto" } },
                  { "id": "thresholds", "value": null }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "hostname" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "auto" } },
                  { "id": "thresholds", "value": null }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "device_class" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "auto" } },
                  { "id": "thresholds", "value": null }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Apply Latency (ms)" }]
          },
          "pluginVersion": "12.1.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "ceph_osd_apply_latency_ms * on(ceph_daemon) group_left(hostname, device_class) ceph_osd_metadata",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "ceph_osd_commit_latency_ms * on(ceph_daemon) group_left(hostname, device_class) ceph_osd_metadata",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "OSD Apply/Commit Latency",
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "cluster": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true
                },
                "indexByName": {},
                "renameByName": {
                  "ceph_daemon": "OSD",
                  "hostname": "Host",
                  "device_class": "Class",
                  "Value #A": "Apply Latency (ms)",
                  "Value #B": "Commit Latency (ms)"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Every bound RBD-backed PVC, ranked by combined read+write IOPS over the selected range. RBD Image is the underlying Ceph object (csi-vol-<uuid>) - App (PVC name) and Namespace are a two-hop join: csi_volume_handle -> the PV's own generated name (kube_persistentvolume_info) -> the real PVC name + namespace (kube_persistentvolumeclaim_info.volumename). PVs are cluster-scoped, so Namespace deliberately comes only from the PVC-side query, not kube_persistentvolume_info (whose own \"namespace\" label is just Prometheus scrape-target metadata for kube-state-metrics, not the PVC's namespace). In this repo the PVC name is the app name/suffix (see CLAUDE.md conventions), so App (PVC name) is usually enough to identify the app directly.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Total IOPS" },
                "properties": [{ "id": "unit", "value": "iops" }]
              },
              {
                "matcher": { "id": "byName", "options": "Write IOPS" },
                "properties": [{ "id": "unit", "value": "iops" }]
              },
              {
                "matcher": { "id": "byName", "options": "Read IOPS" },
                "properties": [{ "id": "unit", "value": "iops" }]
              },
              {
                "matcher": { "id": "byName", "options": "Avg Write Latency (ms)" },
                "properties": [
                  { "id": "unit", "value": "ms" },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "orange", "value": 20 },
                        { "color": "red", "value": 100 }
                      ]
                    }
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } }
                ]
              }
            ]
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Total IOPS" }]
          },
          "pluginVersion": "12.1.0",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (pool, image) (rate(ceph_rbd_write_ops[$__rate_interval]) + rate(ceph_rbd_read_ops[$__rate_interval]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (image) (rate(ceph_rbd_write_ops[$__rate_interval]))",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (image) (rate(ceph_rbd_read_ops[$__rate_interval]))",
              "format": "table",
              "instant": true,
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (image) (rate(ceph_rbd_write_latency_sum[$__rate_interval])) / sum by (image) (rate(ceph_rbd_write_latency_count[$__rate_interval])) / 1e6",
              "format": "table",
              "instant": true,
              "refId": "D"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "description": "PVs are cluster-scoped, so kube_persistentvolume_info has no real namespace of its own - only project image + the join key here, and take the real (correctly-scoped) namespace from kube_persistentvolumeclaim_info in query F instead.",
              "expr": "sum by (image, persistentvolume) (label_replace(kube_persistentvolume_info{csi_driver=\"rook-ceph.rbd.csi.ceph.com\"}, \"image\", \"csi-vol-$1\", \"csi_volume_handle\", \".*-([0-9a-f-]{36})$\"))",
              "format": "table",
              "instant": true,
              "refId": "E"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "description": "kube_persistentvolume_info only carries the PV's own generated name (pvc-<uuid>), not the human PVC name - relabel kube_persistentvolumeclaim_info's volumename to the same field name so it can be joined a second time to pull in the real PVC name and its (correctly-scoped) namespace.",
              "expr": "sum by (persistentvolume, persistentvolumeclaim, namespace) (label_replace(kube_persistentvolumeclaim_info, \"persistentvolume\", \"$1\", \"volumename\", \"(.*)\"))",
              "format": "table",
              "instant": true,
              "refId": "F"
            }
          ],
          "title": "Top RBD Images by IOPS",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "image",
                "mode": "outer"
              }
            },
            {
              "id": "joinByField",
              "options": {
                "byField": "persistentvolume",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true,
                  "__name__": true,
                  "persistentvolume": true,
                  "Value #E": true,
                  "Value #F": true
                },
                "indexByName": {},
                "renameByName": {
                  "namespace": "Namespace",
                  "persistentvolumeclaim": "App (PVC name)",
                  "pool": "Pool",
                  "image": "RBD Image",
                  "Value #A": "Total IOPS",
                  "Value #B": "Write IOPS",
                  "Value #C": "Read IOPS",
                  "Value #D": "Avg Write Latency (ms)"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "iops"
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 18 },
          "id": 3,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (pool, image) (rate(ceph_rbd_write_ops[$__rate_interval]) + rate(ceph_rbd_read_ops[$__rate_interval]))",
              "legendFormat": "{{pool}} / {{image}}",
              "refId": "A"
            }
          ],
          "title": "RBD IOPS by Image",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 20 },
                  { "color": "red", "value": 100 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 18 },
          "id": 4,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum by (pool, image) (rate(ceph_rbd_write_latency_sum[$__rate_interval])) / sum by (pool, image) (rate(ceph_rbd_write_latency_count[$__rate_interval])) / 1e6",
              "legendFormat": "{{pool}} / {{image}}",
              "refId": "A"
            }
          ],
          "title": "RBD Avg Write Latency by Image",
          "type": "timeseries"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 40,
      "tags": ["ceph", "storage"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Ceph RBD Image IOStat",
      "uid": "ceph-rbd-image-iostat",
      "version": 1,
      "weekStart": ""
    }
