---
# Reflector pull mirror of the canonical grafana-oidc-credentials Secret
# ESO generates in the authentik namespace - see
# components/authentik/protect/oidc-client-secret.yaml for the same
# pattern used by SecurityPolicy-wrapped apps. Nothing to sops-encrypt
# here; Reflector populates client-id/client-secret automatically.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/grafana-oidc-credentials"
type: Opaque
