---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-event-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubernetes-event-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kubernetes-event-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/resmoio/kubernetes-event-exporter
              tag: v1.7@sha256:8abb52b66557d3333f9e473e0eff2951309abfd018bd8d7fcfd86c4ecce6b9cf
            args:
              - -conf=/data/config.yaml
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: kubernetes-event-exporter
        ports:
          metrics:
            port: 2112

    serviceMonitor:
      app:
        serviceName: kubernetes-event-exporter
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s

    persistence:
      config:
        type: configMap
        name: kubernetes-event-exporter-config
        globalMounts:
          - path: /data
            readOnly: true
