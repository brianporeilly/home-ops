---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          expr: |-
            smartctl_device_temperature{temperature_type="current"} > 65
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) has a temperature higher than 65°C
          labels:
            severity: critical

        - alert: SmartDeviceTestFailed
          # `or smartctl_device_status != 1` used to be here - dropped, it
          # referenced a metric that doesn't exist in this exporter version
          # (confirmed live against Prometheus: zero series for
          # smartctl_device_status, cluster-wide). Pure dead weight, never
          # contributed to this ever firing.
          #
          # for: widened 5m -> 15m: nas-ultan's WD60EFAX (SMR) drives
          # occasionally return a checksum/data-structure read error on an
          # otherwise-healthy poll (smartctl exit status 4 - background SMR
          # band housekeeping colliding with the probe, not real
          # degradation; confirmed live across multiple EFAX drives failing
          # in the same poll cycle, self-healing within minutes). SMART
          # status doesn't change fast enough for a tight window to matter -
          # a genuine failure (e.g. wk-roche's still-open sda issue) stays
          # failed for hours/days, easily clearing 15m; a transient SMR blip
          # usually doesn't.
          expr: |-
            smartctl_device_smart_status != 1
          for: 15m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) did not pass its SMART test
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          expr: |-
            smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) is in a critical state
          labels:
            severity: critical
        - alert: SmartDeviceMediaErrors
          expr: |-
            smartctl_device_media_errors != 0
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) has media errors
          labels:
            severity: critical
        - alert: SmartDeviceAvailableSpareUnderThreadhold
          expr: |-
            smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) is under available spare threashold
          labels:
            severity: critical
        - alert: SmartDeviceInterfaceSlow
          expr: |-
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          annotations:
            summary: >-
              Drive {{ $labels.device }} on {{ $labels.node }} ({{ $labels.instance }}) interface is slower then it should be
          for: 5m
          labels:
            severity: critical