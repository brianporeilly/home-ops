---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    serviceMonitor:
      enabled: true
      # Pod-role service discovery already exposes the node name as scrape-time
      # metadata; relabel it onto a real `node` label so alerts/dashboards read
      # a hostname instead of forcing a pod-IP -> node lookup (instance is a
      # pod IP here, not the host - smartctl-exporter runs one pod per node).
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
    prometheusRules:
      enabled: false