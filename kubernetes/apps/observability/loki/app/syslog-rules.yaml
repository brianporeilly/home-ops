---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-syslog-rules
  labels:
    loki_rule: "1"
data:
  syslog-rules.yaml: |
    groups:
      - name: syslog.rules
        rules:
          - alert: SyslogDeviceSilent
            expr: |
              absent_over_time({job="syslog", device="opnsense"}[30m])
            for: 5m
            labels:
              severity: warning
              device: opnsense
            annotations:
              summary: >-
                No syslog messages received from OPNsense in the last 30 minutes

          - alert: SyslogDeviceSilent
            expr: |
              absent_over_time({job="syslog", device="mikrotik"}[6h])
            for: 10m
            labels:
              severity: warning
              device: mikrotik
            annotations:
              summary: >-
                No syslog messages received from the MikroTik switch in the last 6 hours.
                RouterOS only logs on state changes, so quiet periods are normal -
                this window is wide on purpose.

          - alert: SyslogErrorRateHigh
            expr: |
              count_over_time({job="syslog", device="opnsense"} |~ `(?i)error|critical|failed` [15m]) > 20
            for: 5m
            labels:
              severity: warning
              device: opnsense
            annotations:
              summary: >-
                High rate of error/critical/failed messages from OPNsense syslog ({{ $value | printf "%.0f" }} in 15m).
                Threshold is a starting guess - tune once normal baseline is known.

          - alert: SyslogErrorRateHigh
            expr: |
              count_over_time({job="syslog", device="mikrotik"} |~ `(?i)error|critical|failed` [15m]) > 20
            for: 5m
            labels:
              severity: warning
              device: mikrotik
            annotations:
              summary: >-
                High rate of error/critical/failed messages from MikroTik syslog ({{ $value | printf "%.0f" }} in 15m).
                Threshold is a starting guess - tune once normal baseline is known.
