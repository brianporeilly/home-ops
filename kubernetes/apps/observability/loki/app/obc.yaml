---
# Bucket + S3 credentials for Loki chunk/index storage (Ceph RGW). Provisions
# bucket `loki` and a Secret/ConfigMap named `loki-bucket` (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY), consumed by the HelmRelease via extraEnvFrom + env
# expansion. NOTE: RGW shares fate with Ceph — this is durable chunk storage +
# retention, not off-Ceph DR. See docs/backup-dr-plan.md §4.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: loki-bucket
spec:
  bucketName: loki
  storageClassName: ceph-bucket
