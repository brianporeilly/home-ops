---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-nas-journal-rules
  labels:
    loki_rule: "1"
data:
  nas-journal-rules.yaml: |
    # job=journal/node=nas-ultan match Alloy's config.alloy on the NAS
    # itself (flatcar-ignition repo, 03-nas-node.yaml) - job used to be the
    # NAS-specific "nas-ultan-journal" until that config stopped hardcoding
    # its own identity (so the same ignition can be reused on another box
    # without silently mislabeling its logs as nas-ultan). node is now
    # derived live from journald's own _HOSTNAME field, not static config -
    # if these two ever drift, check that file first.
    groups:
      - name: nas-journal.rules
        rules:
          - alert: NASJournalSilent
            expr: |
              absent_over_time({job="journal", node="nas-ultan"}[30m])
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: >-
                No journal entries received from nas-ultan in the last 30
                minutes - Alloy may be down, or the node may be unreachable.

          - alert: NASJournalErrorRateHigh
            expr: |
              count_over_time({job="journal", node="nas-ultan"} |~ `(?i)error|critical|failed|panic` [15m]) > 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: >-
                High rate of error/critical/failed/panic messages from
                nas-ultan's journal ({{ $value | printf "%.0f" }} in 15m).
                Threshold is a starting guess (same as the OPNsense/Mikrotik
                syslog rules) - tune once a normal baseline is known. This
                is exactly the kind of thing that would have caught the
                smartctl-exporter permission-denied loop automatically
                instead of needing to notice it by eye in Grafana.
