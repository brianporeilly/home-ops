---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: loki
  install:
    crds: Skip
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      retries: 3
  values:
    serviceAccount:
        automountServiceAccountToken: true
    deploymentMode: SingleBinary
    extraVolumes:
      - name: tmp-dir
        emptyDir: {}
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor/retention
        # Must match the object store (s3): with the filesystem object store gone,
        # delete_request_store:filesystem has no directory and fails to persist its
        # boltdb ("mkdir index: read-only file system"). Keep delete requests in RGW.
        delete_request_store: s3
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      limits_config:
        retention_period: 14d
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        max_query_series: 5000
      server:
        grpc_server_max_recv_msg_size: 10485760 # 10 MiB
        grpc_server_max_send_msg_size: 10485760 # 10 MiB
        log_level: info
      # Chunks + shipped tsdb index live in the Ceph RGW `loki` bucket (S3).
      # Clean break from the old filesystem store — pre-switch chunks on the PVC
      # are no longer queryable, but 14d retention ages them out. Credentials come
      # from the loki-bucket OBC Secret via env expansion (see singleBinary below).
      # RGW shares fate with Ceph; this is durable chunk storage + retention, not
      # off-Ceph DR. See docs/backup-dr-plan.md §4.
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
          region: us-east-1
          accessKeyId: ${AWS_ACCESS_KEY_ID}
          secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: true # plain-HTTP in-cluster RGW endpoint
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      structuredConfig:
        ruler:
          enable_api: true
          enable_alertmanager_v2: true
          alertmanager_url: http://alertmanager-operated.observability.svc.cluster.local:9093
          storage:
            type: local
            local:
              directory: /rules
          rule_path: /rules/fake
    monitoring:
      # Scrape Loki's own metrics (loki_s3_*, ingester, compactor, etc.) into
      # Prometheus. metricsInstance is the deprecated Grafana-Agent CR path and
      # must be disabled or it templates a MetricsInstance CRD we don't have.
      serviceMonitor:
        enabled: true
        metricsInstance:
          enabled: false
      # Loki mixin Grafana dashboards. The sidecar discovers the ConfigMap by
      # its grafana_dashboard label; the dashboards use a templated `datasource`
      # var (resolves to the default Prometheus DS) and a `logs` var (our Loki
      # DS) — no ${DS_PROMETHEUS}/__inputs, so they load clean. They filter by
      # cluster/namespace; we have no cluster label so that dropdown is empty,
      # but cluster=~"$cluster" degrades to =~"" which matches our series.
      dashboards:
        enabled: true
      # Recording rules (18, grouped by job/route/namespace — all labels we have)
      # + alerting rules. Prometheus selects them via ruleSelectorNilUsesHelmValues=false.
      rules:
        enabled: true
        # Loki canary is disabled (lokiCanary.enabled: false), so loki_canary_*
        # never exists and this alert is permanently no-data — turn it off.
        configs:
          LokiCanaryLatency:
            enabled: false
    singleBinary:
      replicas: 1
      # -config.expand-env lets the S3 storage config above read the RGW
      # credentials from the loki-bucket OBC Secret as ${AWS_*} env vars.
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-bucket
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 50Gi
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    sidecar:
      image:
        repository: ghcr.io/home-operations/k8s-sidecar
        tag: 2.10.0@sha256:909f2ac4e9395eea21659c40d151a11bc163b88979357fb8ac40924c5c18376c
      enableUniqueFilenames: true
      rules:
        searchNamespace: ALL
        folder: /rules/fake
      volumeMounts:
        - name: tmp-dir
          mountPath: /tmp