---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  maxHistory: 2
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    config:
      service: |-
        [SERVICE]
          daemon off
          flush {{ .Values.flush }}
          log_level {{ .Values.logLevel }}
          parsers_file /fluent-bit/etc/parsers.conf
          parsers_file /fluent-bit/etc/conf/custom_parsers.conf
          http_server on
          http_listen 0.0.0.0
          http_port {{ .Values.metricsPort }}
          health_check on
          storage.path /var/log/flb-storage/
          storage.sync normal
          storage.checksum off
          storage.backlog.mem_limit 5M

      inputs: |-
        [INPUT]
          name tail
          alias kubernetes
          path /var/log/containers/*.log
          parser containerd
          tag kubernetes.*
          skip_empty_lines on
          skip_long_lines on
          storage.type filesystem

        [INPUT]
          name syslog
          alias syslog_opnsense
          mode udp
          listen 0.0.0.0
          port 5514
          parser syslog-rfc3164
          tag syslog.opnsense
          storage.type filesystem

        [INPUT]
          name syslog
          alias syslog_mikrotik
          mode udp
          listen 0.0.0.0
          port 5515
          parser syslog-rfc3164
          tag syslog.mikrotik
          storage.type filesystem

      filters: |-
        [FILTER]
          name kubernetes
          match kubernetes.*
          kube_url https://kubernetes.default.svc:443
          kube_ca_file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kube_token_file /var/run/secrets/kubernetes.io/serviceaccount/token
          kube_tag_prefix kubernetes.var.log.containers.
          merge_log on
          merge_log_key log_processed
          merge_log_trim on
          k8s-logging.parser on
          k8s-logging.exclude off
          labels on
          annotations off

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under kubernetes
          add_prefix k_

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under k_labels
          add_prefix k_labels_

        # The kubernetes filter above (merge_log on) already parses a
        # container's stdout line as JSON when it validly is one (e.g.
        # Envoy's JSON access logs) into a nested log_processed object -
        # correct, but still nested, so Loki still needs a `| json` unwrap
        # to reach e.g. log_processed.path. Same lift technique as
        # kubernetes/k_labels above, so JSON-emitting apps' own fields land
        # as flat top-level msg_* keys instead. No-ops harmlessly for every
        # pod that just logs plain text (log_processed never gets created
        # for those).
        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under log_processed
          add_prefix msg_

        [FILTER]
          name modify
          match kubernetes.*
          rename k_labels_app.kubernetes.io/name app
          rename k_labels_app app
          rename k_labels_k8s-app app

      outputs: |-
        [OUTPUT]
          name loki
          match kubernetes.*
          host loki-headless.observability.svc.cluster.local
          port 3100
          uri /loki/api/v1/push
          line_format json
          labels job=fluent-bit, namespace=$k_namespace_name, app=$app
          structured_metadata container=$k_container_name, pod=$k_pod_name, host=$k_host
          compress gzip
          storage.total_limit_size 2G

        [OUTPUT]
          name loki
          match syslog.opnsense
          host loki-headless.observability.svc.cluster.local
          port 3100
          uri /loki/api/v1/push
          line_format json
          labels job=syslog, device=opnsense
          compress gzip
          storage.total_limit_size 512M

        [OUTPUT]
          name loki
          match syslog.mikrotik
          host loki-headless.observability.svc.cluster.local
          port 3100
          uri /loki/api/v1/push
          line_format json
          labels job=syslog, device=mikrotik
          compress gzip
          storage.total_limit_size 512M
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
    extraVolumes:
      - name: flb-storage
        hostPath:
          path: /var/log/flb-storage
          type: DirectoryOrCreate
    extraVolumeMounts:
      - name: flb-storage
        mountPath: /var/log/flb-storage
    service:
      type: LoadBalancer
      annotations:
        # Was 10.20.250.4 - migrating to the routed 10.21.0.0/16 pool (see
        # kube-vip-cloud-provider HelmRelease). HIGH external-dependency
        # risk: this is a syslog RECEIVER - OPNsense and the Mikrotik are
        # both configured to actively push syslog to this exact IP
        # (extraPorts syslog-opnsense/syslog-mikrotik below). Repoint both
        # senders to 10.21.0.4 BEFORE merging, or logs silently stop.
        kube-vip.io/loadbalancerIPs: "10.21.0.4"
    extraPorts:
      - port: 5514
        containerPort: 5514
        protocol: UDP
        name: syslog-opnsense
      - port: 5515
        containerPort: 5515
        protocol: UDP
        name: syslog-mikrotik