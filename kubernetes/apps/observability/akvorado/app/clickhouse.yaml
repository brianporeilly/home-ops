---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: akvorado-clickhouse
spec:
  configuration:
    clusters:
      - name: akvorado
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      akvorado/password:
        valueFrom:
          secretKeyRef:
            name: akvorado-creds
            key: CLICKHOUSE_PASSWORD
      akvorado/networks/ip: "::/0"
      akvorado/profile: default
  templates:
    podTemplates:
      - name: akvorado-clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.9@sha256:ee7d6729a29a884dd011d980d766c4382a060093c01f408d2ac8277260e80aea
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
    volumeClaimTemplates:
      - name: akvorado-clickhouse-storage
        spec:
          # ceph-block-ssd: this was the busiest thing on ceph-block (48 IOPS,
          # ~435ms write latency). Live PVC already migrated 2026-09-25 via a
          # VolumeSnapshot restore (see docs/ceph-ssd-storage-migration-plan.md)
          # - this just keeps a from-scratch rebuild consistent with reality.
          storageClassName: ceph-block-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
  defaults:
    templates:
      podTemplate: akvorado-clickhouse
      dataVolumeClaimTemplate: akvorado-clickhouse-storage
