---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: akvorado-clickhouse
spec:
  configuration:
    clusters:
      - name: akvorado
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      akvorado/password:
        valueFrom:
          secretKeyRef:
            name: akvorado-creds
            key: CLICKHOUSE_PASSWORD
      akvorado/networks/ip: "::/0"
      akvorado/profile: default
  templates:
    podTemplates:
      - name: akvorado-clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.8@sha256:bc33a0f45c561bb17041fe3c2ee7710ccf5c7f15a5dba377bbf0bc6857ec60d2
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
    volumeClaimTemplates:
      - name: akvorado-clickhouse-storage
        spec:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
  defaults:
    templates:
      podTemplate: akvorado-clickhouse
      dataVolumeClaimTemplate: akvorado-clickhouse-storage
