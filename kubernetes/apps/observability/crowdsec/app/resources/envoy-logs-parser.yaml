# Custom s01-parse stage parser - no official CrowdSec hub parser exists for
# Envoy Gateway's JSON access log format, so this maps our fields into the
# meta/parsed fields crowdsecurity/http-logs (s02-enrich, installed via the
# PARSERS env var) and crowdsecurity/http-probing (scenario) expect.
#
# Loki stores these as fluent-bit-wrapped Kubernetes log lines: {"log":
# "<ts> stdout F <the real envoy JSON>", ...}. Field references must target
# the INNER envoy JSON, not the outer wrapper - split .log on the fixed
# "stdout F " marker (SplitN(..., ' ', 4)[3]) and UnmarshalJSON that into a
# second key. A field pointed at the wrong object silently evaluates to nil
# (CrowdSec doesn't error on a nil expression, it just skips the field).
#
# UnmarshalJSON works by side effect (mutates the map passed as its 2nd
# arg, always returns nil) - it must be called inside a boolean filter
# context (`in ['', nil]`), never assigned via a `target:`/`expression:`
# static, or it overwrites the whole map with nil.
#
# Keep this as one flat node (filter + statics), not split across sibling
# `nodes:` entries: this file's `onsuccess: next_stage` also governs
# sibling-node iteration (CrowdSec pkg/parser/node.go processLeaves) - it
# stops at the first child that succeeds, so a trivial always-succeeds
# sibling would short-circuit any nodes after it.
filter: |
  (evt.Line.Labels.type == 'envoy' || evt.Parsed.program == 'envoy') &&
  UnmarshalJSON(evt.Line.Raw, evt.Unmarshaled, 'wrapper') in ['', nil] &&
  UnmarshalJSON(SplitN(evt.Unmarshaled.wrapper.log, ' ', 4)[3], evt.Unmarshaled, 'envoy') in ['', nil]
onsuccess: next_stage
name: custom/envoy-logs
description: "Parse Envoy Gateway JSON access logs (envoy-external, via Loki)"
statics:
  - meta: log_type
    value: http_access-log
  - meta: service
    value: http
  - meta: source_ip
    expression: "evt.Unmarshaled.envoy.client_ip"
  - parsed: source_ip
    expression: "evt.Unmarshaled.envoy.client_ip"
  - meta: http_status
    expression: "string(evt.Unmarshaled.envoy.response_code)"
  - meta: http_path
    expression: "evt.Unmarshaled.envoy.path"
  - parsed: http_path
    expression: "evt.Unmarshaled.envoy.path"
  # request: what crowdsecurity/http-logs (s02-enrich) actually grok-splits
  # into query args + file extension to classify static_ressource - must be
  # `parsed`, not `meta`, since grok's apply_on targets Parsed fields.
  - parsed: request
    expression: "evt.Unmarshaled.envoy.path"
  - meta: http_verb
    expression: "evt.Unmarshaled.envoy.method"
  - parsed: verb
    expression: "evt.Unmarshaled.envoy.method"
  # target_fqdn: http-probing's groupby references evt.Parsed.target_fqdn,
  # but crowdsecurity's own reference parsers only ever set it as `meta` -
  # setting both here rather than trusting an unconfirmed cross-stage
  # promotion between the two.
  - meta: target_fqdn
    expression: "evt.Unmarshaled.envoy.authority"
  - parsed: target_fqdn
    expression: "evt.Unmarshaled.envoy.authority"
  - meta: http_user_agent
    expression: "evt.Unmarshaled.envoy.user_agent"
  - parsed: http_user_agent
    expression: "evt.Unmarshaled.envoy.user_agent"
  - target: evt.StrTime
    expression: "evt.Unmarshaled.envoy.start_time"
