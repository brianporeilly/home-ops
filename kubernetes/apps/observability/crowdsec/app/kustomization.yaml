---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./secret.yaml
configMapGenerator:
  - name: crowdsec-configmap
    files:
      - acquis.yaml=./resources/acquis.yaml
      - envoy-logs-parser.yaml=./resources/envoy-logs-parser.yaml
generatorOptions:
  disableNameSuffixHash: true
