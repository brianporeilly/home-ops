---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Polls whisker-backend's flow API directly (in-cluster Service, not the
# SSO-wrapped HTTPRoute - a CronJob can't do interactive OIDC login; see
# kubernetes/apps/kube-system/calico/route/networkpolicy.yaml for the
# ingress rule) and ships two log streams to Loki, feeding
# kubernetes/apps/observability/grafana/app/calico-deny-dashboard.yaml:
#   - job=calico-deny-log: flows whose enforced action is Deny.
#   - job=calico-pending-diff-log: flows where the enforced and resolved
#     pending action disagree (would flip Allow<->Deny if staged policy were
#     promoted now). This table does NOT go empty once nothing's staged -
#     Goldmane's "pending" re-evaluation can diverge from Felix's enforced
#     dataplane state with zero Staged{Global,}NetworkPolicy objects, from
#     either a fresh pod's cache-sync race (self-corrects in seconds - see
#     DIFF_MIN_AGE_SECONDS below) or a genuine per-node dataplane-programming
#     lag after a policy change (fix: rolling-restart
#     daemonset/calico-node -n calico-system if this table stays non-empty
#     with no staged policy and no fresh pods).
#
# 3-minute lookback window on a 1-minute schedule (deliberate overlap) -
# covers Goldmane's own aggregation lag and any single missed/slow run
# without a gap. Duplicate pushes are harmless: each push uses the flow's
# own end_time as the log line's timestamp, so an identical (timestamp,
# line) pair lands as an exact duplicate, which Loki no-ops rather than
# double-counts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calico-deny-log-shipper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: calico-deny-log-shipper
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      calico-deny-log-shipper:
        type: cronjob
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 2
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: python
              tag: 3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
            command:
              - python3
              - -c
              - |
                import json, urllib.request, datetime

                WHISKER_URL = "http://whisker.calico-system.svc.cluster.local:8081/whisker-backend/flows?page_size=3000"
                LOKI_URL = "http://loki-headless.observability.svc.cluster.local:3100/loki/api/v1/push"
                WINDOW_SECONDS = 180
                # Only ships a pending-diff when the resolved decision
                # involves a Staged{Global,}NetworkPolicy (see resolve()) -
                # Goldmane's "pending" re-evaluation stops at the first
                # selector:all() policy in a tier rather than walking the
                # rest like Felix's real enforcement does, a standing
                # false-positive source now that several selector:all()
                # policies live in the default tier permanently. Doesn't
                # catch a Felix/dataplane-lag bug - that needs a direct
                # whisker-backend flow trace, not this table.

                def resolve(policy_list):
                    # Last entry is the resolved decision - either a policy's own
                    # explicit Allow/Deny, or EndOfTier (action always Deny). For
                    # EndOfTier, the specific staged/real policy that was being
                    # evaluated when the tier ran out lives in trigger.name.
                    if not policy_list:
                        return None, None, False
                    last = policy_list[-1]
                    action = last.get("action")
                    if last.get("kind") == "EndOfTier":
                        trigger = last.get("trigger") or {}
                        name = trigger.get("name") or "(no staged policy - end of tier)"
                    else:
                        name = last.get("name")
                    involves_staged = any((p.get("kind") or "").startswith("Staged") for p in policy_list)
                    return action, name, involves_staged

                with urllib.request.urlopen(WHISKER_URL, timeout=30) as r:
                    data = json.load(r)
                items = data.get("items", [])
                now = datetime.datetime.now(datetime.timezone.utc)
                cutoff = now - datetime.timedelta(seconds=WINDOW_SECONDS)

                deny_values = []
                diff_values = []
                for f in items:
                    end_time = f.get("end_time")
                    if not end_time:
                        continue
                    ts = datetime.datetime.fromisoformat(end_time.replace("Z", "+00:00"))
                    if ts < cutoff:
                        continue
                    ts_ns = str(int(ts.timestamp() * 1_000_000_000))
                    base = {
                        "source_namespace": f.get("source_namespace") or f.get("source_name"),
                        "source_name": f.get("source_name"),
                        "dest_namespace": f.get("dest_namespace") or f.get("dest_name"),
                        "dest_name": f.get("dest_name"),
                        "protocol": f.get("protocol"),
                        "dest_port": f.get("dest_port"),
                        "reporter": f.get("reporter"),
                    }

                    policies = f.get("policies") or {}
                    enforced_action, enforced_name, _ = resolve(policies.get("enforced"))
                    pending_action, pending_name, pending_involves_staged = resolve(policies.get("pending"))

                    if f.get("action") == "Deny":
                        deny_values.append((ts_ns, json.dumps(base, sort_keys=True)))

                    if (
                        pending_action
                        and enforced_action
                        and pending_action != enforced_action
                        and pending_involves_staged
                    ):
                        diff = dict(base)
                        diff["enforced_action"] = enforced_action
                        diff["enforced_policy"] = enforced_name
                        diff["pending_action"] = pending_action
                        diff["pending_policy"] = pending_name
                        diff_values.append((ts_ns, json.dumps(diff, sort_keys=True)))

                streams = []
                if deny_values:
                    deny_values.sort()
                    streams.append({"stream": {"job": "calico-deny-log"}, "values": [list(v) for v in deny_values]})
                if diff_values:
                    diff_values.sort()
                    streams.append({"stream": {"job": "calico-pending-diff-log"}, "values": [list(v) for v in diff_values]})

                if not streams:
                    print("nothing to ship this run")
                else:
                    payload = {"streams": streams}
                    req = urllib.request.Request(
                        LOKI_URL,
                        data=json.dumps(payload).encode(),
                        headers={"Content-Type": "application/json"},
                        method="POST",
                    )
                    with urllib.request.urlopen(req, timeout=30) as r:
                        print(f"pushed {len(deny_values)} deny, {len(diff_values)} pending-diff flows, status {r.status}")
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
