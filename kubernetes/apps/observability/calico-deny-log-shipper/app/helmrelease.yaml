---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Polls whisker-backend's flow API directly (in-cluster Service, not the
# SSO-wrapped HTTPRoute - a CronJob can't do an interactive OIDC login;
# see kubernetes/apps/kube-system/calico/route/networkpolicy.yaml for the
# ingress rule this needs) and ships two things to Loki as structured JSON
# log lines, feeding the two tables in
# kubernetes/apps/observability/grafana/app/calico-deny-dashboard.yaml:
#   - job=calico-deny-log: flows whose real, currently-enforced action is
#     Deny.
#   - job=calico-pending-diff-log: flows where the enforced action and the
#     resolved pending action disagree - originally meant as "if every
#     currently-staged policy were promoted right now, this specific
#     source->dest pair would flip from Allow to Deny (or vice versa)", the
#     automated version of the pending_actions review done by hand
#     throughout docs/network-policy-plan.md. Correction (2026-08-23): this
#     table does NOT go empty once nothing's staged - Goldmane's own
#     "pending" re-evaluation can still diverge from Felix's "enforced"
#     dataplane state with zero StagedGlobalNetworkPolicy/StagedNetworkPolicy
#     objects anywhere, mainly from a freshly-spawned pod's first packet
#     hitting a brief cache-sync race (self-corrects within seconds - see
#     DIFF_MIN_AGE_SECONDS below, which filters exactly that) or from a
#     genuine per-node dataplane-programming lag after a real policy change
#     (the 2026-08-23 DNS outage's root cause, docs/incidents/2026-08-23-dns-outage.md -
#     a rolling `kubectl rollout restart daemonset/calico-node -n calico-system`
#     is the fix if this table stays non-empty for something that isn't a
#     fresh pod and isn't an intentional staged policy).
#
# 3-minute lookback window on a 1-minute schedule (deliberate overlap, not
# a bug) - covers Goldmane's own aggregation lag and any single missed/slow
# run without a gap. Overlap means the same flow can get pushed to Loki
# more than once, but each push uses the flow's own end_time as the log
# line's timestamp (not "now"), so an identical (timestamp, line) pair
# lands as an exact duplicate, which Loki accepts as a no-op rather than
# double-counting.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calico-deny-log-shipper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: calico-deny-log-shipper
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      calico-deny-log-shipper:
        type: cronjob
        cronjob:
          schedule: "* * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 2
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: python
              tag: 3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
            command:
              - python3
              - -c
              - |
                import json, urllib.request, datetime

                WHISKER_URL = "http://whisker.calico-system.svc.cluster.local:8081/whisker-backend/flows?page_size=3000"
                LOKI_URL = "http://loki-headless.observability.svc.cluster.local:3100/loki/api/v1/push"
                WINDOW_SECONDS = 180
                # Correction (2026-08-23), replacing two earlier, wrong
                # theories about this noise - keeping the history since the
                # real mechanism was only found by ruling both out:
                #   1. First guess: a freshly-spawned pod's first packet hits
                #      a brief cache-sync race that self-corrects within
                #      seconds - wrong. Live-tracked specific flows
                #      (calico-deny-log-shipper -> loki, immich-oidc-sync ->
                #      immich-server) for 5+ minutes; they persisted 78-320s+,
                #      some outliving the whole tracking window. Not brief,
                #      not self-correcting.
                #   2. Second guess: stale Goldmane state needing a restart,
                #      same class of fix as the calico-node DaemonSet restart
                #      that fixed a real Felix dataplane-sync bug earlier the
                #      same day - also wrong. Restarting the goldmane
                #      Deployment made the noise vanish for one poll, then it
                #      came right back, identical, including for flows older
                #      than the restart itself.
                # Real mechanism, confirmed via a direct flow trace: Felix's
                # real enforcement (`enforced`) correctly walks the full
                # default-tier policy chain and lands on
                # allow-observability-ingress - Allow. Goldmane's own
                # "pending" re-evaluation checks only the *first*
                # selector:all() policy in the tier (allow-apiserver-webhooks),
                # doesn't match, and returns EndOfTier immediately instead of
                # continuing to the next all()-selector policy the way Felix
                # does. This is a real limitation in Goldmane's own
                # multi-policy-tier walk, not a caching issue - and since this
                # cluster now permanently carries several selector:all()
                # policies in the default tier, it's a standing source of
                # noise, not a temporary one.
                #
                # Fix: this table exists to preview what a *staged* policy
                # would do if promoted - so only ship a diff when the
                # resolved "pending" decision actually involves a
                # Staged{Global,}NetworkPolicy. Every instance of today's
                # noise resolves via a real GlobalNetworkPolicy on both sides
                # (there are zero staged policies live right now), so this
                # eliminates the whole class directly, without guessing at
                # timing. Once something real gets staged again, its name
                # will show up in the pending chain and pass this check.
                #
                # Known tradeoff: this also means a future recurrence of the
                # *other* real bug found the same day (Felix's dataplane
                # falling behind its own control-plane state after a policy
                # change - fixed via `kubectl rollout restart daemonset/
                # calico-node -n calico-system`, see
                # docs/incidents/2026-08-23-dns-outage.md) would resolve via
                # real policy names on both sides too, and wouldn't show up
                # here either. This table was never the primary way that bug
                # got found (a direct flow trace via the whisker-backend API
                # was) - if something looks cluster-networking-wrong again,
                # check that directly rather than relying on this panel alone.

                def resolve(policy_list):
                    # Last entry is the resolved decision - either a policy's own
                    # explicit Allow/Deny, or EndOfTier (action always Deny). For
                    # EndOfTier, the specific staged/real policy that was being
                    # evaluated when the tier ran out lives in trigger.name.
                    if not policy_list:
                        return None, None, False
                    last = policy_list[-1]
                    action = last.get("action")
                    if last.get("kind") == "EndOfTier":
                        trigger = last.get("trigger") or {}
                        name = trigger.get("name") or "(no staged policy - end of tier)"
                    else:
                        name = last.get("name")
                    involves_staged = any((p.get("kind") or "").startswith("Staged") for p in policy_list)
                    return action, name, involves_staged

                with urllib.request.urlopen(WHISKER_URL, timeout=30) as r:
                    data = json.load(r)
                items = data.get("items", [])
                now = datetime.datetime.now(datetime.timezone.utc)
                cutoff = now - datetime.timedelta(seconds=WINDOW_SECONDS)

                deny_values = []
                diff_values = []
                for f in items:
                    end_time = f.get("end_time")
                    if not end_time:
                        continue
                    ts = datetime.datetime.fromisoformat(end_time.replace("Z", "+00:00"))
                    if ts < cutoff:
                        continue
                    ts_ns = str(int(ts.timestamp() * 1_000_000_000))
                    base = {
                        "source_namespace": f.get("source_namespace") or f.get("source_name"),
                        "source_name": f.get("source_name"),
                        "dest_namespace": f.get("dest_namespace") or f.get("dest_name"),
                        "dest_name": f.get("dest_name"),
                        "protocol": f.get("protocol"),
                        "dest_port": f.get("dest_port"),
                        "reporter": f.get("reporter"),
                    }

                    policies = f.get("policies") or {}
                    enforced_action, enforced_name, _ = resolve(policies.get("enforced"))
                    pending_action, pending_name, pending_involves_staged = resolve(policies.get("pending"))

                    if f.get("action") == "Deny":
                        deny_values.append((ts_ns, json.dumps(base, sort_keys=True)))

                    if (
                        pending_action
                        and enforced_action
                        and pending_action != enforced_action
                        and pending_involves_staged
                    ):
                        diff = dict(base)
                        diff["enforced_action"] = enforced_action
                        diff["enforced_policy"] = enforced_name
                        diff["pending_action"] = pending_action
                        diff["pending_policy"] = pending_name
                        diff_values.append((ts_ns, json.dumps(diff, sort_keys=True)))

                streams = []
                if deny_values:
                    deny_values.sort()
                    streams.append({"stream": {"job": "calico-deny-log"}, "values": [list(v) for v in deny_values]})
                if diff_values:
                    diff_values.sort()
                    streams.append({"stream": {"job": "calico-pending-diff-log"}, "values": [list(v) for v in diff_values]})

                if not streams:
                    print("nothing to ship this run")
                else:
                    payload = {"streams": streams}
                    req = urllib.request.Request(
                        LOKI_URL,
                        data=json.dumps(payload).encode(),
                        headers={"Content-Type": "application/json"},
                        method="POST",
                    )
                    with urllib.request.urlopen(req, timeout=30) as r:
                        print(f"pushed {len(deny_values)} deny, {len(diff_values)} pending-diff flows, status {r.status}")
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
