---
apiVersion: v1
kind: ConfigMap
metadata:
  name: goflow2-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Network"
data:
  goflow2-per-host-traffic.json: |
    {
      "title": "NetFlow Per-Host Traffic",
      "uid": "netflow-per-host-traffic",
      "tags": ["goflow2", "netflow", "network"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Throughput",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "Bps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({job=\"netflow\"} | json | unwrap bytes[$__interval]))",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Throughput Over Time",
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true, "pointSize": 8 }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({job=\"netflow\"} | json | unwrap bytes[$__interval]))",
              "legendFormat": "total",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "barchart",
          "title": "Top Destination Hosts",
          "description": "Total bytes by destination address over the selected time range.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0 },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "showValue": "always",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.97,
            "barRadius": 0,
            "fullHighlight": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "topk(10, sum by (dst_addr) (sum_over_time({job=\"netflow\"} | json | unwrap bytes [$__range])))",
              "legendFormat": "{{dst_addr}}",
              "queryType": "instant",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value #A", "desc": true }] } }
          ]
        },
        {
          "id": 4,
          "type": "barchart",
          "title": "Top Source Hosts",
          "description": "Total bytes by source address over the selected time range.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0 },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "showValue": "always",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.97,
            "barRadius": 0,
            "fullHighlight": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "topk(10, sum by (src_addr) (sum_over_time({job=\"netflow\"} | json | unwrap bytes [$__range])))",
              "legendFormat": "{{src_addr}}",
              "queryType": "instant",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value #A", "desc": true }] } }
          ]
        },
        {
          "id": 5,
          "type": "barchart",
          "title": "Traffic by Protocol",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0 },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "showValue": "always",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.97,
            "barRadius": 0,
            "fullHighlight": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (proto) (sum_over_time({job=\"netflow\"} | json | unwrap bytes [$__range]))",
              "legendFormat": "{{proto}}",
              "queryType": "instant",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value #A", "desc": true }] } }
          ]
        },
        {
          "id": 6,
          "type": "barchart",
          "title": "Top Destination Ports",
          "description": "Raw port numbers, excluding the ephemeral/dynamic range (32768+) which is mostly random per-connection response ports - cross-reference well-known ports as needed (443=HTTPS, 53=DNS, etc).",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0 },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "showValue": "always",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.97,
            "barRadius": 0,
            "fullHighlight": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "topk(10, sum by (dst_port) (sum_over_time({job=\"netflow\"} | json | dst_port < 32768 | unwrap bytes [$__range])))",
              "legendFormat": "{{dst_port}}",
              "queryType": "instant",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value #A", "desc": true }] } }
          ]
        },
        {
          "id": 7,
          "type": "barchart",
          "title": "Traffic by Exporter",
          "description": "Which router/switch the flow data came from.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0 },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "showValue": "always",
            "stacking": "none",
            "groupWidth": 0.7,
            "barWidth": 0.97,
            "barRadius": 0,
            "fullHighlight": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (sampler_address) (sum_over_time({job=\"netflow\"} | json | unwrap bytes [$__range]))",
              "legendFormat": "{{sampler_address}}",
              "queryType": "instant",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value #A", "desc": true }] } }
          ]
        }
      ]
    }
  goflow2-collector-health.json: |
    {
      "title": "goflow2 Collector Health",
      "uid": "goflow2-collector-health",
      "tags": ["goflow2", "netflow", "network"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Export Throughput",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "Bps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(goflow2_flow_traffic_bytes_total[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Active Exporters",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count(count by (router) (goflow2_flow_process_nf_total))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Export Bytes/sec by Router",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true, "pointSize": 8 }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (remote_ip) (rate(goflow2_flow_traffic_bytes_total[5m]))",
              "legendFormat": "{{remote_ip}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Export Packets/sec by Router",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true, "pointSize": 8, "axisLabel": "packets/s" }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (remote_ip) (rate(goflow2_flow_traffic_packets_total[5m]))",
              "legendFormat": "{{remote_ip}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "NetFlow Decode Latency",
          "description": "Time goflow2 spends decoding each received NetFlow packet.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 5, "spanNulls": true, "pointSize": 8 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p50" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "p90" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_decoding_time_seconds{name=\"netflow\",quantile=\"0.5\"}",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_decoding_time_seconds{name=\"netflow\",quantile=\"0.9\"}",
              "legendFormat": "p90",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_decoding_time_seconds{name=\"netflow\",quantile=\"0.99\"}",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "NetFlow Processing Delay by Router",
          "description": "Gap between a flow's observed time and when goflow2 processed it. Large values indicate an exporter batching/caching flows before sending, not a goflow2 problem.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 5, "spanNulls": true, "pointSize": 8 }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_process_nf_delay_seconds{quantile=\"0.5\"}",
              "legendFormat": "{{router}} p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_process_nf_delay_seconds{quantile=\"0.9\"}",
              "legendFormat": "{{router}} p90",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "goflow2_flow_process_nf_delay_seconds{quantile=\"0.99\"}",
              "legendFormat": "{{router}} p99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "NetFlow FlowSet Records/sec by Type",
          "description": "DataFlowSet = actual flow records. TemplateFlowSet = protocol template definitions/refreshes.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "spanNulls": true, "pointSize": 8, "axisLabel": "records/s" }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (router, type) (rate(goflow2_flow_process_nf_flowset_records_total[5m]))",
              "legendFormat": "{{router}} - {{type}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
