---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        # Bare predict_linear on host filesystems with no usage threshold and
        # for: 0s — fires on any transient 2d dip (image pulls, pod churn).
        # kube-prometheus-stack's NodeFilesystemSpaceFillingUp covers host
        # disks properly (usage gate + prediction + 1h duration).
        CephNodeDiskspaceWarning:
          disabled: true
        CephNodeNetworkPacketDrops:
          expr: |
            (
              rate(node_network_receive_drop_total{device!="lo"}[10m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[10m])
            ) / (
              rate(node_network_receive_packets_total{device!="lo"}[10m]) +
              rate(node_network_transmit_packets_total{device!="lo"}[10m])
            ) >= 0.005 and (
              rate(node_network_receive_drop_total{device!="lo"}[10m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[10m])
            ) >= 100
        CephPoolGrowthWarning:
          expr: max by (pool_id) (predict_linear(ceph_pool_percent_used[2d], 3600 * 24 * 5)) * on(pool_id) group_right() ceph_pool_metadata >= 95
    route:
      dashboard:
        host:
          name: ceph.internal.oreillys.io
          path: "/"
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    cephClusterSpec:
      resources: null
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "true" # quote; auto-class new OSDs by media (hdd/ssd) for device-class pools
          device_failure_prediction_mode: local # requires mgr module
        osd:
          # The old WD Green / SMR HDDs top out at ~250 IOPS, so BlueStore
          # observes the occasional slow read. The default warn threshold of 1
          # slow op + a 24h (86400s) lifetime turns that into a permanent
          # HEALTH_WARN (BLUESTORE_SLOW_OP_ALERT). While these disks stay in
          # service for bulk capacity, relax it: warn only on a sustained
          # handful, and let it clear within the hour.
          bluestore_slow_ops_warn_threshold: "5" # quote (default 1)
          bluestore_slow_ops_warn_lifetime: "3600" # quote (default 86400 = 24h)
          # Every built-in mclock profile (high_client_ops, balanced,
          # high_recovery_ops) sums client+recovery reservation to 100%,
          # leaving background_best_effort (scrub/backfill/snaptrim) with a
          # true reservation of 0 - confirmed via `ceph config show osd.0`.
          # Result: deep scrubs only run on leftover capacity and stall for
          # hours at a time (measured: 3 PGs scrubbed in a 5h window, then
          # nothing). Go custom and carve out a real floor for scrub so it
          # can't be starved to zero, while still favouring client I/O.
          osd_mclock_profile: custom
          osd_mclock_scheduler_client_res: "0.5"
          osd_mclock_scheduler_client_wgt: "2"
          osd_mclock_scheduler_client_lim: "0" # 0 = no cap
          osd_mclock_scheduler_background_recovery_res: "0.3"
          osd_mclock_scheduler_background_recovery_wgt: "1"
          osd_mclock_scheduler_background_recovery_lim: "0"
          osd_mclock_scheduler_background_best_effort_res: "0.2" # was 0 (starved)
          osd_mclock_scheduler_background_best_effort_wgt: "1"
          osd_mclock_scheduler_background_best_effort_lim: "0.9"
          # Deep scrubs are a major slow-op source on spinning disks, and all
          # 3 hdd OSDs replicate nearly the whole cluster (136/142 PGs), so
          # stretch the interval and confine scrubs to an off-peak window -
          # extra headroom on top of the reservation fix above.
          osd_deep_scrub_interval: "1209600" # quote, 14d (default 7d = 604800)
          # Cluster runs UTC; these are wall-clock UTC hours, not local. 07:00
          # UTC = 23:00 AKDT (America/Anchorage, UTC-8, current DST rules).
          # Note: Ceph has no DST awareness, so this drifts to 22:00 local
          # once Alaska falls back to AKST (UTC-9) in Nov.
          osd_scrub_begin_hour: "7" # quote, ~23:00 Alaska (AKDT)
          osd_scrub_end_hour: "17" # quote, ~09:00 Alaska (AKDT), 10h window
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        ssl: false
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30      # minutes to hold noout on a draining failure domain
        pgHealthCheckTimeout: 0        # 0 = wait until PGs are healthy before unblocking next drain
      mgr:
        modules:
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true

    cephBlockPools:
      # Bulk / default tier — pinned to the HDD device class so spinning disks
      # carry general-purpose PVCs and the SSD OSDs stay reserved for the fast
      # pool below. failureDomain host + size 3 = one copy per HDD host.
      - name: ceph-blockpool
        spec:
          failureDomain: host
          deviceClass: hdd
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      # Fast tier — SSD device class for latency-sensitive PVCs (databases).
      # 3 SSD hosts (jonas, severian, drotte) as of the WD Blue -> wk-drotte
      # OSD. failureDomain host + size 3 = one copy per SSD host, matching the
      # HDD tier. See docs/disk-hardware-plan.md §2.
      - name: ceph-blockpool-ssd
        spec:
          failureDomain: host
          deviceClass: ssd
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block-ssd
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete

    cephFileSystems:
      - name: ceph-filesystem
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
        spec:
          dataPools:
            - failureDomain: host
              name: data0
              deviceClass: hdd
              replicated:
                size: 3
          metadataPool:
            deviceClass: hdd
            replicated:
              size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete

    # S3-compatible object store (RGW) — the in-cluster backup target for CNPG
    # Barman / MariaDB-native backups (and later Loki chunk storage). Pools are
    # HDD-backed (bulk backup data belongs on spinning disk, not the SSD tier)
    # and size 3 across the 3 HDD hosts. See docs/backup-dr-plan.md.
    # NOTE: RGW lives on Ceph, so it shares fate with the cluster it backs up —
    # it serves fast same-cluster restores/PITR; the durable DR copies must be
    # synced off-Ceph (NAS + off-site) per the plan.
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            deviceClass: hdd
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            deviceClass: hdd
            replicated:
              size: 3
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
