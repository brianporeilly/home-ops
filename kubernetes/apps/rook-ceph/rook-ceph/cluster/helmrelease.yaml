---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        # Bare predict_linear on host filesystems with no usage threshold and
        # for: 0s — fires on any transient 2d dip (image pulls, pod churn).
        # kube-prometheus-stack's NodeFilesystemSpaceFillingUp covers host
        # disks properly (usage gate + prediction + 1h duration).
        CephNodeDiskspaceWarning:
          disabled: true
        CephNodeNetworkPacketDrops:
          expr: |
            (
              rate(node_network_receive_drop_total{device!="lo"}[10m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[10m])
            ) / (
              rate(node_network_receive_packets_total{device!="lo"}[10m]) +
              rate(node_network_transmit_packets_total{device!="lo"}[10m])
            ) >= 0.005 and (
              rate(node_network_receive_drop_total{device!="lo"}[10m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[10m])
            ) >= 100
        CephPoolGrowthWarning:
          expr: max by (pool_id) (predict_linear(ceph_pool_percent_used[2d], 3600 * 24 * 5)) * on(pool_id) group_right() ceph_pool_metadata >= 95
    route:
      dashboard:
        host:
          name: ceph.internal.oreillys.io
          path: "/"
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    cephClusterSpec:
      resources: null
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "true" # quote; auto-class new OSDs by media (hdd/ssd) for device-class pools
          device_failure_prediction_mode: local # requires mgr module
        osd:
          # The old WD Green / SMR HDDs top out at ~250 IOPS, so BlueStore
          # observes the occasional slow read. The default warn threshold of 1
          # slow op + a 24h (86400s) lifetime turns that into a permanent
          # HEALTH_WARN (BLUESTORE_SLOW_OP_ALERT). While these disks stay in
          # service for bulk capacity, relax it: warn only on a sustained
          # handful, and let it clear within the hour.
          bluestore_slow_ops_warn_threshold: "5" # quote (default 1)
          bluestore_slow_ops_warn_lifetime: "3600" # quote (default 86400 = 24h)
          # Prioritise client I/O over recovery/backfill/scrub so latency stays
          # smooth on the ~250 IOPS HDDs. Trade-off: backfill (e.g. during the
          # future SSD-DB migration) runs slower - fine for a homelab.
          osd_mclock_profile: high_client_ops # was 'balanced'
          # Deep scrubs are a major slow-op source on spinning disks. Stretch
          # the interval and confine scrubs to an off-peak window; 81 PGs /
          # ~66 GiB scrub comfortably inside a nightly window.
          osd_deep_scrub_interval: "1209600" # quote, 14d (default 7d = 604800)
          osd_scrub_begin_hour: "1" # quote, 01:00 local
          osd_scrub_end_hour: "6" # quote, 06:00 local
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        ssl: false
      disruptionManagement:
        managePodBudgets: true
        osdMaintenanceTimeout: 30      # minutes to hold noout on a draining failure domain
        pgHealthCheckTimeout: 0        # 0 = wait until PGs are healthy before unblocking next drain
      mgr:
        modules:
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true

    cephBlockPools:
      # Bulk / default tier — pinned to the HDD device class so spinning disks
      # carry general-purpose PVCs and the SSD OSDs stay reserved for the fast
      # pool below. failureDomain host + size 3 = one copy per HDD host.
      - name: ceph-blockpool
        spec:
          failureDomain: host
          deviceClass: hdd
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      # Fast tier — SSD device class for latency-sensitive PVCs (databases).
      # Only 2 SSD hosts exist today (wk-jonas, wk-severian), so this pool runs
      # size 2 until the 3rd SSD OSD (WD Blue -> wk-drotte) lands, then bump to
      # size 3. See docs/disk-hardware-plan.md §2. min_size 2 = no single-copy
      # writes; trade-off is a single SSD-host reboot pauses writes to this pool
      # (acceptable: the DBs here replicate at the app layer across instances).
      - name: ceph-blockpool-ssd
        spec:
          failureDomain: host
          deviceClass: ssd
          replicated:
            size: 2
            requireSafeReplicaSize: true
          parameters:
            min_size: "2"
        storageClass:
          enabled: true
          name: ceph-block-ssd
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete

    cephFileSystems:
      - name: ceph-filesystem
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
        spec:
          dataPools:
            - failureDomain: host
              name: data0
              deviceClass: hdd
              replicated:
                size: 3
          metadataPool:
            deviceClass: hdd
            replicated:
              size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete

    cephObjectStores: []
