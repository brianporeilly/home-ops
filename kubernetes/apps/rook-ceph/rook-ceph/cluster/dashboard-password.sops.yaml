---
# Pre-provisioned Ceph dashboard admin password. Rook reads an existing
# rook-ceph-dashboard-password Secret and uses its value instead of generating
# one (getOrGenerateDashboardPassword), and re-applies it to the dashboard
# `admin` user on every reconcile (setLoginCredentials). The data key MUST be
# `password` and the namespace MUST be rook-ceph.
#
# NOTE: this file is committed PLAINTEXT with a placeholder. Before pushing:
#   1. set `password` to a strong value (Ceph enforces a policy: >=8 chars,
#      mixed case + digit, not the username) — a weak value makes the reconcile
#      reject it and keep the old password.
#   2. encrypt in place:  sops --encrypt --in-place <this file>
# The repo's .sops.yaml encrypts only data/stringData, so metadata stays readable.
apiVersion: v1
kind: Secret
metadata:
  name: rook-ceph-dashboard-password
  namespace: rook-ceph
type: Opaque
stringData:
  password: REPLACE_ME_THEN_SOPS_ENCRYPT
