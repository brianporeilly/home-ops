---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: audiobookshelf
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      audiobookshelf:
        containers:
          app:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
            env:
              AUDIOBOOKSHELF_UID: 1000
              AUDIOBOOKSHELF_GID: 1000
              PORT: 8080
              CONFIG_PATH: /config
              METADATA_PATH: /metadata
              BACKUP_PATH: /metadata/backups
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 500Mi

      # Audiobookshelf has no declarative auth config (env vars, config
      # file) - only a Settings UI backed by PATCH /api/auth-settings
      # (admin-only). Scripts that endpoint instead, same shape as
      # forgejo's oidc-source-sync CronJob. Idempotent - PATCHing the same
      # values every run is a no-op after the first.
      oidc-bootstrap:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 2
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: python
              tag: 3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
            command:
              - python3
              - -c
              - |
                import json, os, urllib.request

                # Service is the bare release name, not "-app" suffixed -
                # this is a single-service release (service.app has
                # primary: true), which collapses to the release name.
                ABS_URL = "http://audiobookshelf.media.svc.cluster.local:8080"
                # External hostname, not auth.internal.oreillys.io, even
                # though this app is internal-only today - this is the
                # backend's own server-to-Authentik traffic (discovery,
                # token exchange), and Authentik's discovery response is
                # host-header-sensitive (issuer_mode: per_provider), so
                # whatever hostname is pinned here becomes fixed for every
                # login regardless of which route the browser used. Learned
                # this the hard way with home-assistant - auth.oreillys.io
                # resolves in-cluster straight to envoy-external's own VIP,
                # no NAT hairpin, so there's no cost to picking it now and
                # it means audiobookshelf's eventual external route (next
                # on the security-plan roadmap) won't need this redone.
                AUTH_HOSTNAME = "auth.oreillys.io"
                SLUG = "audiobookshelf"

                def call(method, path, body=None, token=None):
                    data = json.dumps(body).encode() if body is not None else None
                    headers = {"Content-Type": "application/json"}
                    if token:
                        headers["Authorization"] = f"Bearer {token}"
                    req = urllib.request.Request(f"{ABS_URL}{path}", data=data, headers=headers, method=method)
                    with urllib.request.urlopen(req, timeout=15) as r:
                        return json.loads(r.read())

                login = call("POST", "/login", {
                    "username": os.environ["ADMIN_USERNAME"],
                    "password": os.environ["ADMIN_PASSWORD"],
                })
                token = login["user"]["accessToken"]

                issuer = f"https://{AUTH_HOSTNAME}/application/o/{SLUG}"
                payload = {
                    "authActiveAuthMethods": ["local", "openid"],
                    "authOpenIDIssuerURL": f"{issuer}/",
                    "authOpenIDAuthorizationURL": f"https://{AUTH_HOSTNAME}/application/o/authorize/",
                    "authOpenIDTokenURL": f"https://{AUTH_HOSTNAME}/application/o/token/",
                    "authOpenIDUserInfoURL": f"https://{AUTH_HOSTNAME}/application/o/userinfo/",
                    "authOpenIDJwksURL": f"{issuer}/jwks/",
                    "authOpenIDLogoutURL": f"{issuer}/end-session/",
                    "authOpenIDClientID": os.environ["OIDC_CLIENT_ID"],
                    "authOpenIDClientSecret": os.environ["OIDC_CLIENT_SECRET"],
                    "authOpenIDButtonText": "Login with Authentik",
                    # No authOpenIDGroupClaim/authOpenIDAdvancedPermsClaim -
                    # role is whatever the matched/auto-registered local
                    # account already has, never touched by OIDC login.
                    # authOpenIDMatchExistingBy links an existing local
                    # account by username first; authOpenIDAutoRegister
                    # creates a new (always type: user, never admin) one
                    # only if no existing account matches.
                    "authOpenIDMatchExistingBy": "username",
                    "authOpenIDAutoRegister": True,
                    # Server/OidcAuthStrategy.js builds the callback as
                    # `${authOpenIDSubfolderForRedirectURLs}/auth/openid/callback`
                    # - never set here before, so it evaluated to the JS
                    # literal "undefined" and got baked into the redirect_uri
                    # ABS actually sent (confirmed live in authentik-server's
                    # access log: .../undefined/auth/openid/callback, 400).
                    # ABS's own migration explicitly special-cases empty
                    # string as the valid value for a root-hosted deployment
                    # (MiscController.js won't null it out like every other
                    # setting) - this app has no subfolder.
                    "authOpenIDSubfolderForRedirectURLs": "",
                }

                result = call("PATCH", "/api/auth-settings", payload, token=token)
                print("auth-settings updated, active methods:", result.get("authActiveAuthMethods"))
            env:
              ADMIN_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-admin-secret
                    key: ADMIN_USERNAME
              ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-admin-secret
                    key: ADMIN_PASSWORD
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-oidc-secret
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: audiobookshelf-oidc-secret
                    key: client-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: audiobookshelf
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - books.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        suffix: config
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "1Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: audiobookshelf
        # advancedMounts, not globalMounts - oidc-bootstrap only calls the
        # ABS HTTP API and must not mount this RWO PVC: it's already
        # attached to the audiobookshelf controller's pod, so a bootstrap
        # pod landing on a different node would hang in ContainerCreating
        # forever waiting for an attach that can never happen.
        advancedMounts:
          audiobookshelf:
            app:
              - path: /config
      metadata:
        suffix: metadata
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        advancedMounts:
          audiobookshelf:
            app:
              - path: /metadata
      # NAS static NFS mount. Server exports /media with an
      # `audiobooks` subdirectory dedicated to this app.
      media:
        type: nfs
        server: 10.20.30.11
        path: /media/audiobooks
        advancedMounts:
          audiobookshelf:
            app:
              - path: /media
      tmpfs:
        type: emptyDir
        advancedMounts:
          audiobookshelf:
            app:
              - path: /tmp