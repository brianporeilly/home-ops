---
apiVersion: v1
kind: Secret
metadata:
  name: audiobookshelf-admin-secret
stringData:
  # Existing native admin account's credentials - Audiobookshelf has no
  # declarative admin-provisioning path (created via the first-run setup
  # wizard), so the oidc-bootstrap CronJob (helmrelease.yaml) needs a real
  # admin session to PATCH /api/auth-settings. Fill in your actual admin
  # username/password before sops-encrypting this file.
  ADMIN_USERNAME: "CHANGEME"
  ADMIN_PASSWORD: "CHANGEME"
