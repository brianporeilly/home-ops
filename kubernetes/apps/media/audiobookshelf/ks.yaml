---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiobookshelf
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
    # oidc-secret.yaml's Reflector mirror can otherwise lose a race
    # against authentik/app's own ExternalSecret and get stuck permanently
    # rejected - see kubernetes/apps/download/lidarr/ks.yaml for the
    # incident this was first found from.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/media/audiobookshelf/app
  postBuild:
    substitute:
      APP: audiobookshelf
      PVC: audiobookshelf-config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false