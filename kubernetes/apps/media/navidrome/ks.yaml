---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app navidrome
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/authentik/protect
    - ../../../../components/authentik/protect-external
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
    # protect's Reflector-mirrored oidc-client-secret can lose a race
    # against authentik's own ExternalSecret if applied first - see
    # download/lidarr/ks.yaml for the incident this was first found from.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/media/navidrome/app
  postBuild:
    substitute:
      APP: navidrome
      PVC: navidrome-data
      HTTPROUTE_NAME: navidrome-app
      HOSTNAME: music.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
      EXTERNAL_HTTPROUTE_NAME: navidrome-external
      EXTERNAL_HOSTNAME: music.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false