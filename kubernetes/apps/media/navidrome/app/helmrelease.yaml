---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: navidrome
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.63.2@sha256:38246ebb80d6f7e2724eecab4acafa7b14ec66ae800b2454aa6da4c19f80a9ce
            env:
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4533
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        primary: true
        controller: navidrome
        ports:
          http:
            port: 4533

    route:
      app:
        hostnames:
          - music.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      # Unauthenticated (at the Gateway level) path for direct Subsonic API
      # clients (Symfonium etc.) that can't complete an OIDC redirect -
      # Gateway API's cross-route precedence (longest path match wins)
      # sends /rest traffic here instead of through the
      # SecurityPolicy-protected app route above. Adding this second route
      # key renames that one from `navidrome` to `navidrome-app` (see
      # ks.yaml's HTTPROUTE_NAME) - same pattern as sonarr, see
      # download/sonarr/app/helmrelease.yaml for the fuller rationale.
      # Still gated by navidrome's own per-request Subsonic auth (username
      # + salted token) - not a net new exposure versus the pre-SSO
      # baseline, and this route is internal-only today anyway.
      api:
        annotations:
          # No 401-expecting UI check for this one - not meaningful to
          # monitor and Gatus would otherwise flag it as always-down.
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - music.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /rest
            backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        suffix: data
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "2Gi"
        # CSI volume populator - see kubernetes/apps/home/esphome/app/helmrelease.yaml
        # for the full explanation.
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: navidrome
        globalMounts:
          - path: /data
      # NAS static NFS mount, dedicated music subdirectory - navidrome only
      # scans, never writes here.
      music:
        type: nfs
        server: 10.20.30.11
        path: /media/music
        globalMounts:
          - path: /music
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
