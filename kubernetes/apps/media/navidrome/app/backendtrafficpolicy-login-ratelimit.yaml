---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_backendtrafficpolicies.yaml
# Scoped via sectionName to just the login-rate-limited rule in
# helmrelease.yaml's route.external-api, so normal streaming/browsing on
# the other external routes keeps the gateway-level 100 req/s limit
# untouched. A policy attached to a more specific target (this HTTPRoute
# rule) fully replaces rather than merges with the less-specific
# envoy-external-ratelimit policy for that rule's traffic - compression,
# timeout and responseOverride are repeated here for the same reason
# envoy-external-ratelimit repeats them over the Gateway-level "envoy"
# policy (see that policy's comment, envoy.yaml in envoy-gateway).
#
# Named "login-rate-limited" for consistency with every other app's
# equivalent policy even though there's no distinct login step here -
# every /rest request carries Subsonic credentials (username + salted
# token), so the whole API surface plays the same role a login endpoint
# does elsewhere: it's the credential-bearing path that needs blunting
# against brute force now that it's genuinely internet-facing, not just
# LAN-reachable.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: navidrome-login-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: navidrome-external-api
      sectionName: login-rate-limited
  compression:
    - type: Brotli
    - type: Gzip
  timeout:
    http:
      requestTimeout: 10m
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 20
            unit: Minute
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 403
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /403
    - match:
        statusCodes:
          - type: Value
            value: 404
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /404
    - match:
        statusCodes:
          - type: Value
            value: 429
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /429
    - match:
        statusCodes:
          - type: Value
            value: 500
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /500
    - match:
        statusCodes:
          - type: Value
            value: 502
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /502
    - match:
        statusCodes:
          - type: Value
            value: 503
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /503
    - match:
        statusCodes:
          - type: Value
            value: 504
      redirect:
        scheme: https
        hostname: error-pages.internal.oreillys.io
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /504
