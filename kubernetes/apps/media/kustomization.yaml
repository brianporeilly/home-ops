---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
components:
  - ../../components/common
patches:
  - target:
      kind: Namespace
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        annotations:
          # kopiur mover pod for grimmory runs its app container as root -
          # the mover has to match to read the PVC data, and kopiur gates
          # any UID-0 mover behind this explicit opt-in.
          kopiur.home-operations.com/privileged-movers: "true"
resources:
  - ./audiobookshelf/ks.yaml
  - ./calibre-web-automated/ks.yaml
  - ./jellyfin/ks.yaml
  - ./jellyseerr/ks.yaml
  - ./navidrome/ks.yaml
  - ./podfetch/ks.yaml
  - ./ersatztv/ks.yaml
  - ./grimmory/ks.yaml
  - ./tube-archivist/ks.yaml
