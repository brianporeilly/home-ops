---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podfetch
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: podfetch
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      podfetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/samtv12345/podfetch
              tag: v5.2.3@sha256:b61200341ef53a260cf624bc81e09cf0aebfac8bff62fda4b759b73a6c811cdc
            env:
              PORT: &port 8000
              POLLING_INTERVAL: 300
              DATABASE_URL: sqlite:///app/db/podcast.db
              # Basic auth stays enabled alongside OIDC as a break-glass
              # fallback - PodFetch supports both simultaneously
              # (EnvironmentService.any_auth_enabled ORs all three modes).
              BASIC_AUTH: "true"
              OIDC_AUTH: "true"
              OIDC_AUTHORITY: https://auth.internal.oreillys.io/application/o/podfetch/
              OIDC_CLIENT_ID: podfetch
              # Real IdP metadata URL, not this repo's usual "*/well-known/
              # openid-configuration" pattern - PodFetch's own config
              # (crates/common-infrastructure/src/config.rs) reads a raw
              # jwks_uri directly, no discovery-document fetch of its own.
              OIDC_JWKS: https://auth.internal.oreillys.io/application/o/podfetch/jwks/
              # Best-guess, NOT confirmed live - see the matching comment on
              # this app's redirect_uris entry in
              # blueprints-native-apps.yaml for why. Required: PodFetch
              # panics on startup with OIDC_AUTH=true and this unset.
              OIDC_REDIRECT_URI: https://podfetch.internal.oreillys.io/
            envFrom:
              - secretRef:
                  name: podfetch-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Podfetch buffers whole episode files into memory before writing to
                # disk (no streaming download path), and downloads up to
                # max_parallel_downloads (default 3) episodes concurrently, so peak
                # usage is driven by episode file size x concurrency, not baseline
                # (idle is ~20-30Mi). 512Mi was getting OOMKilled on concurrent
                # downloads of a few normal-sized episodes.
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - podfetch.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      db:
        suffix: db
        storageClass: "ceph-block-ssd"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /app/db
      # NAS static NFS mount - dedicated podcasts export subdirectory.
      podcasts:
        type: nfs
        server: 10.20.30.11
        path: /media/podcasts
        globalMounts:
          - path: /app/podcasts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
