---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podfetch
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: podfetch
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      podfetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/samtv12345/podfetch
              tag: v5.2.3@sha256:b61200341ef53a260cf624bc81e09cf0aebfac8bff62fda4b759b73a6c811cdc
            env:
              PORT: &port 8000
              POLLING_INTERVAL: 300
              DATABASE_URL: sqlite:///app/db/podcast.db
              # Reverted, confirmed live (2026-08-29): PodFetch's OIDC login
              # is fundamentally broken, not a config problem - its frontend
              # (ui/src/main.tsx, confirmed present even in the unreleased
              # main branch, not just our pinned v5.2.3) builds the
              # authorize redirect as `${authority}?client_id=...` instead
              # of discovering the real authorization_endpoint via
              # /.well-known/openid-configuration first. It literally
              # treats the issuer URL as the authorize endpoint, so it
              # sends the browser to Authentik's bare issuer path -
              # Authentik serves its discovery document there instead of an
              # actual login page. No env var or Authentik-side config can
              # work around this. Also found the hard way: while
              # OIDC_AUTH=true, PodFetch's login bootstrap never falls
              # through to the basic-auth path at all (if/else if on
              # oidcConfigured first) - so leaving OIDC "on" while it's
              # broken means total lockout, not just missing SSO.
              # BASIC_AUTH and OIDC_AUTH also can't both be true regardless
              # (confirmed live: PodFetch panics on startup with both set).
              #
              # Left the OIDC_* values here, commented, so re-enabling once
              # upstream fixes this is a one-line flip - Authentik's own
              # provider/blueprint (blueprints-native-apps.yaml) is
              # untouched and still correct.
              BASIC_AUTH: "true"
              # OIDC_AUTH: "true"
              # OIDC_AUTHORITY: https://auth.internal.oreillys.io/application/o/podfetch/
              # OIDC_CLIENT_ID: podfetch
              # OIDC_JWKS: https://auth.internal.oreillys.io/application/o/podfetch/jwks/
              # OIDC_REDIRECT_URI: https://podfetch.internal.oreillys.io/ui/login
            envFrom:
              - secretRef:
                  name: podfetch-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Podfetch buffers whole episode files into memory before writing to
                # disk (no streaming download path), and downloads up to
                # max_parallel_downloads (default 3) episodes concurrently, so peak
                # usage is driven by episode file size x concurrency, not baseline
                # (idle is ~20-30Mi). 512Mi was getting OOMKilled on concurrent
                # downloads of a few normal-sized episodes.
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - podfetch.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      db:
        suffix: db
        storageClass: "ceph-block-ssd"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /app/db
      # NAS static NFS mount - dedicated podcasts export subdirectory.
      podcasts:
        type: nfs
        server: 10.20.30.11
        path: /media/podcasts
        globalMounts:
          - path: /app/podcasts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
