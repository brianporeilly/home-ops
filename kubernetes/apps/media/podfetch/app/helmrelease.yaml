---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podfetch
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: podfetch
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      podfetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/samtv12345/podfetch
              tag: v5.2.2@sha256:98d9306f6cfdf16bfbf3492fa915af2ce0bad3e19bc1d39d6d9d7dfe84604f41
            env:
              PORT: &port 8000
              POLLING_INTERVAL: 300
              DATABASE_URL: sqlite:///app/db/podcast.db
              BASIC_AUTH: "true"
            envFrom:
              - secretRef:
                  name: podfetch-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Podfetch buffers whole episode files into memory before writing to
                # disk (no streaming download path), and downloads up to
                # max_parallel_downloads (default 3) episodes concurrently, so peak
                # usage is driven by episode file size x concurrency, not baseline
                # (idle is ~20-30Mi). 512Mi was getting OOMKilled on concurrent
                # downloads of a few normal-sized episodes.
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - podfetch.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      db:
        suffix: db
        storageClass: "ceph-block-ssd"
        accessMode: ReadWriteOnce
        size: "1Gi"
        globalMounts:
          - path: /app/db
      podcasts:
        suffix: podcasts
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "50Gi"
        globalMounts:
          - path: /app/podcasts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
