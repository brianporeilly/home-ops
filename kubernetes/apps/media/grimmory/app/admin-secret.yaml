---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/secret_v1.json
# PLAINTEXT PLACEHOLDER - fill in the real admin credentials (grimmory's
# existing BookLore admin account) and sops-encrypt this file before
# committing/applying. The oidc-bootstrap CronJob logs in as this user to
# configure OIDC settings via the admin-only /api/v1/settings endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-admin-secret
stringData:
  ADMIN_USERNAME: CHANGEME
  ADMIN_PASSWORD: CHANGEME
