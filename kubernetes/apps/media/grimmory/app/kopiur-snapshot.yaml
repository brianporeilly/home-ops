---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Written directly rather than via components/kopiur/backup - that component
# only wires up a single ${PVC}, but grimmory has two PVCs worth backing up
# (library data + the bookdrop ingest dir). Same repository/mover/retention
# shape as the shared component, just with both sources in one policy.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: grimmory
spec:
  repository:
    kind: ClusterRepository
    name: nas-backups
  # Required for the shared cross-namespace repository - see the
  # equivalent comment in components/kopiur/backup/snapshotpolicy.yaml.
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: grimmory-data
    - pvc:
        name: grimmory-bookdrop
  mover:
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: nfs-slow
    # grimmory's app container runs as root - see the equivalent comment in
    # components/kopiur/backup/snapshotpolicy.yaml. media namespace carries
    # the privileged-movers opt-in annotation for this.
    inheritSecurityContextFrom:
      pvcConsumer: {}
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/restore_v1alpha1.json
# Only covers grimmory-data. grimmory-bookdrop is declared as a second
# source above but has never actually been captured by any Snapshot this
# SnapshotPolicy has produced - wiring a populator to a PVC with zero
# backup history would be a no-op at best.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: grimmory
spec:
  source:
    fromPolicy:
      name: grimmory
  target:
    populator: {}
  policy:
    onMissingSnapshot: Continue
  credentialProjection:
    enabled: true
  mover:
    cache:
      mode: Persistent
      capacity: 2Gi
      storageClassName: nfs-slow
    inheritSecurityContextFrom:
      snapshot: {}
    # grimmory's SnapshotPolicy needed root + DAC_OVERRIDE to back up in
    # the first place (see the equivalent comment in
    # download/qui/ks.yaml), so restoring it needs privilegedMode: true
    # too - see the equivalent comment in home/esphome/ks.yaml.
    privilegedMode: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: grimmory
spec:
  policyRef:
    name: grimmory
  schedule:
    cron: "H * * * *"
    runOnCreate: false
