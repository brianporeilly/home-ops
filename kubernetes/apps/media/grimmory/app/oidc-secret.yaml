---
# Reflector pull mirror of the canonical grimmory-oidc-credentials Secret
# ESO generates in the authentik namespace - see
# kubernetes/apps/observability/grafana/app/oidc-secret.yaml for the same
# pattern. Nothing to sops-encrypt here; Reflector populates
# client-id/client-secret automatically.
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-oidc-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/grimmory-oidc-credentials"
type: Opaque
