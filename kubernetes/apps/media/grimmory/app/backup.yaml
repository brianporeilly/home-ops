---
# Native mariadb-operator backup to a PVC (picked up by kopiur, see
# kopiur-snapshot.yaml). See docs/backup-dr-plan.md.
#
# Was S3 (Ceph RGW) until Ceph 20.2.4's SigV4 hardening started rejecting
# mariadb-operator's uploads: its minio-go client excludes Content-Type from
# SignedHeaders on chunked/streaming PutObject even though it always sends
# the header, so RGW's now-correct "if content-type is present it must be
# signed" check rejects every upload with AccessDenied. Unconditional in
# minio-go's PutObject path (no client-side fix), and the server-side
# workaround (rgw_sigv4_insecure) would weaken SigV4 for every S3 client on
# this RGW. PVC storage sidesteps RGW/S3 entirely; revisit if minio-go/
# mariadb-operator ever fixes the signing.
#
# Renamed from grimmory-mariadb-backup because spec.storage is immutable on
# this CRD - an in-place edit is rejected by the admission webhook, so a new
# name makes Flux delete+recreate instead. The RGW bucket is untouched
# (Retain reclaim policy).
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: grimmory-mariadb-backup-pvc
spec:
  mariaDbRef:
    name: grimmory-mariadb
  schedule:
    cron: "0 3 * * *" # 03:00 daily
  compression: gzip
  maxRetention: 720h # 30d
  storage:
    persistentVolumeClaim:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
