---
# Bucket + S3 credentials for grimmory-mariadb backups (Ceph RGW).
# Provisions bucket `mariadb-grimmory` and a Secret named grimmory-mariadb-backup.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: grimmory-mariadb-backup
spec:
  bucketName: mariadb-grimmory
  storageClassName: ceph-bucket
