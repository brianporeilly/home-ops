---
apiVersion: v1
kind: Secret
metadata:
  name: jellyfin-admin-secret
stringData:
  # Admin API key (Admin Dashboard > API Keys > +) - Jellyfin has no
  # declarative way to create one, so the oidc-bootstrap CronJob
  # (helmrelease.yaml) needs an existing key to call the plugin
  # configuration API. Fill in a real key before sops-encrypting this
  # file - name it something like "oidc-bootstrap" in the Jellyfin UI so
  # it's identifiable/revocable later.
  API_KEY: "CHANGEME"
