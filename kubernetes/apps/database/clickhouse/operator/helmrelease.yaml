---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: 0.27.3
      sourceRef:
        kind: HelmRepository
        name: altinity
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
    configs:
      files:
        config.yaml:
          watch:
            namespaces:
              include: [".*"]
