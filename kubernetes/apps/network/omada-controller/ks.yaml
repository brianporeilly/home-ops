---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app omada-controller
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # omada-controller's pod securityContext is unset, so `id` inside the
  # container reports uid 0 - but the entrypoint actually drops to an
  # internal service UID (508) before writing any data, so every file on
  # the PVC is really owned 508:508, not 0:0. That's invisible to the
  # component's inheritSecurityContextFrom.pvcConsumer either way (no
  # pinned pod-level UID to read), so it needs an explicit override.
  # Running the mover AS 508 only fixes the source-PVC read - it still
  # can't write to the NFS-backed repo (owned 1000:1000), which only
  # grants access to an exact UID match or root's NFS no_root_squash
  # bypass. So root + DAC_OVERRIDE (to get past the source PVC's 0600
  # files, owned 508:508, since the mover's hardened base drops root's
  # own local DAC bypass too) is what actually works end-to-end - see the
  # equivalent comment in download/qui/ks.yaml. network namespace carries
  # the privileged-movers opt-in for this.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: omada-controller
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - DAC_OVERRIDE
    # Restoring needs mover.privilegedMode: true too, for the same reason
    # as the backup-side override above (CAP_CHOWN to reproduce root:root
    # ownership) - see the equivalent comment in home/esphome/ks.yaml.
    - target:
        kind: Restore
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: omada-controller
        spec:
          mover:
            privilegedMode: true
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/network/omada-controller/app
  postBuild:
    substitute:
      APP: omada-controller
      PVC: omada-controller-data
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false