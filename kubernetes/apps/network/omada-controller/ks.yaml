---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app omada-controller
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  # omada-controller's root UID only comes from its image's own USER line,
  # not a pinned pod/container securityContext - invisible to the
  # component's inheritSecurityContextFrom.pvcConsumer, so it needs an
  # explicit override. network namespace carries the privileged-movers
  # opt-in for this.
  patches:
    - target:
        kind: SnapshotPolicy
        name: omada-controller
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: omada-controller
        spec:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
  dependsOn:
    - name: envoy-gateway-config
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/network/omada-controller/app
  postBuild:
    substitute:
      APP: omada-controller
      PVC: omada-controller-data
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false