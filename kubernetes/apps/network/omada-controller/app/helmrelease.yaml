---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omada-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      omada-controller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mbentley/omada-controller
              tag: 6.0.0.25@sha256:2450d74cb61527f604557caaa6082bac0ef8b888f8799a8eeb09209e769cfe05
            env:
              MANAGE_HTTP_PORT: "8088"
              MANAGE_HTTPS_PORT: "8043"
              PORTAL_HTTP_PORT: "8088"
              PORTAL_HTTPS_PORT: "8843"
              SHOW_SERVER_LOGS: "true"
              SHOW_MONGODB_LOGS: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        primary: true
        ports:
          https:
            port: 8043
            targetPort: 8043
            protocol: TCP
            appProtocol: kubernetes.io/wss
      controller:
        controller: omada-controller
        type: LoadBalancer
        externalTrafficPolicy: Local
        ipFamilies: [ IPv4 ]
        ipFamilyPolicy: PreferDualStack
        ports:
          # # Docs: https://www.tp-link.com/us/support/faq/3281/
          # Management Ports
          mgmt-8088-tcp:
            port: 8088
            targetPort: 8088
            protocol: TCP
          mgmt-8043-tcp:
            port: 8043
            protocol: TCP
            targetPort: 8043
          portal-8843-tcp:
            port: 8843
            protocol: TCP
            targetPort: 8843
          # Device Discovery, Adoption, Management, and Upgrade
          eap-v5-discovery:
            port: 29810
            protocol: UDP
            targetPort: 29810
          eap-v4-discovery1:
            port: 29811
            protocol: TCP
            targetPort: 29811
          eap-v4-discovery2:
            port: 29812
            protocol: TCP
            targetPort: 29812
          eap-v4-upgrade:
            port: 29813
            protocol: TCP
            targetPort: 29813
          eap-v5-manage:
            port: 29814
            protocol: TCP
            targetPort: 29814
          eap-v5-device-info:
            port: 29815
            protocol: TCP
            targetPort: 29815
          eap-v5-remote-control:
            port: 29816
            protocol: TCP
            targetPort: 29816
          eap-v6-monitoring:
            port: 29817
            protocol: TCP
            targetPort: 29817
          init-check:
            port: 27001
            protocol: UDP
            targetPort: 27001
          old-init-info:
            port: 27002
            protocol: TCP
            targetPort: 27002
          old-db-access:
            port: 27017
            protocol: TCP
            targetPort: 27017
          db-access:
            port: 27217
            protocol: TCP
            targetPort: 27217
    route:
      app:
        hostnames:
          - omada.internal.oreillys.io
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: omada-controller-app
                port: 8043
    persistence:
      data:
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "5Gi"
        globalMounts:
          - path: /opt/tplink/EAPController/data
      work:
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: "10Gi"
        globalMounts:
          - path: /opt/tplink/EAPController/work
      logs:
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /opt/tplink/EAPController/logs
      backup:
        # type: nfs
        # server: "nas"
        # path: /backup/data/k8s/omada
        storageClass: "ceph-block"
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /opt/tplink/EAPController/data/autobackup
      certficates:
        type: secret
        name: oreillys.io-tls
        advancedMounts:
          omada-controller:
            app:
              - path: /cert/tls.crt
                readOnly: true
                subPath: tls.crt
              - path: /cert/tls.key
                readOnly: true
                subPath: tls.key
