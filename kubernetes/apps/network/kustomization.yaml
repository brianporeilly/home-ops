---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
components:
  - ../../components/common
patches:
  - target:
      kind: Namespace
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        annotations:
          # kopiur mover pod for omada-controller runs its app container as
          # root - the mover has to match to read the PVC data, and kopiur
          # gates any UID-0 mover behind this explicit opt-in.
          kopiur.home-operations.com/privileged-movers: "true"
resources:
  - ./certificates/ks.yaml
  - ./echo/ks.yaml
  - ./envoy-gateway/ks.yaml
  - ./omada-controller/ks.yaml
