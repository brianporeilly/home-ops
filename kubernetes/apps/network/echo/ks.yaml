---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app echo
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/authentik/protect
    - ../../../../components/authentik/protect-external
  # components/authentik/protect's Reflector mirror can lose a race against
  # authentik's own ExternalSecret - see kubernetes/apps/download/lidarr/ks.yaml
  # for the full incident (confirmed live via whisker's rollout).
  dependsOn:
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/network/echo/app
  postBuild:
    substitute:
      APP: echo
      HTTPROUTE_NAME: echo
      HOSTNAME: echo.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
      EXTERNAL_HTTPROUTE_NAME: echo-external
      EXTERNAL_HOSTNAME: echo.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
