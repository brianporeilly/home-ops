---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_securitypolicies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo
spec:
  # Must live in the same namespace as its target - confirmed via
  # `kubectl explain securitypolicy.spec.targetRef` ("This policy and the
  # TargetRef MUST be in the same namespace for this Policy to have
  # effect"). Echo's own namespace is network, and its HTTPRoute is
  # literally named "echo" (confirmed live).
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo
  oidc:
    # No provider.backendRef - authentik.internal.oreillys.io is already a
    # normal Gateway+HTTPRoute+cert-manager-TLS-backed hostname (see
    # kubernetes/apps/authentik/authentik/app/helmrelease.yaml), resolved
    # like any HTTPS request. Matches Envoy Gateway's own canonical docs
    # example, which authenticates against https://accounts.google.com
    # with no backendRef at all. If this doesn't work in practice, the
    # documented fallback is adding backendRef + a ReferenceGrant in the
    # authentik namespace (this repo's first) - not a redesign.
    provider:
      issuer: "https://authentik.internal.oreillys.io/application/o/echo/"
    clientID: "ccf8e9cebe8abbcfd1ba325730f1db15371be26c"
    clientSecret:
      name: echo-oidc-client-secret
    # Envoy Gateway's own callback convention: <route-path-prefix>/oauth2/callback.
    # Must match kubernetes/apps/authentik/authentik/app/blueprints-provider-echo.yaml's
    # redirect_uris exactly.
    redirectURL: "https://echo.internal.oreillys.io/oauth2/callback"
    logoutPath: "/logout"
