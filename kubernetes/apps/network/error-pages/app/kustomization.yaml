---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
# One ConfigMap per status code, not one with 9 keys - Envoy Gateway's
# BackendTrafficPolicy response.body.valueRef expects the ConfigMap to hold
# a single body under the key `response.body` (or falls back to "first
# value" if that key's absent), it doesn't let you pick a key per rule.
# Pages themselves are real output from the error-pages app (l7 theme,
# fetched via `curl -H "Accept: text/html"` against each /<code> path,
# 2026-08-21) - see envoy-gateway/config/envoy.yaml's responseOverride for
# why static content instead of a live fetch (Envoy Gateway's dynamic
# `redirect` action is hard-locked to 301/302 status, confirmed via its
# CRD's kubebuilder validation - no way to get both live content and a
# correct status code without patching Envoy's raw custom_response filter
# directly, which trades correctness for fragility across Envoy Gateway
# upgrades. Chose the boring, fully-supported option instead - refresh
# these files by hand if the theme/content ever needs to change).
configMapGenerator:
  - name: error-pages-400
    files:
      - response.body=./pages/400.html
  - name: error-pages-401
    files:
      - response.body=./pages/401.html
  - name: error-pages-403
    files:
      - response.body=./pages/403.html
  - name: error-pages-404
    files:
      - response.body=./pages/404.html
  - name: error-pages-429
    files:
      - response.body=./pages/429.html
  - name: error-pages-500
    files:
      - response.body=./pages/500.html
  - name: error-pages-502
    files:
      - response.body=./pages/502.html
  - name: error-pages-503
    files:
      - response.body=./pages/503.html
  - name: error-pages-504
    files:
      - response.body=./pages/504.html
generatorOptions:
  disableNameSuffixHash: true
