---
# Reflector "pull" mirror of authentik/burst-sessions-oidc-credentials, the
# client of the burst-sessions provider (blueprints-protected-apps.yaml) that
# signs people in on the coding sessions' routes. As the authentik/protect
# component's oidc-client-secret.yaml; not that component itself, which
# protects one named route at one fixed callback, where sessions' routes come
# and go, each at its own host name.
apiVersion: v1
kind: Secret
metadata:
  name: burst-sessions-oidc-client-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/burst-sessions-oidc-credentials"
type: Opaque
