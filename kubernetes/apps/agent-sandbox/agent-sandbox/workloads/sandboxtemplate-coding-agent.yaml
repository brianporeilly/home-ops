---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/main/k8s/crd/bases/extensions.agents.x-k8s.io_sandboxtemplates.yaml
#
# Reusable template for headless/background coding-agent tasks against
# scratch repos only - see docs/agent-sandbox-plan.md. Deliberately NOT a
# live Sandbox: a running Sandbox is per-task session state, not desired
# config, and doesn't belong in git (this repo's "no live cluster mutation,
# repo/PR changes only" norm).
#
# NOT directly instantiable - confirmed live (2026-09-22): Sandbox has no
# templateRef field, and SandboxClaim requires a warmPoolRef, not a
# template ref. Sandboxes are claimed from sandboxwarmpool-coding-agent.yaml
# (also in this directory) - normally by burst-harness, which owns the whole
# claim lifecycle (docs/agent-sandbox-plan.md "Phase 3"):
#
#   harness --target agent-sandbox --namespace agent-sandbox-system \
#     --pool coding-agent --repo-url https://github.com/<you>/<scratch>.git \
#     run <slug> --task "..."
#
# It creates a labelled SandboxClaim with a lifecycle.shutdownTime deadline
# (shutdownPolicy: Delete, so an orphaned claim is reaped by the controller),
# clones into /workspace/repo, drives the pod over kubectl exec, and deletes
# the claim when the task reaches a terminal state.
#
# Holds NO credentials (Phase 3): the harness passes its git token per
# command and opens PRs from the driver, so nothing in this pod can push or
# exfiltrate a token. The former GIT_TOKEN env + scratch-git secret were
# removed for that reason - the token now lives with the driver
# (kubernetes/apps/agent-runner/burst-harness/app/secret.yaml).
#
# podTemplate.metadata.labels below is set explicitly (rather than relying
# on whatever labels the controller itself stamps on spawned pods) so the
# egress GlobalNetworkPolicy in
# kubernetes/apps/kube-system/calico/policies/globalnetworkpolicy-agent-sandbox-workloads-egress.yaml
# has a stable, self-defined selector to target.
#
# Network: through burst-gateway only (../gateway/). The egress policy lets
# these pods reach its proxy port and nothing else - no DNS, no internet -
# and the gateway refuses a pod the driver has not registered, so a
# claim is used with `gateway_control` set on the driver (harness/
# gateway_control.py). The proxy variables point at the gateway's fixed
# ClusterIP (no DNS to look up its name). burst-sandbox-init trusts the
# gateway's CA at start-up: it writes the system CAs plus BURST_GATEWAY_CA to
# /tmp/burst-harness/ca-bundle.crt, which the TLS variables name. All of it
# is per template, not per claim, so claims still come from the warm pool.
#
# Image: burst-harness-sandbox, built from images/sandbox/Containerfile in
# github.com/brianporeilly/strands-harness - Fedora 44 with git, coreutils,
# python3, nodejs, gcc/make; a pre-baked `agent` user at UID 1000 with a real
# HOME; no credentials and no gh. It is the purpose-built replacement for the
# earlier placeholders: Claude Code's CLI image (no git at all, 2026-09-22)
# and buildpack-deps:noble-scm (git but no language runtime). Its command
# contract with the harness (sh, git, coreutils) is checked at claim time.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: coding-agent
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-workload
        agent-sandbox.internal.oreillys.io/template: coding-agent
    spec:
      # Nothing in a sandbox talks to the apiserver. Confirmed live that the
      # controller already leaves the token unmounted; explicit here so that
      # stays true regardless of controller defaults.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: agent
          image: ghcr.io/brianporeilly/burst-harness-sandbox:sha-41dd580@sha256:cc744897234c58da5f6513e569d87ee9f45ff070a6d2c9926d4e973540cc1dfc
          # `args`, NOT `command`: `command` replaces the image ENTRYPOINT
          # (burst-sandbox-init, which composes ~/.claude.json and
          # ~/.claude/settings.json at start), `args` only replaces its CMD.
          # sleep keeps the pod up to be driven over `kubectl exec`.
          args: ["sleep", "infinity"]
          env:
            - { name: HTTPS_PROXY, value: "http://10.248.0.128:3128" }
            - { name: https_proxy, value: "http://10.248.0.128:3128" }
            - { name: HTTP_PROXY, value: "http://10.248.0.128:3128" }
            - { name: http_proxy, value: "http://10.248.0.128:3128" }
            - { name: NO_PROXY, value: "localhost,127.0.0.1" }
            - { name: no_proxy, value: "localhost,127.0.0.1" }
            # Node's own fetch ignores the proxy variables unless told otherwise.
            - { name: NODE_USE_ENV_PROXY, value: "1" }
            - { name: BURST_GATEWAY_CA, value: /etc/burst-gateway/ca.crt }
            - { name: SSL_CERT_FILE, value: /tmp/burst-harness/ca-bundle.crt }
            - { name: REQUESTS_CA_BUNDLE, value: /tmp/burst-harness/ca-bundle.crt }
            - { name: CURL_CA_BUNDLE, value: /tmp/burst-harness/ca-bundle.crt }
            - { name: GIT_SSL_CAINFO, value: /tmp/burst-harness/ca-bundle.crt }
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/burst-gateway/ca.crt }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: gateway-ca
              mountPath: /etc/burst-gateway
              readOnly: true
      volumes:
        # The gateway's CA certificate only; its key stays with the gateway.
        - name: gateway-ca
          secret:
            secretName: burst-gateway-ca
            items:
              - key: tls.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 10Gi
