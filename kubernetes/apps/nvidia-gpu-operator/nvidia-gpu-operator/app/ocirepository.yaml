---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: nvidia-gpu-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Pinned below 26.7.0 - that version's ClusterPolicy never goes Ready on
    # this cluster (driver.enabled: false, toolkit.enabled: false - driver is
    # host-managed by Flatcar's nvidia.service). The cuda-validator init
    # container crash-loops with "ERROR: driverInitFileInfo 578 result=11"
    # until Helm's timeout gives up and rolls back; not GPU resource
    # contention (reproduces with the only GPU workload scaled to 0).
    # Leading theory: 26.7.0 bumped the chart's default driver.version
    # (580.126.20 -> 595.91.07) and something checks/expects that version
    # even with driver.enabled: false, while the host driver stays at
    # 580.105.08. Renovate is paused on this package in renovate.json until
    # root-caused - re-enable once resolved, don't just bump the pin back
    # up without re-testing.
    tag: 26.3.3
  url: oci://ghcr.io/home-operations/charts-mirror/nvidia-gpu-operator
