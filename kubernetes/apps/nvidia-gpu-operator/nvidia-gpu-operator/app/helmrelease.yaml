---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: nvidia-gpu-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    platform:
      openshift: false
    nfd:
      enabled: true
      nodefeaturerules: false
    driver:
      enabled: false
    toolkit:
      enabled: false
    cdi:
      enabled: true
    dcgmExporter:
      enabled: false
    psa:
      enabled: false
    # Chart defaults tolerate/prefer control-plane (stale from when CP had
    # GPUs); steer away from GPU nodes instead, kept free for GPU workloads.
    # Affinity override must be non-empty to take effect - empty falls back
    # to the chart default.
    operator:
      tolerations: []
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values: ["true"]
    node-feature-discovery:
      master:
        tolerations: []
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                preference:
                  matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: NotIn
                      values: ["true"]
