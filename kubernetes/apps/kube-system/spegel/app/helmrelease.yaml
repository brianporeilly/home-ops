---
# yaml-language-server: $schema=https://raw.githubusercontent.com/spegel-org/spegel/main/charts/spegel/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      # Chart dashboard hardcodes ${DS_PROMETHEUS} (an export input the sidecar
      # can't bind), so panels + $pod/$registry vars error out. We ship a
      # corrected copy in ./dashboard.yaml instead.
      enabled: false
    spegel:
      containerdSock: /run/containerd/containerd.sock
      containerdRegistryConfigPath: /etc/containerd/certs.d
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 256Mi
