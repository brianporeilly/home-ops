---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reflector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: reflector
    # Original 32Mi/128Mi sizing was set when Reflector only mirrored one
    # secret; it now watches secrets/configmaps/namespaces cluster-wide
    # across ~8 mirrored OIDC credentials (protect component + native
    # apps) - confirmed OOMKilled at 118Mi actual usage against the old
    # 128Mi limit (2026-08-19). Sized with real headroom, not just
    # enough to clear the current usage.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
