---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip-cloud-provider
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip-cloud-provider
      version: 0.2.10
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    cm:
      data:
        # 10.21.0.0/16 replaced the old 10.20.250.0/24 pool - that range was
        # a sub-range of a host's own local subnet (10.20.0.0/16), so every
        # client's kernel treated it as on-link, but kube-vip's LB VIPs are
        # BGP-only (vip_arp: false, see the kube-vip HelmRelease) and were
        # never actually guaranteed L2/ARP-reachable - a host that isn't
        # L2-adjacent to whichever node currently holds a VIP couldn't ARP
        # for it despite its own route saying on-link. 10.21.0.0/16 is
        # deliberately off-link from 10.20.0.0/16 instead, so it's always
        # routed via the default gateway, no ARP dependency. Every service
        # was migrated off the old pool before it was removed here -
        # confirmed live, nothing left on 10.20.250.0/24.
        #
        # Requires an OPNsense static route (10.21.0.0/16 via 10.2.0.2,
        # mirroring the existing 10.20.0.0/16 one) - not tracked in this
        # repo, applied directly in OPNsense. No Mikrotik-side change
        # needed: its BGP peer filters are unrestricted, so it accepts
        # whatever kube-vip advertises here.
        cidr-global: 10.21.0.0/16