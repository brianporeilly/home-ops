---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calico
  namespace: kube-system # ks object stays here so other apps' dependsOn refs resolve
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Deliberately NO dependsOn - this was copy-pasted from the standard
  # "new app" template default (envoy-gateway-config + rook-ceph-cluster)
  # without adapting it, which is backwards for the CNI itself: Ceph needs
  # working pod networking to come up, and Envoy Gateway needs the CNI to
  # route anything - neither can be a real prerequisite for Calico.
  # Real incident (2026-08-23, docs/incident-2026-08-23-dns-outage.md):
  # rook-ceph-cluster stalled on an unrelated Flux/DNS issue, which
  # transitively blocked calico-policies (dependsOn: calico) from
  # promoting allow-dns-ingress - the exact policy needed to fix DNS in
  # the first place. Self-inflicted deadlock, only escapable by a manual
  # kubectl apply bypassing Flux entirely. Keep this Kustomization
  # dependency-free so it can never be held hostage by something
  # downstream of it in the actual dependency direction.
  interval: 1h
  path: ./kubernetes/apps/kube-system/calico/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Install into tigera-operator ns (Calico standard) so Flux ADOPTS the bootstrap
  # release (tigera-operator/tigera-operator) instead of forking a duplicate in
  # kube-system. Cluster-scoped CRs here (Installation/APIServer/Goldmane/Whisker)
  # ignore targetNamespace. See tigera-operator-namespace-rbac-loop memory.
  targetNamespace: tigera-operator
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Sibling, not nested in app/ - GlobalNetworkPolicy/StagedGlobalNetworkPolicy
# objects (docs/network-policy-plan.md) have a much faster edit cadence than
# the Calico install itself and are cluster-scoped like the CRs in app/, so
# targetNamespace is a formality here too. See the rook-ceph app/cluster
# split (CLAUDE.md) for the general pattern this follows.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calico-policies
  namespace: kube-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: calico-policies
  dependsOn:
    - name: calico
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/kube-system/calico/policies
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: tigera-operator
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Sibling, not nested in app/ or policies/ - unlike those two, this targets
# calico-system for real (see route/httproute.yaml's comment for why:
# the operator always places the actual `whisker` Service there regardless
# of what the other two Kustomizations' targetNamespace says, so the
# HTTPRoute/SecurityPolicy/Secret here need to land in the same namespace
# to actually reference it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &whiskerRoute calico-whisker-route
  namespace: kube-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *whiskerRoute
  components:
    - ../../../../components/authentik/protect
  dependsOn:
    - name: calico
      namespace: kube-system
    # protect's Reflector mirror lost this exact race on whisker's own
    # rollout - see kubernetes/apps/download/lidarr/ks.yaml for the incident.
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/kube-system/calico/route
  postBuild:
    substitute:
      APP: whisker
      HTTPROUTE_NAME: whisker
      HOSTNAME: whisker.internal.oreillys.io
      AUTH_HOSTNAME: auth.internal.oreillys.io
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: calico-system
  timeout: 5m
  wait: false
