---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.tigera.io/installation_v1.json
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  variant: Calico
  calicoNetwork:
    bgp: Enabled
    hostPorts: Enabled
    ipPools:
      - name: default-ipv4-ippool
        blockSize: 26
        cidr: 10.246.0.0/16
        encapsulation: VXLANCrossSubnet
        natOutgoing: Enabled
        nodeSelector: all()
    # Use the node's Kubernetes InternalIP (the kubelet node IP) rather than
    # "first-found": on nodes currently holding kube-vip VIPs (10.20.250.0/24
    # LoadBalancer VIPs, 10.20.254.100 control-plane VIP) bound to the primary
    # NIC, first-found can select a VIP as the node's Calico address, which
    # mis-sources BGP and leaves BIRD sessions stuck in Connect (cluster-wide
    # pod-network partition after such a node reboots).
    nodeAddressAutodetectionV4:
      kubernetes: NodeInternalIP
    linuxDataplane: Iptables
  cni:
    type: Calico
    ipam:
      type: Calico
  controlPlaneReplicas: 2
  nonPrivileged: Disabled
  nodeUpdateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
