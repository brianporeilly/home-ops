---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline - closes the
# `network`-as-destination gap left open by step 4's `allow-misc-to-network`.
# Real LAN client traffic (browsers etc.) reaches envoy-internal directly -
# it's the ingress point, so this is "who's allowed to even attempt a
# connection," not app-level auth (that's SSO/native accounts per app).
#
# Source is the whole `10.20.0.0/16` LAN (docs/node-inventory.md's
# addressing plan - covers the DHCP client pool, NAS, and infra tiers
# alike), not Whisker's coarser "PRIVATE NETWORK" bucket - deliberately
# broad here since "any trusted-LAN device can reach envoy-internal" is the
# actual intended behavior for anything named "internal", not an oversight.
#
# Destination scoped to envoy-internal's pods specifically (by
# owning-gateway-name), not "all of network" or "all envoy proxy pods" -
# envoy-external shouldn't accept LAN-sourced traffic under this rule, it
# gets its own narrower one below.
#
# Ports are envoy-internal's real container ports (Service targetPort, not
# the Gateway-level 80/443/22) - confirmed live via `kubectl get svc -n
# network envoy-internal -o jsonpath='{.spec.ports}'`, not guessed from the
# Gateway API listener config: 10080 (http), 10443 (https), 10022 (forgejo
# SSH TCPRoute).
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-lan-to-envoy-internal
spec:
  stagedAction: Set
  selector: gateway.envoyproxy.io/owning-gateway-name == 'envoy-internal'
  namespaceSelector: kubernetes.io/metadata.name == 'network'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 10.20.0.0/16
      destination:
        ports: [10080, 10443, 10022]
