---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 1 of docs/network-policy-plan.md's proposed baseline - staged (log-only,
# never enforces) on purpose, same as every policy in this rollout. Confirmed
# via real flow data (Whisker/Goldmane) that every namespace queries coredns
# on udp/53 - this is the one rule that has to exist before any namespace can
# safely get a default-deny-ingress policy, since kube-system would otherwise
# have no way to distinguish it from any other traffic.
#
# Promote to a real GlobalNetworkPolicy (stagedAction removed, kind changed)
# once Whisker shows zero unexpected pending_actions against this rule after
# a representative window - see the doc for the full rollout order.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-dns-ingress
spec:
  stagedAction: Set
  # Scoped to the real coredns pods specifically (not just anything carrying
  # k8s-app=kube-dns in some other namespace) - selector alone on a
  # GlobalNetworkPolicy matches across all namespaces by default.
  selector: k8s-app == 'kube-dns'
  namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        ports: [53]
