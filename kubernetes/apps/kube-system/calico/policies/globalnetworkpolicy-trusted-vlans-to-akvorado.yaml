---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Network gear (switch/router/OPNsense) streams NetFlow/IPFIX to Akvorado's
# inlet. Narrower than the envoy-internal/envoy-external trusted-VLAN list
# on purpose: only `10.10.0.0/16` and `10.20.0.0/16` have anything that
# actually sends flow data here - notably NOT just `10.20.0.0/16` alone: the
# primary switch's own
# management IP is `10.10.0.1` (docs/network-observability-plan.md), a
# different VLAN entirely, so a servers-VLAN-only rule would have missed
# the actual switch traffic.
#
# `10.2.0.1/32` (OPNsense's own transit address, same one trusted for XFF
# in envoy-external's ClientTrafficPolicy) is also a real NetFlow source
# here - OPNsense sends its own flow data directly, not just switches -
# and isn't in either VLAN block above, so it needs its own line.
#
# Destination scoped to the inlet DaemonSet specifically
# (`app.kubernetes.io/controller: inlet` - akvorado has other controllers
# sharing app.kubernetes.io/name in the same namespace) on its real
# collector port.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-akvorado
spec:
  selector: app.kubernetes.io/name == 'akvorado' && app.kubernetes.io/controller == 'inlet'
  namespaceSelector: kubernetes.io/metadata.name == 'observability'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: UDP
      source:
        nets:
          - 10.2.0.1/32
          - 10.10.0.0/16
          - 10.20.0.0/16
      destination:
        ports: [2055]
