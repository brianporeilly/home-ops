---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline - the external
# counterpart to allow-lan-to-envoy-internal.
#
# Real internet clients never appear as their own IP at the Calico/L3
# level: OPNsense NATs all internet-bound traffic before it reaches the
# cluster (confirmed already in envoy.yaml's own ClientTrafficPolicy
# comment - "envoy-external sits behind exactly one trusted hop (OPNsense,
# which NATs internet traffic...)"), so the only source Calico will ever
# see for genuine external traffic is OPNsense's transit address itself,
# not "the whole internet". Same address already trusted for XFF purposes
# in envoy-external's ClientTrafficPolicy (`trustedCIDRs: 10.2.0.1/32`) and
# independently confirmed as OPNsense's own address elsewhere (CrowdSec
# LAPI at `10.2.0.1:8080`, docs/migration-inventory.md) - much narrower and
# more precise than allowing Whisker's coarser "PUBLIC NETWORK" bucket.
#
# Destination scoped to envoy-external specifically (not envoy-internal -
# see the sibling policy). Ports: envoy-external's real container ports
# (Service targetPort), confirmed live the same way as envoy-internal - no
# SSH port here, external doesn't expose it.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-opnsense-to-envoy-external
spec:
  stagedAction: Set
  selector: gateway.envoyproxy.io/owning-gateway-name == 'envoy-external'
  namespaceSelector: kubernetes.io/metadata.name == 'network'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 10.2.0.1/32
      destination:
        ports: [10080, 10443]
