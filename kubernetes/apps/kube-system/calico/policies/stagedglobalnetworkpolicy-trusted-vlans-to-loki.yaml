---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline. Trusted-VLAN
# devices push logs directly to Loki's HTTP API (e.g. the NAS's Alloy
# agent, NAS lives in the servers VLAN per docs/node-inventory.md) - real,
# observed flow data. Same trusted-VLAN list as
# allow-trusted-vlans-to-envoy-internal (see that file for the full
# rationale), not Whisker's coarser "PRIVATE NETWORK" bucket and not just
# `10.20.0.0/16` alone - other trusted-VLAN devices could plausibly push
# logs too, and there's no cost to allowing the same set consistently.
#
# Destination scoped to the loki `single-binary` pod specifically
# (excludes loki-canary, a separate pod sharing app.kubernetes.io/name)
# and its real push/query port, not a blanket allow into `observability`.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-loki
spec:
  stagedAction: Set
  selector: app.kubernetes.io/name == 'loki' && app.kubernetes.io/component == 'single-binary'
  namespaceSelector: kubernetes.io/metadata.name == 'observability'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 10.10.0.0/16
          - 10.20.0.0/16
          - 10.30.0.0/16
          - 10.40.0.0/16
      destination:
        ports: [3100]
