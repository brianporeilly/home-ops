---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Envoy Gateway (envoy-internal/envoy-external, both in the network
# namespace) is a wide fan-out - it routes HTTPRoute traffic to backend
# Services across nearly every namespace.
#
# Deliberately broad: selector all() + source
# namespaceSelector network, no per-app port list. An overly-broad ALLOW
# is harmless on its own (allow rules only ever widen access; the
# default-deny baseline in a later step is what actually narrows things) -
# narrowing this to per-app ports is a refinement to make once staged data
# (now easy to check via the whisker.internal.oreillys.io route) shows
# what's actually needed, not something to guess up front.
#
# TCP-only: http3/QUIC is commented out in envoy.yaml's ClientTrafficPolicy
# (not enabled), so there's no UDP listener traffic to allow for here.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-network-ingress
spec:
  selector: all()
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'network'
