---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Every namespace queries coredns on udp/53 - this rule must exist before
# any namespace can safely get a default-deny-ingress policy, since
# kube-system would otherwise have no way to distinguish it from any other
# traffic.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-dns-ingress
spec:
  # Scoped to the real coredns pods specifically (not just anything carrying
  # k8s-app=kube-dns in some other namespace) - selector alone on a
  # GlobalNetworkPolicy matches across all namespaces by default.
  selector: k8s-app == 'kube-dns'
  namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]
    - action: Allow
      protocol: TCP
      destination:
        ports: [53]
