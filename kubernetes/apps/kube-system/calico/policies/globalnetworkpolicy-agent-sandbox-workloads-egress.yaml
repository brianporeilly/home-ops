---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Enforcing from day one - see globalnetworkpolicy-agent-sandbox-controller-egress.yaml
# for the full rationale (new namespace, no legacy traffic, deliberately
# ahead of the fleet-wide staged rollout).
#
# Selector matches the label set explicitly in podTemplate.metadata.labels
# of kubernetes/apps/agent-sandbox/agent-sandbox/workloads/sandboxtemplate-coding-agent.yaml
# (chosen deliberately so this policy has a stable target regardless of
# whatever labels the agent-sandbox controller itself stamps on spawned
# pods).
#
# Sandboxes reach burst-gateway's proxy port and nothing else
# (kubernetes/apps/agent-sandbox/agent-sandbox/gateway/, ROADMAP phase 6 in
# strands-harness). The gateway decides, per sandbox, what is let through,
# records every request, and adds credentials the sandbox never holds; this
# policy is what makes it the only way out. No DNS either: software using
# the proxy never resolves a name itself, and kube-dns forwarding outside
# names would be a way out of its own. The control port (8081) is not
# allowed: a sandbox must not be able to register itself.
#
# Replaced (2026-10-21) DNS plus HTTPS to any public address.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-agent-sandbox-workloads-egress
spec:
  selector: app.kubernetes.io/name == 'agent-sandbox-workload'
  namespaceSelector: kubernetes.io/metadata.name == 'agent-sandbox-system'
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        selector: app.kubernetes.io/name == 'burst-gateway'
        namespaceSelector: kubernetes.io/metadata.name == 'agent-sandbox-system'
        ports: [3128]
