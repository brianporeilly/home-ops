---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# CloudNativePG's operator (`database`) reaches every instance it manages
# on tcp/8000 (the instance manager's own API, used for health/status/backup
# coordination) - spans nearly every namespace with a database (authentik,
# home, immich, misc), unlike mariadb's single grimmory instance
# (allow-database-to-media). Not a small, fixed set of pairs, so this is
# modeled source-scoped-only like allow-apiserver-webhooks/allow-spegel-mirror
# instead of one rule per managed instance.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-postgres-operator-webhook
spec:
  selector: all()
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: app.kubernetes.io/name == 'cloudnative-pg'
        namespaceSelector: kubernetes.io/metadata.name == 'database'
      destination:
        ports: [8000]
