---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# mariadb-operator (runs in `database`) manages grimmory-mariadb (lives in
# `media`) - the operator pattern: the CRD/StatefulSet lives with the app,
# the operator itself is centralized in `database`. Unlike
# allow-network-ingress/allow-observability-ingress, this is a narrow pair
# - scoped to the exact source/dest pods and port, not a whole-namespace
# allow.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-database-to-media
spec:
  selector: app.kubernetes.io/instance == 'grimmory-mariadb' && app.kubernetes.io/name == 'mariadb'
  namespaceSelector: kubernetes.io/metadata.name == 'media'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: app.kubernetes.io/name == 'mariadb-operator'
        namespaceSelector: kubernetes.io/metadata.name == 'database'
      destination:
        ports: [3306]
