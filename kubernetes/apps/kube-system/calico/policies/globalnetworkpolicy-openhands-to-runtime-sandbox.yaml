---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# openhands (`ai`) talks to each conversation's spawned runtime pod
# (`openhands-runtime`) over its execution-server service - cross-
# namespace, so the enforcing-since-2026-08-23 same-namespace-only ingress
# default (docs/network-policy-plan.md) doesn't cover it. Same shape as
# allow-paperless-to-llama-cpp/allow-changedetection-to-llama-cpp. See
# docs/agent-sandbox-plan.md Phase 2.
#
# Port 8080 only - KubernetesRuntime's own hardcoded container_port
# (kubernetes_runtime.py). Not 8081 (vscode) or the 30082/30083 app ports:
# those are for a human's browser or the agent's own browser tool to reach
# directly, not this controller pod.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-openhands-to-runtime-sandbox
spec:
  selector: app == 'openhands-runtime'
  namespaceSelector: kubernetes.io/metadata.name == 'openhands-runtime'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: app.kubernetes.io/name == 'openhands'
        namespaceSelector: kubernetes.io/metadata.name == 'ai'
      destination:
        ports: [8080]
