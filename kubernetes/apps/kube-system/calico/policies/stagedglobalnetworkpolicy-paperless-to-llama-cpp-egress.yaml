---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Egress mirror of globalnetworkpolicy-paperless-to-llama-cpp.yaml. Added
# anticipatorily alongside the AI-suggestions feature turn-up, not from
# observed pending-diff data like the rest of docs/egress-policy-plan.md -
# there's no traffic yet since this is a new integration. Same shape as
# allow-changedetection-to-llama-cpp-egress.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-paperless-to-llama-cpp-egress
spec:
  stagedAction: Set
  selector: app.kubernetes.io/name == 'paperless-ngx'
  namespaceSelector: kubernetes.io/metadata.name == 'home'
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      destination:
        selector: app.kubernetes.io/name == 'llama-cpp'
        namespaceSelector: kubernetes.io/metadata.name == 'ai'
        ports: [8080]
