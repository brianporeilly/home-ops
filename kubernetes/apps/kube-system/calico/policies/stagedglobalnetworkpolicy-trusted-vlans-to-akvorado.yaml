---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline. Network gear
# (switch/router/OPNsense) streams NetFlow/IPFIX to Akvorado's inlet -
# real, observed flow data. Same trusted-VLAN list as
# allow-trusted-vlans-to-envoy-internal (see that file for the full
# rationale) - notably NOT just `10.20.0.0/16` (the servers VLAN): the
# primary switch's own management IP is `10.10.0.1`
# (docs/network-observability-plan.md), a different VLAN entirely, so a
# servers-VLAN-only rule would have missed the actual switch traffic.
#
# Destination scoped to the inlet DaemonSet specifically
# (`app.kubernetes.io/controller: inlet` - akvorado has other controllers
# sharing app.kubernetes.io/name in the same namespace) on its real
# collector port.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-akvorado
spec:
  stagedAction: Set
  selector: app.kubernetes.io/name == 'akvorado' && app.kubernetes.io/controller == 'inlet'
  namespaceSelector: kubernetes.io/metadata.name == 'observability'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: UDP
      source:
        nets:
          - 10.10.0.0/16
          - 10.20.0.0/16
          - 10.30.0.0/16
          - 10.40.0.0/16
      destination:
        ports: [2055]
