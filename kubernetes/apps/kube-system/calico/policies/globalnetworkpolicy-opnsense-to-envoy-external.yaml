---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# External counterpart to allow-trusted-vlans-to-envoy-internal.
#
# Source can't be scoped to `10.2.0.1/32` (OPNsense's own transit address)
# on the assumption that OPNsense NATs (masquerades) all internet-bound
# traffic - it doesn't for this path. OPNsense's port-forward does
# destination NAT only, not source NAT, so real client IPs arrive intact;
# consistent with `10.21.0.0/16` (the LoadBalancer pool) being routed
# rather than bridged (docs/node-inventory.md), which doesn't require
# masquerading the source to route the return path correctly.
#
# So the source really is unbounded ("the whole internet"), and that's
# correct/intentional for this one specific destination - envoy-external's
# entire purpose is public exposure, TLS/HSTS/rate-limiting are already
# configured for exactly this. `nets: [0.0.0.0/0]` is the honest way to
# say that, not a narrowing mistake - the actual narrowing that matters
# here is by destination (only envoy-external's specific pods/ports), not
# by source, since an internet-facing gateway's whole job is accepting
# arbitrary source IPs.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-opnsense-to-envoy-external
spec:
  selector: gateway.envoyproxy.io/owning-gateway-name == 'envoy-external'
  namespaceSelector: kubernetes.io/metadata.name == 'network'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 0.0.0.0/0
      destination:
        ports: [10080, 10443]
