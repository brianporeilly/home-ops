---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# burst-harness (`agent-runner`) calls llama-cpp (`ai`) when run with
# HARNESS_PROVIDER=llamacpp. Same shape as allow-paperless-to-llama-cpp.
# Sandboxes (agent-sandbox-system) deliberately get no such rule: model
# calls come from the driver, never from inside a sandbox.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-agent-runner-to-llama-cpp
spec:
  selector: app.kubernetes.io/name == 'llama-cpp'
  namespaceSelector: kubernetes.io/metadata.name == 'ai'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: app.kubernetes.io/name == 'burst-harness'
        namespaceSelector: kubernetes.io/metadata.name == 'agent-runner'
      destination:
        ports: [8080]
