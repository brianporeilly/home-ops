---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_stagedglobalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline. Network gear
# streams syslog to fluent-bit's syslog listener - real, observed flow
# data. Narrower than the envoy-internal/envoy-external trusted-VLAN list
# on purpose (confirmed 2026-08-22): only `10.10.0.0/16` and `10.20.0.0/16`
# have anything that actually sends syslog here - same reasoning as the
# akvorado sibling policy on why this isn't the full trusted-VLAN set.
#
# `10.2.0.1/32` (OPNsense's own transit address) is also a real syslog
# source here - OPNsense sends its own logs directly - and isn't in either
# VLAN block above, so it needs its own line.
apiVersion: projectcalico.org/v3
kind: StagedGlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-fluent-bit
spec:
  stagedAction: Set
  selector: app.kubernetes.io/name == 'fluent-bit'
  namespaceSelector: kubernetes.io/metadata.name == 'observability'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: UDP
      source:
        nets:
          - 10.2.0.1/32
          - 10.10.0.0/16
          - 10.20.0.0/16
      destination:
        ports: [5514]
