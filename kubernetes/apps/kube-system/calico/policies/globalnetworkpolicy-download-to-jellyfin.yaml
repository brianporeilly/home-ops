---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# sonarr's "notify Jellyfin" webhook (library refresh on import) was being
# blocked - the baseline has no ingress exception for `download` -> `media`.
# Source is
# the whole `download` namespace rather than just sonarr, since radarr/
# lidarr/bazarr use the same webhook notification pattern to Jellyfin;
# destination stays narrow to just jellyfin, not all of `media`, since
# nothing else there needs this.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-download-to-jellyfin
spec:
  selector: app.kubernetes.io/name == 'jellyfin'
  namespaceSelector: kubernetes.io/metadata.name == 'media'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'download'
      destination:
        ports: [8096]
