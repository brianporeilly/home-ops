---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Closes the `network`-as-destination gap: real client traffic (browsers
# etc.) reaches envoy-internal directly as the ingress point, so this is
# "who's allowed to even attempt a connection," not app-level auth (that's
# SSO/native accounts per app).
#
# Source is an explicit list of trusted VLANs, not "the whole LAN" -
# `10.20.0.0/16` is specifically the *servers* VLAN (cluster nodes, NAS,
# infra tiers - see docs/node-inventory.md), not a general client network,
# and `10.0.0.0/8` would be far too broad. Also includes `10.10.0.0/16`,
# `10.30.0.0/16`, `10.40.0.0/16`. `10.60.0.0/16` (IoT/devices) deliberately
# excluded - undecided whether it needs access, revisit once settled. Any
# other VLAN currently reaching the cluster only does so because upstream
# network ACLs (OPNsense) haven't been built yet, not included here either.
#
# Destination scoped to envoy-internal's pods specifically (by
# owning-gateway-name), not "all of network" or "all envoy proxy pods" -
# envoy-external gets its own policy (allow-trusted-vlans-to-envoy-external)
# for the split-DNS case, plus allow-opnsense-to-envoy-external for genuine
# internet-sourced traffic.
#
# Ports are envoy-internal's real container ports (Service targetPort, not
# the Gateway-level 80/443/22): 10080 (http), 10443 (https), 10022
# (forgejo SSH TCPRoute).
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-envoy-internal
spec:
  selector: gateway.envoyproxy.io/owning-gateway-name == 'envoy-internal'
  namespaceSelector: kubernetes.io/metadata.name == 'network'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 10.10.0.0/16
          - 10.20.0.0/16
          - 10.30.0.0/16
          - 10.40.0.0/16
      destination:
        ports: [10080, 10443, 10022]
