---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_globalnetworkpolicies.yaml
# Step 6 of docs/network-policy-plan.md's proposed baseline - closes the
# `network`-as-destination gap left open by step 4's `allow-misc-to-network`.
# Real client traffic (browsers etc.) reaches envoy-internal directly -
# it's the ingress point, so this is "who's allowed to even attempt a
# connection," not app-level auth (that's SSO/native accounts per app).
#
# Source is an explicit list of trusted VLANs, not "the whole LAN" -
# `10.20.0.0/16` is specifically the *servers* VLAN (cluster nodes, NAS,
# infra tiers - see docs/node-inventory.md), not a general client network,
# and `10.0.0.0/8` would be far too broad. Confirmed live (2026-08-22)
# which other VLANs should actually reach envoy-internal:
# `10.10.0.0/16`, `10.30.0.0/16`, `10.40.0.0/16`. `10.60.0.0/16` (IoT/
# devices) deliberately excluded for now - undecided whether it needs
# access at all, revisit once that's settled. Any other VLAN currently
# reaching the cluster only does so because upstream network ACLs
# (OPNsense) haven't been built yet, not because it's actually meant to -
# not included here either.
#
# `10.100.0.0/16` added 2026-08-29 - WireGuard client subnet. Traffic to
# envoy-internal isn't NATed by OPNsense (unlike envoy-external's
# internet-sourced traffic), so it arrives here with the client's real
# WireGuard-assigned source IP, not OPNsense's own transit address -
# needs its own explicit entry rather than relying on
# allow-opnsense-to-envoy-external's pattern.
#
# Destination scoped to envoy-internal's pods specifically (by
# owning-gateway-name), not "all of network" or "all envoy proxy pods" -
# envoy-external shouldn't accept this traffic under this rule, it gets
# its own policy (allow-trusted-vlans-to-envoy-external) for the
# split-DNS case, plus allow-opnsense-to-envoy-external for genuine
# internet-sourced traffic.
#
# Ports are envoy-internal's real container ports (Service targetPort, not
# the Gateway-level 80/443/22) - confirmed live via `kubectl get svc -n
# network envoy-internal -o jsonpath='{.spec.ports}'`, not guessed from the
# Gateway API listener config: 10080 (http), 10443 (https), 10022 (forgejo
# SSH TCPRoute).
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: allow-trusted-vlans-to-envoy-internal
spec:
  selector: gateway.envoyproxy.io/owning-gateway-name == 'envoy-internal'
  namespaceSelector: kubernetes.io/metadata.name == 'network'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets:
          - 10.10.0.0/16
          - 10.20.0.0/16
          - 10.30.0.0/16
          - 10.40.0.0/16
          - 10.100.0.0/16
      destination:
        ports: [10080, 10443, 10022]
