---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Master aggregates worker-reported features and applies node labels via
    # the API - single replica is fine, it's not on any hot path.
    master:
      replicaCount: 1
    # Worker runs on every schedulable (non-tainted) node by default - CP
    # nodes are tainted NoSchedule (see docs/node-inventory.md) and get
    # skipped automatically, which is fine, we only care about worker
    # hardware here. Default PCI source config already whitelists display
    # controllers (class 03xx), which is what actually matters for this -
    # detecting Intel iGPU presence (feature.node.kubernetes.io/pci-0300_8086.present)
    # for Jellyfin's Quick Sync node affinity, without hardcoding node names.
    worker:
      config:
        sources:
          pci:
            deviceClassWhitelist:
              - "03"
            deviceLabelFields:
              - class
              - vendor
