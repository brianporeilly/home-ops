---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.8.2
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      address: "10.20.254.100"
    env:
      vip_interface: "eno1"
      lb_port: "6443"
      vip_bgp: "true"
      vip_subnet: "24"
      cp_enable: "false"
      svc_enable: "true"