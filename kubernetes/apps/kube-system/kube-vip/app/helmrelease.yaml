---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.9.9
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      address: "10.20.254.100"
    env:
      cp_enable: "true"
      cp_namespace: "kube-system"
      svc_enable: "true"
      vip_arp: "false"
      vip_ddns: "false"
      vip_interface: ""
      # /32 host routes (correct for BGP mode). "16" bound each VIP as a /16 on
      # the node NIC, so the node holding the VIPs picked a VIP (e.g. the CP VIP
      # 10.20.254.100) as its source IP for all 10.20.0.0/16 egress — which
      # blackholed Calico node-mesh BGP and API/typha traffic and partitioned
      # that node's pod network after a reboot.
      vip_subnet: "32"
      bgp_enable: "true"
      bgp_as: "65001"
      bgp_peeraddress: "10.20.0.1"
      bgp_peeras: "65000"
      bgp_holdtimer: "30"
      bgp_keepalive: "10"

    envValueFrom:
      bgp_routerid:
        fieldRef:
          fieldPath: status.podIP