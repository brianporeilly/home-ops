---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    # Don't gate the reconcile on the DaemonSet rollout: kube-vip is network-critical
    # and a NotReady node would wedge the upgrade (timeout -> rollback -> Stalled),
    # blocking the very component that fixes API VIP connectivity. Apply and let the
    # DaemonSet roll in the background.
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  # LoadBalancer service VIPs only (worker nodes only, via kube-vip-cloud-provider).
  # The control-plane API VIP (10.20.254.100) is NOT managed here - see the
  # kube-vip-cp release, which is nodeSelector'd to control-plane nodes and uses
  # leader election so exactly one node binds/advertises the API VIP.
  #
  # Pinned to worker nodes (affinity: DoesNotExist control-plane) so the two
  # kube-vip releases never peer with the router from the same source IP: the
  # router only keeps one BGP session per neighbor, so if both ran on
  # control-plane nodes the services release always wins and kube-vip-cp can
  # never establish BGP. The workers must be registered as BGP peers on the
  # router (10.20.0.1, AS 65001) so the LoadBalancer VIPs stay announced once
  # the CP-node sessions are gone.
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    env:
      cp_enable: "false"
      svc_enable: "true"
      svc_election: "true"
      lb_enable: "false"
      vip_arp: "false"
      vip_ddns: "false"
      vip_interface: ""
      # /32 host routes (correct for BGP mode). "16" bound each VIP as a /16 on
      # the node NIC, so the node holding the VIPs picked a VIP as its source IP
      # for all 10.20.0.0/16 egress - which blackholed Calico node-mesh BGP and
      # API/typha traffic and partitioned that node's pod network after a reboot.
      vip_subnet: "32"
      bgp_enable: "true"
      bgp_as: "65001"
      bgp_peeraddress: "10.20.0.1"
      bgp_peeras: "65000"
      bgp_holdtimer: "30"
      bgp_keepalive: "10"
    envValueFrom:
      bgp_routerid:
        fieldRef:
          fieldPath: status.podIP