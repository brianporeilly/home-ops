---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      address: "10.20.254.100"
    env:
      cp_enable: "true"
      cp_namespace: "kube-system"
      svc_enable: "true"
      vip_arp: "false"
      vip_ddns: "false"
      vip_interface: ""
      vip_subnet: "16"
      bgp_enable: "true"
      bgp_as: "65001"
      bgp_peeraddress: "10.20.0.1"
      bgp_peeras: "65000"
      bgp_holdtimer: "3"
      bgp_keepalive: "1"

    envValueFrom:
      bgp_routerid:
        fieldRef:
          fieldPath: status.podIP