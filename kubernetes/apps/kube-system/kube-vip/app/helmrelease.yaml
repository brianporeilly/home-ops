---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      address: "10.20.254.100"
    env:
      vip_interface: "lo"
      lb_port: "6443"
      vip_arp: "false"
      vip_bgp: "true"
      vip_subnet: "16"
      cp_enable: "false"
      svc_enable: "true"
      bgp_peeraddress: "10.20.0.1"
      bgp_peeras: "65000"

    envValueFrom:
      bgp_routerid:
        fieldRef:
          fieldPath: status.podIP