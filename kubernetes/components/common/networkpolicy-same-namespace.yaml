---
# yaml-language-server: $schema=https://raw.githubusercontent.com/projectcalico/calico/master/libcalico-go/config/crd/crd.projectcalico.org_networkpolicies.yaml
# A GlobalNetworkPolicy with `selector: all()` (used for the "wide
# fan-out" rules) claims every endpoint in the cluster for ingress-policy
# purposes - once that happens, Calico stops falling back to the
# permissive per-namespace `kns.<ns>` Profile for ANY pod, even for
# traffic the fan-out rules were never meant to cover, silently denying
# ordinary same-namespace traffic (app -> its own DB, sidecars, etc.)
# unless something explicitly allows it first.
#
# Namespaced NetworkPolicy, not Global, deliberately: Calico's "no
# namespaceSelector on a source = same namespace as the policy" default
# only exists for namespaced NetworkPolicy - GlobalNetworkPolicy has no
# home namespace of its own to default to, and there's no selector syntax
# for "same namespace as the destination endpoint". This component is
# already included in every app namespace's kustomization.yaml (see
# namespace.yaml, sops/ alongside this file) and has no explicit
# metadata.namespace, so Kustomize's namespace transformer injects the
# right one per consumer automatically - one file instead of ~17
# near-duplicates.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  selector: all()
  types:
    - Ingress
  ingress:
    - action: Allow
      source:
        selector: all()
