# sops --encrypt --in-place b2-secret.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: rgw-nas-sync-b2-credentials
stringData:
  # Same B2 Application Key as kubernetes/apps/kopiur-system/kopiur/repository/b2-secret.yaml
  # (scoped to the kopiur-backups bucket) - duplicated here rather than
  # referenced cross-namespace since this component gets applied into 8
  # different namespaces and there's no cross-namespace secret projection
  # for plain Kustomize components (unlike kopiur's own credentialProjection).
  B2_KEY_ID: ""
  B2_KEY: ""
