---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    # Jenkins-style H: a deterministic per-app minute within the hour, so
    # every app using this component doesn't fire in the same instant.
    # Fixed and not parameterized on purpose - one schedule shape for
    # everything using this component.
    cron: "H * * * *"
    runOnCreate: false
