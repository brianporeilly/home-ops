---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/restore_v1alpha1.json
# Passive populator: sits idle until a PVC's spec.dataSourceRef claims it
# (app-template supports this natively via persistence.<name>.dataSourceRef:
# {apiGroup: kopiur.home-operations.com, kind: Restore, name: ${APP}}).
# Adding this CR has no effect on a live cluster by itself - it only
# matters once an app's own helmrelease.yaml also sets dataSourceRef, and
# even then dataSourceRef only fires at PVC *creation* time, so existing
# bound PVCs are unaffected. The payoff is a torn-down-and-rebuilt cluster:
# Flux re-applies the HelmRelease, app-template creates a fresh PVC, and
# this populates it from the last kopia snapshot before the app's own pod
# ever starts.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  # Resolves via the SnapshotPolicy's identity even with no Snapshot CR
  # present yet (a fresh cluster hasn't recreated any) - "deploy-or-restore".
  source:
    fromPolicy:
      name: ${APP}
  target:
    populator: {}
  # Continue (not the Fail default): a brand-new app with nothing backed up
  # yet under this identity should just get an empty volume and start
  # normally, not block forever waiting for a snapshot that will never
  # appear. An app that already has real backup history still restores it -
  # this only kicks in for the genuinely-never-backed-up case.
  policy:
    onMissingSnapshot: Continue
  # Same cross-namespace requirement as the SnapshotPolicy - see the
  # equivalent comment in snapshotpolicy.yaml.
  credentialProjection:
    enabled: true
  mover:
    cache:
      mode: Persistent
      capacity: ${KOPIUR_CACHE_CAPACITY:=2Gi}
      storageClassName: nfs-slow
    # Deliberately NOT using mover.inheritSecurityContextFrom.snapshot here.
    # Per kopiur's own docs (security-context.md, restores.md "Declarative
    # re-bootstrap"), that mode is designed for restoring a cluster that has
    # a REAL prior snapshot to replay identity from - paired with
    # deploy-or-restore (onMissingSnapshot: Continue) on a genuinely
    # never-backed-up identity, the catalog scan it waits on can never find
    # a matching row, so it holds forever on SecurityContextInherited=False/
    # MissingRecordedIdentity - "the expected intermediate state" per the
    # docs, but only if a snapshot is eventually going to exist. The docs'
    # own fix is to pair it with an explicit mover.securityContext fallback;
    # we don't maintain one per-app, so instead we just don't use inherit at
    # all here and fall back to the ClusterRepository's moverDefaults
    # (1000:1000, see nas-backups' clusterrepository.yaml) - same pattern
    # upstream's own reference repo (onedr0p/home-ops) uses. Covers every
    # app on the cluster's UID-1000 convention. An app whose SnapshotPolicy
    # needed a non-standard mover.securityContext override to back up (root
    # + DAC_OVERRIDE) will need a matching explicit override on ITS Restore
    # too before a real cluster-rebuild restore - not yet needed since none
    # has been through one.
