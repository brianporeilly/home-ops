---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_securitypolicies.yaml
# External twin of components/authentik/protect - see that file for the
# full rationale. Consumed alongside it for an app that needs SSO on both
# an internal and external route; always targets auth.oreillys.io (fixed,
# unlike protect's AUTH_HOSTNAME var - there's only one external hostname).
# Reuses the SAME ${APP}-oidc-client-secret Secret `protect`'s own
# component creates (Reflector mirror of the canonical credential ESO
# generates) - one shared client_id/secret pair, two redirect_uris on the
# same Authentik provider. Only safe because this component is never
# consumed without `protect` also present in the same Kustomization.
# Worked example (route.app/route.internal naming per grocy's helmrelease.yaml):
#   spec:
#     components:
#       - ../../../../components/authentik/protect
#       - ../../../../components/authentik/protect-external
#     postBuild:
#       substitute:
#         APP: grocy
#         HTTPROUTE_NAME: grocy-internal
#         HOSTNAME: grocy.internal.oreillys.io
#         AUTH_HOSTNAME: auth.internal.oreillys.io
#         EXTERNAL_HTTPROUTE_NAME: grocy-app
#         EXTERNAL_HOSTNAME: grocy.oreillys.io
#
# Consumed live by echo and navidrome. The NAT hairpin concern this
# comment used to flag doesn't apply - confirmed via `getent hosts
# auth.oreillys.io` from an in-cluster pod, which resolves straight to
# envoy-external's own VIP (10.21.0.1), same as any other in-cluster
# client - so Envoy's own token-exchange call never leaves the cluster or
# touches the router at all, same as the browser leg. Matches the same
# assurance already relied on by audiobookshelf's own server-to-Authentik
# OIDC calls (see that app's oidc-bootstrap script comment). Full
# end-to-end login (not just the redirect mechanics) still worth a human
# check the first time a new app's external route goes live, same as any
# other OIDC wiring.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${EXTERNAL_HTTPROUTE_NAME}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${EXTERNAL_HTTPROUTE_NAME}
  oidc:
    provider:
      issuer: "https://auth.oreillys.io/application/o/${APP}/"
      authorizationEndpoint: "https://auth.oreillys.io/application/o/authorize/"
      tokenEndpoint: "https://auth.oreillys.io/application/o/token/"
      endSessionEndpoint: "https://auth.oreillys.io/application/o/${APP}/end-session/"
    clientIDRef:
      name: ${APP}-oidc-client-secret
    clientSecret:
      name: ${APP}-oidc-client-secret
    redirectURL: "https://${EXTERNAL_HOSTNAME}/oauth2/callback"
    logoutPath: "/logout"
