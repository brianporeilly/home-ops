---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_securitypolicies.yaml
# Reusable component, consumed from the protected app's ks.yaml:
#   spec:
#     components:
#       - ../../../../components/authentik/protect
#     dependsOn:
#       - name: authentik
#         namespace: authentik
#     postBuild:
#       substitute:
#         APP: echo
#         HTTPROUTE_NAME: echo
#         HOSTNAME: echo.internal.oreillys.io
#         AUTH_HOSTNAME: auth.internal.oreillys.io
#
# dependsOn: authentik is required, not optional - without it, this
# component's oidc-client-secret.yaml (a Reflector mirror) can lose a race
# against authentik/app's own ExternalSecret and get stuck permanently
# rejected. Confirmed live on whisker's initial rollout; fix confirmed
# sufficient in practice despite not fully closing the window.
#
# HTTPROUTE_NAME is separate from APP because bjw-s app-template's named
# route.<key> blocks (route.app + route.internal, e.g. grocy's
# helmrelease.yaml) produce HTTPRoute objects named <release>-<key>, not
# <release> or the app slug (confirmed via `helm template`). Single-route
# apps (echo, kopiur-ui) just happen to have HTTPROUTE_NAME == APP.
#
# AUTH_HOSTNAME is a var (not hardcoded) so this component also covers the
# external leg of a dual-exposure app - pair with
# components/authentik/protect-external (fixed to auth.oreillys.io) for
# the second HTTPRoute. See that component for the external-specific
# caveats.
#
# clientID/clientSecret both come from oidc-client-secret.yaml (this
# component, below) - a Reflector-mirrored copy of the canonical
# `${APP}-oidc-credentials` Secret that External Secrets Operator
# generates in the authentik namespace. Nothing to create per-app for the
# credential itself. Still needed per-app, elsewhere: the matching
# ExternalSecret in authentik/authentik/app/ (generates the canonical
# credential) and an OAuth2Provider/Application entry in
# authentik/authentik/app/blueprints-protected-apps.yaml (Authentik's
# blueprint ConfigMaps are a fixed list on its own HelmRelease, in a
# different Kustomization, unreachable from here).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${HTTPROUTE_NAME}
spec:
  # Must live in the same namespace as its target (kubectl explain
  # securitypolicy.spec.targetRef) - Flux's spec.targetNamespace handles
  # that for every resource this component's consumer creates.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${HTTPROUTE_NAME}
  oidc:
    # No provider.backendRef needed - Envoy just resolves AUTH_HOSTNAME
    # like any HTTPS client (confirmed end-to-end on echo/kopiur-ui).
    # AUTH_HOSTNAME must exactly match a hostname actually routed to
    # Authentik, since issuer_mode: per_provider derives the issuer from
    # the request's Host header - a mismatch fails OIDC's issuer check.
    #
    # authorizationEndpoint/tokenEndpoint are pinned rather than
    # discovered: Envoy Gateway's control-plane does a one-shot fetch of
    # .well-known/openid-configuration at reconcile time, and if that
    # fetch times out (e.g. Authentik mid-restart) it latches a permanent
    # 500 with no auto-retry until the next spec change. Both values are
    # stable and shared across every provider on a given AUTH_HOSTNAME, so
    # pinning them removes the fetch entirely. JWKS isn't affected - that
    # validation happens on the data plane with its own retry handling.
    provider:
      issuer: "https://${AUTH_HOSTNAME}/application/o/${APP}/"
      authorizationEndpoint: "https://${AUTH_HOSTNAME}/application/o/authorize/"
      tokenEndpoint: "https://${AUTH_HOSTNAME}/application/o/token/"
      # Per-app (includes the slug), unlike the two above. Must also be
      # explicit: EG only auto-discovers this when authorizationEndpoint
      # or tokenEndpoint is missing, so pinning those two above would
      # otherwise silently break logout.
      endSessionEndpoint: "https://${AUTH_HOSTNAME}/application/o/${APP}/end-session/"
    clientIDRef:
      name: ${APP}-oidc-client-secret
    clientSecret:
      name: ${APP}-oidc-client-secret
    # Envoy Gateway's own callback convention. Must match a redirect_uris
    # entry in this app's Authentik blueprint.
    redirectURL: "https://${HOSTNAME}/oauth2/callback"
    logoutPath: "/logout"
    # Named so the jwt block below can read it back out on every
    # subsequent request (the browser echoes this cookie itself - Envoy
    # doesn't need to re-inject anything mid-chain). Fixed name is fine to
    # share across apps: cookies are scoped per-hostname by the browser
    # anyway, and every app here has its own hostname.
    cookieNames:
      idToken: authentik-id-token
  # Forwards the caller's Authentik identity to the backend as a header,
  # for apps that can make use of it (e.g. navidrome's ND_EXTAUTH_USERHEADER
  # trusted-proxy-auth) - a plain access gate otherwise, this makes the
  # gate also assert *who*. Additive and harmless for every app that
  # doesn't look at the header (the rest of the apps using this
  # component today just ignore it) - not gated behind a variable, so no
  # per-app opt-in needed.
  #
  # This only verifies the JWT Envoy itself already saw and stored in the
  # cookie above - it isn't a second independent check that could reject a
  # legitimate session. optional: true means a request without the cookie
  # yet (e.g. mid-login-redirect) falls through unauthenticated rather
  # than getting a hard 401 from this filter - the oidc block above is
  # still the actual access gate.
  #
  # IMPORTANT: the injected header is only as trustworthy as who can reach
  # the backend directly, bypassing this Gateway entirely - Envoy is the
  # only thing that verifies the JWT signature before setting the header.
  # Any app that trusts this header MUST also restrict, at the network
  # layer, who can reach it (see navidrome's helmrelease.yaml
  # ND_EXTAUTH_TRUSTEDSOURCES comment for the current state of that on this
  # cluster - namespace-scoped via Calico today, not pinpointed to Envoy
  # specifically).
  jwt:
    providers:
      - name: authentik
        issuer: "https://${AUTH_HOSTNAME}/application/o/${APP}/"
        remoteJWKS:
          uri: "https://${AUTH_HOSTNAME}/application/o/${APP}/jwks/"
        extractFrom:
          cookies:
            - authentik-id-token
        claimToHeaders:
          - claim: email
            header: Remote-User
    optional: true
