---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_securitypolicies.yaml
# Reusable component. Consume from the protected app's ks.yaml (not its
# local kustomization.yaml) - see kubernetes/apps/network/echo/ks.yaml for a
# worked example:
#   spec:
#     components:
#       - ../../../../components/authentik/protect
#     postBuild:
#       substitute:
#         APP: echo
#         HOSTNAME: echo.internal.oreillys.io
#         OIDC_CLIENT_ID: ccf8e9cebe8abbcfd1ba325730f1db15371be26c
# ${APP}, ${HOSTNAME}, ${OIDC_CLIENT_ID} are required (no defaults),
# substituted via Flux's postBuild.substitute. Two things this component
# doesn't cover, still needed per-app:
# 1. An `${APP}-oidc-client-secret` Secret in the app's own namespace (key
#    `client-secret`, sops-encrypted) - see
#    kubernetes/apps/network/echo/app/oidc-client-secret.yaml. Kept as a
#    real per-app file rather than templated, since each app's client
#    secret value is genuinely unique (unlike, say, kopiur's shared backup
#    repository credentials).
# 2. A matching OAuth2Provider/Application blueprint entry on the Authentik
#    side (kubernetes/apps/authentik/authentik/app/blueprints-protected-apps.yaml)
#    - Authentik's own chart mounts blueprint ConfigMaps via a fixed list in
#    its HelmRelease values, which lives in a different Flux Kustomization
#    entirely and can't be reached from here.
# ${APP} must match the target HTTPRoute's name exactly (assumed identical -
# true for every app protected so far) and the Authentik Application slug
# used in the blueprint's issuer URL below.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  # Must live in the same namespace as its target - confirmed via
  # `kubectl explain securitypolicy.spec.targetRef` ("This policy and the
  # TargetRef MUST be in the same namespace for this Policy to have
  # effect"). Flux targets this at the protected app's own namespace via
  # spec.targetNamespace on its ks.yaml, same as every other resource this
  # component's consumer creates.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  oidc:
    # No provider.backendRef - confirmed unnecessary end-to-end (including
    # the token-exchange leg) on both echo and kopiur-ui. Envoy just
    # resolves auth.internal.oreillys.io like any HTTPS client, same as
    # Envoy Gateway's own canonical docs example (which authenticates
    # against https://accounts.google.com with no backendRef at all).
    # auth.internal.oreillys.io (not the longer authentik.internal.oreillys.io)
    # is the canonical issuer hostname - Authentik's issuer_mode:
    # per_provider computes the issuer from the request's own Host header,
    # so this must exactly match a hostname actually routed to Authentik
    # (kubernetes/apps/authentik/authentik/app/helmrelease.yaml's
    # server.route.main.hostnames) or OIDC discovery's issuer-match check
    # will reject it.
    # authorizationEndpoint/tokenEndpoint set explicitly (not left to
    # discovery) to route around a real, confirmed-live failure mode:
    # Envoy Gateway's *control-plane* controller does a one-shot HTTP
    # fetch of .well-known/openid-configuration at reconcile time to
    # resolve these two fields, and if that fetch times out (e.g.
    # Authentik mid-restart from an unrelated upgrade), it latches a
    # permanent error into this SecurityPolicy's status - "setting 500
    # direct response in routes due to errors in SecurityPolicy" - with no
    # automatic retry once Authentik comes back healthy; only a spec
    # change (forcing re-reconcile) clears it. Both values are stable/
    # shared across every provider (confirmed by curling the discovery doc
    # directly - unlike issuer/end_session_endpoint, these two don't
    # include the app slug), so hardcoding them removes the fragile fetch
    # entirely without losing anything. JWKS validation isn't affected -
    # that happens on the data plane with its own retry/refresh handling,
    # not this control-plane one-shot path.
    provider:
      issuer: "https://auth.internal.oreillys.io/application/o/${APP}/"
      authorizationEndpoint: "https://auth.internal.oreillys.io/application/o/authorize/"
      tokenEndpoint: "https://auth.internal.oreillys.io/application/o/token/"
      # Per-app (includes the slug), unlike the two above - and must be set
      # explicitly too: EG only auto-discovers this when authorizationEndpoint
      # or tokenEndpoint is ALSO missing, so providing those two above would
      # otherwise silently leave this unset and break logout.
      endSessionEndpoint: "https://auth.internal.oreillys.io/application/o/${APP}/end-session/"
    clientID: "${OIDC_CLIENT_ID}"
    clientSecret:
      name: ${APP}-oidc-client-secret
    # Envoy Gateway's own callback convention: <route-path-prefix>/oauth2/callback.
    # Must match the redirect_uris entry in this app's Authentik blueprint.
    redirectURL: "https://${HOSTNAME}/oauth2/callback"
    logoutPath: "/logout"
