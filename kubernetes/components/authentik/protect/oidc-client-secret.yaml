---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Reflector "pull" mirror of the canonical `${APP}-oidc-credentials`
# Secret External Secrets Operator generates in the authentik namespace
# (authentik/authentik/app/, per-app ExternalSecret + shared generators in
# oidc-generators.yaml). Reflector populates client-id/client-secret keys
# here automatically - nothing else to create per-app for the credential
# itself. The source Secret must carry a matching
# reflection-allowed-namespaces annotation permitting this namespace, or
# Reflector refuses to mirror.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-oidc-client-secret
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "authentik/${APP}-oidc-credentials"
type: Opaque
